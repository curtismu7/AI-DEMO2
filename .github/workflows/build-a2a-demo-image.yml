name: Build A2A demo image

# The standalone Privilege A2A demo (main agent, worker agent, MCP server: one
# image, three commands) is not a docker-compose service, so it is not in the
# shared matrix of build-images.yml. It gets its own small workflow instead of a
# new entry in that matrix: a mistake here can only fail THIS job, never the 12
# service images. It publishes sha-<sha> and :latest, exactly what the manual
# `docker buildx build ... --push` did. DEPLOYING stays manual:
#   kubectl -n <ns> set image deploy/mainagentdemo '*=...:sha-<sha>'
#   kubectl -n <ns> rollout restart deploy/workeragentdemo   (and mcpdemo if it changed)
# then bump the pin in k8s/privilege-a2a/deployment.yaml.
#
# SOURCE: while k8s/privilege-a2a/LAB_REF holds the word "pending", the image is
# built from standalone/privilege-a2a-anthropic-demo as before. Once it holds a
# 40-character commit of ping-sandbox/privilege-a2a-anthropic-demo-LAB, the image
# is built from that commit instead (same image name, so the cluster does not
# change). Reading that repo needs the secret PRIVILEGE_A2A_LAB_READ_TOKEN (a
# read-only token or fine-grained PAT with Contents: read on that one repo).
#
# ONE-TIME SETUP (UI only, cannot be done from code): on
# github.com/users/cmuir_pingcorp/packages/container/privilege-a2a-demo open
# Package settings -> "Manage Actions access" and add this repository with the
# Write role. Until then the push fails with "denied: permission_denied:
# write_package" — same trap as build-images.yml documents. The Dockerfile's
# org.opencontainers.image.source label covers the other half.

on:
  push:
    branches: [main]
    paths:
      - 'standalone/privilege-a2a-anthropic-demo/**'
      - 'k8s/privilege-a2a/LAB_REF'
      - '.github/workflows/build-a2a-demo-image.yml'
  workflow_dispatch:

concurrency:
  group: build-a2a-demo-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push privilege-a2a-demo (arm64)
    runs-on: [self-hosted, macOS]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Pick the source (standalone folder or the LAB repo at a pinned commit)
        id: src
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < k8s/privilege-a2a/LAB_REF)"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "lab_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "building from the LAB repo at $ref"
          else
            echo "lab_ref=" >> "$GITHUB_OUTPUT"
            echo "LAB_REF is not a commit (${ref}); building from standalone/privilege-a2a-anthropic-demo"
          fi
      - name: Check out the LAB repo at the pinned commit
        if: steps.src.outputs.lab_ref != ''
        uses: actions/checkout@v7
        with:
          repository: ping-sandbox/privilege-a2a-anthropic-demo-LAB
          ref: ${{ steps.src.outputs.lab_ref }}
          token: ${{ secrets.PRIVILEGE_A2A_LAB_READ_TOKEN }}
          path: lab-source
          persist-credentials: false
      # Same job-scoped Docker config and live-socket steps as build-images.yml;
      # see the comments there for why each one exists (launchd runners cannot
      # use the keychain, and an OrbStack runner's default socket can be dead).
      - name: Use a job-scoped Docker config (no keychain)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/docker-config"
          mkdir -p "$cfg"
          ln -s "$HOME/.docker/cli-plugins" "$cfg/cli-plugins"
          echo '{"auths":{"placeholder.invalid":{}}}' > "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"
      - name: Use a live Docker socket
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "default Docker socket is live"
            exit 0
          fi
          for s in "$HOME/.orbstack/run/docker.sock" "$HOME/.docker/run/docker.sock"; do
            if [ -S "$s" ] && DOCKER_HOST="unix://$s" docker info >/dev/null 2>&1; then
              echo "DOCKER_HOST=unix://$s" >> "$GITHUB_ENV"
              echo "default Docker socket is dead; using $s"
              exit 0
            fi
          done
          echo "no live Docker socket found (is OrbStack running on this runner?)" >&2
          exit 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the cluster (arm64) and push sha and latest tags
        # --provenance=false keeps a plain single-platform manifest, as the
        # manual build did; the SE cluster nodes are Graviton (arm64).
        run: |
          set -euo pipefail
          BASE="ghcr.io/${{ github.repository_owner }}/privilege-a2a-demo"
          CONTEXT=standalone/privilege-a2a-anthropic-demo
          EXTRA=()
          if [ -n "${{ steps.src.outputs.lab_ref }}" ]; then
            CONTEXT=lab-source
            # Keep the package linked to this repo (the LAB Dockerfile labels its own repo).
            EXTRA=(--label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" --label "io.ping.lab.ref=${{ steps.src.outputs.lab_ref }}")
          fi
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            -t "$BASE:sha-${{ github.sha }}" \
            -t "$BASE:latest" \
            --push \
            "$CONTEXT"
