name: CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Full commit SHA to test; leave blank to test the selected ref
        type: string
        required: false
        default: ''
  pull_request:
    # ready_for_review is not a default type; without it a draft marked ready
    # would get no CI run, because the jobs below skip while the PR is a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'

concurrency:
  group: ci-${{ inputs.target_ref || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'interactive' }}
  # Superseding is safe here: this workflow only runs tests. Image builds live
  # in build-images.yml, which keys its own group by github.sha precisely so a
  # merge's build can never be evicted by a later merge — see that file.
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Select affected test suites
    # Draft PRs skip CI to keep the single self-hosted runner's queue short.
    # Every other job descends from this one (gates needs changes; the suites
    # need gates), so skipping it skips the whole run. Skipped required checks
    # count as passing, and a draft cannot be merged anyway.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, macOS]
    outputs:
      api-server: ${{ steps.all.outputs['api-server'] || steps.nightly.outputs['api-server'] || steps.filter.outputs['api-server'] }}
      decision-services: ${{ steps.all.outputs['decision-services'] || steps.nightly.outputs['decision-services'] || steps.filter.outputs['decision-services'] }}
      ui: ${{ steps.all.outputs['ui'] || steps.nightly.outputs['ui'] || steps.filter.outputs['ui'] }}
      ui-changed-files: ${{ steps.ui-files.outputs.files || '[]' }}
      unwired-services: ${{ steps.all.outputs['unwired-services'] || steps.nightly.outputs['unwired-services'] || steps.filter.outputs['unwired-services'] }}
      python-agents: ${{ steps.all.outputs['python-agents'] || steps.nightly.outputs['python-agents'] || steps.filter.outputs['python-agents'] }}
    steps:
      - name: Validate optional target commit SHA
        if: github.event_name == 'workflow_dispatch' && inputs.target_ref != ''
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if ! [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_ref must be a full 40-character commit SHA"
            exit 1
          fi
      - name: Run every suite on manual CI
        if: github.event_name == 'workflow_dispatch'
        id: all
        run: |
          {
            echo "api-server=true"
            echo "decision-services=true"
            echo "ui=true"
            echo "unwired-services=true"
            echo "python-agents=true"
          } >> "$GITHUB_OUTPUT"
      - name: Run every suite in nightly CI
        # Nightly is the full-coverage safety net now that push-to-main is
        # path-filtered below like pull_request — see 2026-09-30 CI queue note.
        if: github.event_name == 'schedule'
        id: nightly
        run: |
          {
            echo "api-server=true"
            echo "decision-services=true"
            echo "ui=true"
            echo "unwired-services=true"
            echo "python-agents=true"
          } >> "$GITHUB_OUTPUT"
      - name: Select suites affected by this PR or push
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # CI workflow edits are checked by actionlint and the always-on gates
          # below; they do not by themselves require every product test suite.
          # Manual runs select every suite; nightly selects every suite as the
          # full-coverage safety net for the same-day merges this filtering
          # might otherwise combine without a dedicated full run.
          filters: |
            api-server:
              - 'demo_api_server/**'
              - 'demo_authz_server/scopeTopology.js'
              - 'demo_llm_proxy/**'
              - 'scope-topology.json'
              - 'snapshots/**'
            decision-services:
              - 'package.json'
              - 'demo_authz_server/**'
              - 'demo_api_server/data/publicBranchCatalog.js'
              - 'demo_mcp_gateway/**'
              - 'oauth-mcp/**'
              - 'demo_mcp_resource_server/**'
              # demo_authz_server/routes/import-snapshot.js require()s this file
              # directly and validates snapshots against its resources/tools, so a
              # SoT-only change can break the authz suite. Without this entry such
              # a PR selected `api-server` but NOT this job, and the drift landed
              # green: that is exactly how the API-Key gateway identity got into
              # scope-topology.json and the generator while the validator's
              # GATEWAY_RESOURCE_NAMES stayed at 3, leaving the tracked snapshot
              # rejected with a false 409 until someone ran the suite by hand.
              - 'scope-topology.json'
              - 'snapshots/**'
              - 'scripts/test-service-suite.sh'
              - 'scripts/test-snapshots.sh'
            ui:
              - 'demo_api_ui/**'
            unwired-services:
              - 'scripts/test-service-suite.sh'
              - 'demo_agent_service/**'
              - 'demo_hitl_service/**'
              - 'demo_mcp_code_search/**'
              - 'agent_token_service/**'
              - 'demo_api_resource_server/**'
            python-agents:
              - 'langchain_agent/**'
              - 'llamaindex_agent/**'
      - name: Collect changed UI paths for related tests
        if: github.event_name == 'pull_request' && steps.filter.outputs.ui == 'true'
        id: ui-files
        uses: actions/github-script@v9
        with:
          script: |
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const uiFiles = changed
              .filter(({ filename, previous_filename }) =>
                filename.startsWith('demo_api_ui/') || previous_filename?.startsWith('demo_api_ui/'))
              .map(({ filename, previous_filename, status }) => ({ filename, previous_filename, status }));
            core.setOutput('files', JSON.stringify(uiFiles));

  gates:
    name: Hygiene + topology gates
    needs: changes
    # Run selection first, then run repository gates on the single CI runner.
    runs-on: [self-hosted, macOS]
    # 15 was too tight: a slow-network `npm ci` alone took 17.5 min and timed out an all-green run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - name: Lint GitHub Actions workflows
        run: /opt/homebrew/bin/actionlint .github/workflows/ci.yml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Skip restoring the >1 GiB npm cache on this shared-runner gate.
          package-manager-cache: false
      # Deps install FIRST. hygiene:check used to run against a bare checkout,
      # which worked only while every command in the chain was dependency-free.
      # 04487cdf appended `gen-intent-topology.js check`, and that one loads
      # nlIntentParser -> verticalDispatch -> verticalManifest/schema.js ->
      # zod, so the step died with `Cannot find module 'zod'` in 12s. Nothing in
      # hygiene:check asserts a bare checkout — check-fresh-clone-hygiene.js
      # inspects committed files (home paths, .mcp.json, compose/k8s env), not
      # node_modules — so installing first costs a cache-warm minute and
      # removes a whole class of "gate is red for a reason unrelated to the PR".
      - name: Install demo_api_server deps (hygiene + topology gates both need them)
        run: npm ci --prefix demo_api_server --no-audit --no-fund
      - name: Install demo_mcp_gateway deps (topology step 6 runs toolSchemaDrift jest)
        run: npm ci --prefix demo_mcp_gateway --no-audit --no-fund
      - name: Mock-drift gate (jest.mock missing load-bearing exports)
        run: node scripts/check-mock-drift.js
      - name: Fresh-clone hygiene
        run: npm run hygiene:check
      - name: REGRESSION_PLAN §1 paths exist
        run: npm run regression:paths
      - name: Root allowlist gate
        run: npm run root:allowlist:check
      # Parses App.js's JSX, so it needs @babel/parser — the demo_api_server
      # install above provides it (see scripts/lib/appRouteAudit.js). These run
      # here rather than in the jest job because jest cannot resolve the parser
      # from a root-level script no matter how it is required.
      - name: Auth-requirement no-drift gate
        run: npm run authz:verify
      - name: Auth-requirement gate — own tests
        run: node --test scripts/check-auth-requirements.test.js
      - name: Topology no-drift gate
        run: npm run topology:verify
      # se-undeploy wipes a SHARED cluster namespace, so its confirmation and
      # the `stop` refusal are worth a gate: a future edit that drops either
      # would be silent otherwise. kubectl is stubbed inside the test, so this
      # never reaches a cluster, and it needs no .env or PING_EMAIL.
      - name: Deploy teardown guards — own tests
        run: bash scripts/test-se-undeploy-guard.sh
      # The image build resolves its compose file relative to $PWD, so running
      # it from anywhere but the repo root builds the wrong tree — and exits 0
      # while doing it, so the push ships nothing and the deploy still reports
      # success. docker is stubbed here; nothing is built or pushed.
      - name: Build cwd guard — own tests
        run: bash scripts/test-k8-build-cwd.sh

  # Suites run in PARALLEL after the gates. They used to be chained when the
  # repo had ONE self-hosted Mac runner; with two registered, one PR can use
  # both instead of waiting on a serial chain. (GitHub-hosted runners are
  # disabled for this repo by the enterprise, so everything stays self-hosted.)
  api-server-tests:
    name: API server tests (Jest)
    needs: [changes, gates]
    if: needs.changes.outputs['api-server'] == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Shares the oversized npm cache with the gates job.
          package-manager-cache: false
      - name: Install deps
        run: npm ci --prefix demo_api_server --no-audit --no-fund
      - name: Run Jest suite
        # The persistent runner can inherit local gateway aliases; unit tests
        # configure their own endpoints and must not be redirected to live URLs.
        run: |
          env -u BFF_BASE_URL \
            -u MCP_GATEWAY_HTTP_URL \
            -u MCP_PINGGATEWAY_URL \
            -u MCP_DEMO_GATEWAY_URL \
            -u MCP_PRIVILEGE_GATEWAY_URL \
            -u PINGGATEWAY_URL \
            ATTACK_SIM_REAL_API=false \
            npm test --prefix demo_api_server

  ui-tests:
    # demo_api_ui appeared NOWHERE in this file until 2026-08-17 — the fourth
    # time the pattern documented under authz-decision-tests bit. 3168 vitest
    # tests and the `npm run build` gate that demo_api_ui/CLAUDE.md calls "the
    # gate" had never run in CI; the only evidence any UI change was safe came
    # from whoever remembered to run it locally. Found while merging the MCP
    # 401-challenge work, where a UI-heavy PR went green with no UI job on it.
    #
    # Its own job rather than bundled into api-server-tests: the UI dep tree is
    # separate and large, so bundling would force a UI install onto every
    # server-only PR. Gated on the `ui` filter, so it costs a runner only when
    # demo_api_ui actually changed.
    #
    # Both steps matter and neither substitutes for the other — vitest does not
    # typecheck or resolve the production bundle, and a green test run over a
    # module that fails `vite build` is exactly the false pass demo_api_ui's
    # CLAUDE.md warns about.
    name: UI tests (Vitest) + build
    needs: [changes, gates]
    if: needs.changes.outputs['ui'] == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      # Older target commits predate the 4 GB Vitest RSS guard. Preserve the
      # current guard from this workflow revision, then check out the target.
      - name: Checkout current UI memory guard
        if: github.event_name == 'workflow_dispatch' && inputs.target_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _ci-workflow
          sparse-checkout: |
            demo_api_ui/scripts/run-vitest-with-memory-guard.mjs
            demo_api_ui/scripts/select-vitest-mode.mjs
            demo_api_ui/scripts/vitest-memory-guard.config.mjs
          sparse-checkout-cone-mode: false
      - name: Preserve current UI memory guard
        if: github.event_name == 'workflow_dispatch' && inputs.target_ref != ''
        run: |
          mkdir -p "$RUNNER_TEMP/ci-ui-guard"
          cp _ci-workflow/demo_api_ui/scripts/run-vitest-with-memory-guard.mjs "$RUNNER_TEMP/ci-ui-guard/"
          cp _ci-workflow/demo_api_ui/scripts/select-vitest-mode.mjs "$RUNNER_TEMP/ci-ui-guard/"
          cp _ci-workflow/demo_api_ui/scripts/vitest-memory-guard.config.mjs "$RUNNER_TEMP/ci-ui-guard/"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - name: Restore current UI memory guard
        if: github.event_name == 'workflow_dispatch' && inputs.target_ref != ''
        run: |
          mkdir -p demo_api_ui/scripts
          cp "$RUNNER_TEMP/ci-ui-guard/run-vitest-with-memory-guard.mjs" demo_api_ui/scripts/
          cp "$RUNNER_TEMP/ci-ui-guard/select-vitest-mode.mjs" demo_api_ui/scripts/
          cp "$RUNNER_TEMP/ci-ui-guard/vitest-memory-guard.config.mjs" demo_api_ui/scripts/
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The shared Mac's npm cache is over 1 GiB and costs more time to
          # restore/save than it saves during dependency installation.
          package-manager-cache: false
      - name: Install deps
        run: npm ci --prefix demo_api_ui --no-audit --no-fund
      # Vitest, not jest — see demo_api_ui/CLAUDE.md. CI=true keeps the reporter
      # non-interactive and makes `vitest run` exit non-zero on failure.
      # `--prefix` goes BEFORE `run`: after a script name npm's parser is
      # ambiguous about whether a flag is npm's or the script's.
      - name: Related Vitest unit tests for pull requests
        if: github.event_name == 'pull_request'
        run: npm --prefix demo_api_ui run test:unit:pr
        env:
          CI: 'true'
          VITEST_RELATED_FILES_JSON: ${{ needs.changes.outputs['ui-changed-files'] }}
      - name: Full Vitest suite for pinned target refs (4 GB guarded)
        if: github.event_name == 'workflow_dispatch' && inputs.target_ref != ''
        working-directory: demo_api_ui
        run: node scripts/run-vitest-with-memory-guard.mjs unit
        env:
          CI: 'true'
      # Not on push to main: the merged PR already ran its Vitest step on this
      # code, and the full 704-file jsdom suite took 7-12 min per merge on the
      # shared self-hosted Mac, backing up the whole queue. Nightly (schedule)
      # stays the full-coverage net for same-day merge combinations.
      - name: Full Vitest unit suite on nightly and ordinary manual runs
        if: github.event_name != 'pull_request' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.target_ref == '')
        run: npm --prefix demo_api_ui run test:unit
        env:
          CI: 'true'
      - name: Vite build gate
        run: npm --prefix demo_api_ui run build

      # The movie reel has gone missing FIVE times, and every previous guard was
      # a static source check that stayed green while the reel was off screen.
      # This is one Playwright spec, four assertions, all `toBeInViewport()` —
      # the only check that fails for all five causes. The API is mocked, so it
      # runs against the dev server this job starts, with no stack behind it.
      # One chromium download (~40s) on UI PRs only; the alternative has cost a
      # live demo five times.
      - name: Install chromium for the movie-reel lock
        run: npm --prefix demo_api_ui exec -- playwright install --with-deps chromium
      - name: Movie reel is on screen (Playwright)
        working-directory: demo_api_ui
        run: node_modules/.bin/playwright test tests/e2e/movie-reel-visible.spec.js
        env:
          CI: 'true'
          BANKING_UI_PORT: '4173'

  unwired-service-suites:
    # 2026-08-17: an audit found ~117 test files across ten services that NO job
    # ran — the same pattern this file already documents three times above
    # authz-decision-tests, at a scale nobody had measured. Six of them are Node
    # services, bundled into ONE job for the Actions-budget reason given there.
    #
    # Five run BLOCKING (SUITE_BLOCKING=1): each was verified fully green before
    # being wired up, so a red here is a regression, not inherited debt.
    #   demo_agent_service 133 · demo_mcp_code_search 32 · agent_token_service 11
    #   demo_hitl_service · demo_api_resource_server
    # test-service-suite.sh still fails the job if a suite cannot RUN, which is
    # the distinction it exists to draw — "0 tests ran" must not look like
    # "all tests passed".
    name: Unwired service suites (agent, hitl, code-search, token, resource-server)
    needs: [changes, gates]
    if: needs.changes.outputs['unwired-services'] == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # demo_agent_service/tests/vault.test.ts imports ACROSS the package
      # boundary — ../demo_api_server/lib/vault/ — which requires argon2, a
      # demo_api_server dependency. Locally that resolves because the sibling's
      # node_modules exists; on a clean runner it does not, and the suite failed
      # to collect (125 tests passed, 1 suite never loaded). Installing the
      # sibling's deps is the smallest honest fix; the cross-package import
      # itself is logged in TECH_DEBT.
      - name: Install demo_api_server deps (demo_agent_service's vault suite imports its lib)
        run: npm ci --prefix demo_api_server --no-audit --no-fund
      - name: demo_agent_service (blocking)
        run: SUITE_BLOCKING=1 bash scripts/test-service-suite.sh agent-service
      - name: demo_hitl_service (blocking)
        run: SUITE_BLOCKING=1 bash scripts/test-service-suite.sh hitl-service
      - name: demo_mcp_code_search (blocking)
        run: SUITE_BLOCKING=1 bash scripts/test-service-suite.sh code-search
      - name: agent_token_service (blocking)
        run: SUITE_BLOCKING=1 bash scripts/test-service-suite.sh agent-token-service
      - name: demo_api_resource_server (blocking)
        run: SUITE_BLOCKING=1 bash scripts/test-service-suite.sh api-resource-server

  python-agent-suites:
    # The remaining uncovered services are Python: langchain_agent (52 test
    # files — the DEFAULT agent framework per CLAUDE.md) and llamaindex_agent.
    # (openai_agent and pydantic_agent were removed with their frameworks.)
    #
    # Wired non-blocking first because they could not be verified locally (only
    # langchain_agent has a .venv here). The first CI run supplied the evidence,
    # and the split is now by measurement rather than assumption:
    #   langchain_agent   834 passed          -> BLOCKING
    #   llamaindex_agent    9 passed, 1 skip  -> BLOCKING
    name: Python agent suites (langchain, llamaindex)
    needs: [changes, gates]
    if: needs.changes.outputs['python-agents'] == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - name: Use the runner's installed Python 3.12
        run: |
          python="$HOME/.local/bin/python3.12"
          if [ ! -x "$python" ]; then
            echo "Python 3.12 is not installed at $python" >&2
            exit 1
          fi
          "$python" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: langchain_agent (blocking — 834 passing)
        run: |
          cd langchain_agent
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -r requirements.txt
          .venv/bin/python -m pytest tests/ -q
      - name: llamaindex_agent (blocking — 9 passing)
        run: |
          cd llamaindex_agent
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --quiet -r requirements.txt pytest
          .venv/bin/python -m pytest tests/ -q

  authz-decision-tests:
    # demo_authz_server and demo_mcp_gateway had ~90 test cases that no job ran.
    # demo_mcp_gateway was installed above ONLY so topology:verify could run an
    # unrelated drift check; its own suites never executed. Both services report
    # pre-existing failures without failing the job (scripts/test-service-suite.sh),
    # but a suite that cannot RUN at all does fail it.
    #
    # oauth-mcp joined for the same reason: `test:mcp-server` existed but no job
    # invoked it, so 21 real failures sat green for weeks — SigningKeyManager
    # reached jose.exportJWK, which the CJS shim did not provide, and every
    # DemoMCPServer lifecycle test died on it. Unrun is indistinguishable from
    # passing until someone looks.
    #
    # demo_mcp_resource_server joined 2026-08-17 for the third time this pattern
    # bit: it had `"test": "jest"` and 168 passing tests, and NO job ran them —
    # it appeared nowhere in this file. Found while renaming its accepted-audience
    # env var (TECH_DEBT T4), where the only proof the change was safe came from
    # a local run.
    #
    # These are bundled into ONE job rather than split into four, because the
    # Actions budget documented at the top of this file is the binding
    # constraint — a separate job means another runner and another npm install
    # for ~90s of tests. Bundling is why this job already spans three services.
    name: Service suites (authz-server + mcp-gateway + mcp-server + mcp-resource-server)
    needs: [changes, gates]
    if: needs.changes.outputs['decision-services'] == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Keep the large shared-runner npm cache out of this grouped suite.
          package-manager-cache: false
      - name: Install demo_authz_server deps
        run: npm ci --prefix demo_authz_server --no-audit --no-fund
      - name: Install demo_mcp_gateway deps
        run: npm ci --prefix demo_mcp_gateway --no-audit --no-fund
      - name: Install oauth-mcp deps
        run: npm ci --prefix oauth-mcp --no-audit --no-fund
      - name: Install demo_mcp_resource_server deps
        run: npm ci --prefix demo_mcp_resource_server --no-audit --no-fund
      # node --test recursion differs by Node major; keep both globs so the
      # tests/ suites (UC16, tier) are never silently skipped.
      # BLOCKING as of 2026-09-07: the tolerance below was for pre-existing
      # failures that no longer exist — the suite is fully green (295 tests
      # across 31 files, verified on three consecutive local runs). Until now
      # test-service-suite.sh defaulted to SUITE_BLOCKING=0 here, so this step
      # exited 0 even when tests failed: a green "Service suites" check meant
      # the suite RAN, not that it passed. Same promotion demo_mcp_gateway got
      # on 2026-08-17. A red here is now a regression.
      - name: demo_authz_server suite (node --test, root + tests/)
        run: SUITE_BLOCKING=1 npm run test:authz-server
      # BLOCKING as of 2026-08-17: the suite is fully green (721 tests) now that
      # the 11 pre-existing failures are fixed — 6 gateway-auth and 3
      # gateway-passthrough that died in setup before any assertion, plus 2
      # gateway-server-hardening flakes. A red here is now a regression.
      - name: demo_mcp_gateway suite (Jest, CI=true --maxWorkers=2)
        run: SUITE_BLOCKING=1 npm run test:mcp-gateway
      # Unlike demo_authz_server above, this one has no pre-existing-failure tolerance:
      # the suite is fully green (894 tests) as of this change, so any red here
      # is a regression and must fail the job.
      - name: oauth-mcp suite (Jest, unit)
        run: npm run test:mcp-server
      # Same contract as oauth-mcp above: no pre-existing-failure tolerance. The
      # suite is fully green (22 suites / 168 tests) as of this change, so any
      # red here is a regression and must fail the job.
      - name: demo_mcp_resource_server suite (Jest)
        run: npm run test:mcp-resource-server
      - name: Cloud P1AZ snapshot drift + DecisionContext coverage
        run: npm run test:snapshots

  main-red-alert:
    # Guard against the 2026-09-26 failure mode: main's CI sat 32-runs red for
    # days because triggers were disabled and nothing watched for redness —
    # broken tests accumulated as invisible debt (the ciba mock drift being
    # the worst case). This job runs ONLY on push-to-main, fails loudly when
    # any suite is red, and writes a machine-readable summary so a future
    # notifier (Slack/webhook) has one file to read. It does not replace
    # branch protection — it makes "main is red" un-missable in the run list.
    name: Main is red (alert)
    needs: [changes, gates, api-server-tests, ui-tests, unwired-service-suites, python-agent-suites, authz-decision-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream jobs
        run: |
          {
            echo "## CI main-red-alert @ ${{ github.sha }}"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| gates | ${{ contains(needs.gates.result, 'success') && '✅' || '❌ ' }} ${{ needs.gates.result }} |"
            echo "| api-server-tests | ${{ contains(needs.api-server-tests.result, 'success') && '✅' || '❌ ' }} ${{ needs.api-server-tests.result }} |"
            echo "| ui-tests | ${{ contains(needs.ui-tests.result, 'success') && '✅' || '❌ ' }} ${{ needs.ui-tests.result }} |"
            echo "| unwired-service-suites | ${{ contains(needs.unwired-service-suites.result, 'success') && '✅' || '❌ ' }} ${{ needs.unwired-service-suites.result }} |"
            echo "| python-agent-suites | ${{ contains(needs.python-agent-suites.result, 'success') && '✅' || '❌ ' }} ${{ needs.python-agent-suites.result }} |"
            echo "| authz-decision-tests | ${{ contains(needs.authz-decision-tests.result, 'success') && '✅' || '❌ ' }} ${{ needs.authz-decision-tests.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Push-to-main is path-filtered, so a suite the merge did not touch
          # is `skipped` — that is not red. Gates always run and must pass.
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if [[ "${{ needs.gates.result }}" != "success" ]] \
             || ! ok "${{ needs.api-server-tests.result }}" \
             || ! ok "${{ needs.ui-tests.result }}" \
             || ! ok "${{ needs.unwired-service-suites.result }}" \
             || ! ok "${{ needs.python-agent-suites.result }}" \
             || ! ok "${{ needs.authz-decision-tests.result }}"; then
            echo "::error::main is RED — every job above must be green on main. This alert exists because 32 consecutive red runs on main went unnoticed (2026-09-26 postmortem). Fix or revert before merging further."
            exit 1
          fi
          echo "main is green across all suites."
