name: Build images

# Split out of ci.yml deliberately. ci.yml uses a shared `ci-<ref>` concurrency
# group, and GitHub allows only ONE PENDING run per group: a newer pending run
# EVICTS the older one regardless of cancel-in-progress. On 2026-08-28 that
# cancelled the build for merge commit 5b22e3a1c one second after the next merge
# queued, before a single job had started — leaving that SHA with no image, and
# promotion is by SHA, so it was permanently unpromotable. Keying this workflow's
# group by github.sha gives every merge commit its own group, so no two merges
# can contend and no build can be evicted by a later one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-images:
    name: Build and push service images
    # Merges only. On a PR there is no merged commit to tag, and CI must not
    # push images for code that may never land.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed paths
        id: changed
        run: |
          # github.event.before is all-zeroes for a force-push or a first push.
          # Build nothing rather than everything: a missed build is recoverable
          # by hand, a surprise 14-image build is noise nobody asked for.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "[changed] unresolvable base '$BEFORE' — building nothing" >&2
            : > changed.txt
          else
            git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
          fi
          wc -l < changed.txt

      - name: Compute build matrix
        id: matrix
        run: |
          ./se-update-code.sh --print-map > map.json
          node scripts/ci-build-matrix.js map.json changed.txt >> "$GITHUB_OUTPUT"

  push-image:
    name: ${{ matrix.key }}
    needs: build-images
    if: needs.build-images.outputs.any == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GITHUB_TOKEN, restored. This briefly used a classic PAT (#2540) because
      # every push failed with "denied: permission_denied: write_package" while
      # the build, tag and matrix all succeeded ahead of it.
      #
      # The cause was NOT a missing scope — the runner printed "Packages: write"
      # on the failing job, so the job-level permissions block was working. It
      # was that the package had no repo-to-package association: created by a
      # hand-push from a laptop, it reported repository: NONE, so there was
      # nothing for a per-package Actions-access grant to attach to. That is why
      # the UI grant appeared to do nothing.
      #
      # The fix is the LABEL org.opencontainers.image.source in the service's
      # Dockerfile, which links the package on push. Once linked, GITHUB_TOKEN —
      # short-lived and repository-scoped — can push, and the long-lived PAT is
      # unnecessary.
      #
      # A service whose Dockerfile lacks that label will fail here exactly as
      # before. Add the label; do not reach for a PAT.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate langchain-agent build inputs
        if: matrix.key == 'agent'
        # Mirrors se-update-code.sh's build-input preflight (lines 196-216).
        # langchain_agent/repo-src/ and langchain_agent/codegraph.db are both
        # generated, gitignored files the Dockerfile COPYs — a clean checkout
        # (this runner) has neither. se-update-code.sh generates them itself,
        # but only after --print-map's early exit, so this job never runs
        # that path; --print-map must stay reachable with no .env, Docker, or
        # cluster access, so the preflight can't move earlier — it has to be
        # reproduced here instead.
        run: |
          set -euo pipefail
          if [ ! -d langchain_agent/repo-src ]; then
            python3 scripts/build-codegraph.py --stage-src langchain_agent/repo-src
          fi
          if [ ! -s langchain_agent/codegraph.db ]; then
            python3 scripts/build-codegraph.py
            cp -f .codegraph/demo-codegraph.db langchain_agent/codegraph.db
          fi
      - name: Build via compose, then push the sha tag
        # Build through docker compose, NOT a bare buildx with an assumed
        # context. Build contexts vary and cannot be derived from sourceDir:
        # demo-api-server uses `context: .` (the repo root, because the BFF
        # references scope-topology.json and docs/) with
        # `dockerfile: demo_api_server/Dockerfile`, while llm-proxy uses
        # `context: ./demo_llm_proxy` with `dockerfile: Dockerfile`. Encoding
        # those in the service map would be a sixth and seventh copy of what
        # docker-compose.yml already owns. Compose knows them; use Compose.
        #
        # --profile demo-auth: authz-server and mcp-gateway sit behind that
        # profile and are silently skipped without it — the same trap
        # se-update-code.sh documents in build_and_push().
        #
        # -p ai-demo-se matches SE_COMPOSE_PROJECT so the local tag equals the
        # map's localImage, including llm-proxy's explicit `image:` override.
        #
        # NEVER :latest. Every SE deployment is imagePullPolicy: Always, so a
        # moving :latest means the next restart of any pod — a crash, an
        # eviction, a drain — silently pulls whatever was last merged. An
        # immutable sha tag is inert until a human promotes it.
        run: |
          set -euo pipefail
          URI="ghcr.io/${{ github.repository_owner }}/${{ matrix.ghcrImage }}:sha-${{ github.sha }}"
          docker compose -p ai-demo-se -f docker-compose.yml --profile demo-auth \
            build "${{ matrix.composeService }}"
          docker tag "${{ matrix.localImage }}:latest" "$URI"
          docker push "$URI"
