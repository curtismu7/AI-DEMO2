name: Build images

# Split out of ci.yml deliberately. ci.yml uses a shared `ci-<ref>` concurrency
# group, and GitHub allows only ONE PENDING run per group: a newer pending run
# EVICTS the older one regardless of cancel-in-progress. On 2026-08-28 that
# cancelled the build for merge commit 5b22e3a1c one second after the next merge
# queued, before a single job had started — leaving that SHA with no image, and
# promotion is by SHA, so it was permanently unpromotable. Keying this workflow's
# group by github.sha gives every merge commit its own group, so no two merges
# can contend and no build can be evicted by a later one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    # Optional subset rebuild for the self-heal dispatcher (build-images-heal):
    # a newline/comma-separated list of service keys. Empty = unchanged
    # changed-paths behavior.
    inputs:
      services:
        description: 'Service keys to rebuild (empty = diff-driven)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-images:
    name: Build and push service images
    # Merges, plus an explicit manual run. NOT pull_request: on a PR there is no
    # merged commit to tag, and CI must not push images for code that may never
    # land. workflow_dispatch is someone deciding to rebuild on purpose, which is
    # a different thing from a PR building itself.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    permissions:
      contents: read
      packages: write
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed paths
        id: changed
        run: |
          # A manual run means "rebuild everything" — the only reason to click it
          # is that something OUTSIDE the diff changed: a GHCR package's Actions
          # access grant, a base image, an expired credential. A path diff cannot
          # see any of those, so feeding the matcher every tracked file is what
          # makes the matrix whole. No flag and no matrix change needed: the
          # matcher already builds a service when any path under its sourceDir
          # appears, and every sourceDir appears in `git ls-files`.
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[changed] manual dispatch — building every service" >&2
            git ls-files > changed.txt
          # github.event.before is all-zeroes for a force-push or a first push.
          # Build nothing rather than everything: a missed build is recoverable
          # by hand, a surprise 14-image build is noise nobody asked for.
          elif [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "[changed] unresolvable base '$BEFORE' — building nothing" >&2
            : > changed.txt
          else
            git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
          fi
          wc -l < changed.txt

      - name: Compute build matrix
        id: matrix
        run: |
          ./se-update-code.sh --print-map > map.json
          # Self-heal dispatch: when a services subset is named, it INTERSECTS
          # the changed-path matrix (ci-build-matrix treats an empty filter as
          # no filter). The heal workflow passes the file path; a push run
          # passes nothing and diffs as before.
          FILTER_ARG=""
          if [ -n "${{ inputs.services }}" ]; then
            printf '%s\n' "${{ inputs.services }}" | tr ',' '\n' > services-filter.txt
            FILTER_ARG="services-filter.txt"
          fi
          node scripts/ci-build-matrix.js map.json changed.txt $FILTER_ARG >> "$GITHUB_OUTPUT"

      # A GHCR push needs two independent things, and either one missing gives
      # the IDENTICAL "denied: permission_denied: write_package": the source
      # LABEL (in-repo, checked here) and the package's "Manage Actions access"
      # grant (UI-only, uncheckable). Verifying the code half turns that
      # ambiguous denial into an unambiguous one — if this step passes and the
      # push still fails, it is always the UI grant.
      #
      # It lives here rather than in `npm run hygiene:check` so it runs where it
      # matters, on the merges that actually push images, instead of on every
      # local hygiene pass.
      - name: Verify GHCR source labels
        if: steps.matrix.outputs.any == 'true'
        run: |
          node --test scripts/check-ghcr-source-labels.test.js
          node scripts/check-ghcr-source-labels.js

  push-image:
    name: ${{ matrix.key }}
    needs: build-images
    if: needs.build-images.outputs.any == 'true'
    runs-on: [self-hosted, macOS]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # The runner's own ~/.docker/config.json has `credsStore: osxkeychain`, and
      # a launchd runner service cannot write to the login keychain: the login
      # step below died with "error storing credentials ... User interaction is
      # not allowed. (-25308)" on every self-hosted Mac. A job-scoped config
      # keeps the token in a file under RUNNER_TEMP, which the runner wipes after
      # the job (login-action also logs out in its post step).
      # cli-plugins is linked so `docker compose` and buildx still resolve.
      #
      # The placeholder `auths` entry is load-bearing. An empty `{}` is NOT
      # enough: when the config holds no auth and docker-credential-osxkeychain
      # is on PATH, the CLI picks the keychain as its default store anyway and
      # fails identically (#484 shipped `{}`; all 12 jobs failed). One existing
      # auth entry makes it keep using the file.
      - name: Use a job-scoped Docker config (no keychain)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/docker-config"
          mkdir -p "$cfg"
          ln -s "$HOME/.docker/cli-plugins" "$cfg/cli-plugins"
          echo '{"auths":{"placeholder.invalid":{}}}' > "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"
      # On a runner machine that runs OrbStack, /var/run/docker.sock can be a
      # symlink to Docker Desktop's socket (~/.docker/run/docker.sock), which does
      # not exist there. setup-buildx then died with "failed to connect to the
      # docker API at unix:///var/run/docker.sock" (main run 37123317458, bff and
      # frontend). Only when the default socket does not answer, point at the
      # first live one; runners where it works are left exactly as they were.
      - name: Use a live Docker socket
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "default Docker socket is live"
            exit 0
          fi
          # A socket FILE is not a live daemon: a stopped Docker Desktop leaves its
          # file behind (cmuir-air, main run 37140242446 picked one and setup-buildx
          # still failed). Ask each candidate to answer before choosing it.
          for s in "$HOME/.orbstack/run/docker.sock" "$HOME/.docker/run/docker.sock"; do
            if [ -S "$s" ] && DOCKER_HOST="unix://$s" docker info >/dev/null 2>&1; then
              echo "DOCKER_HOST=unix://$s" >> "$GITHUB_ENV"
              echo "default Docker socket is dead; using $s"
              exit 0
            fi
          done
          echo "no live Docker socket found (is OrbStack running on this runner?)" >&2
          exit 1
      - uses: docker/setup-buildx-action@v4
      # GITHUB_TOKEN — short-lived and repository-scoped. A classic PAT was used
      # briefly (#2540, reverted by #2548, restored here) while the real cause was
      # being found. Do not reach for a PAT again; read on first.
      #
      # Pushing to a GHCR package needs TWO things, and either one missing gives
      # the identical "denied: permission_denied: write_package" — which is what
      # made this expensive to diagnose:
      #
      #   1. LABEL org.opencontainers.image.source in the service's Dockerfile.
      #      Links the package to this repo on push (#2545: repository NONE ->
      #      cmuir_pingcorp/AI-DEMO2). In-repo, applies on the next push.
      #   2. The package's "Manage Actions access" list must contain this repo
      #      with the Write role. UI-only, cannot be set or read through any API,
      #      and it starts EMPTY.
      #
      # These are independent. #2546 had (1) without (2) — the package named this
      # repo as its Repository source while the Actions access list was empty —
      # and the push was still refused. That is the trap.
      #
      # What was NOT the cause, all disproved: a missing token scope (the runner
      # prints "Packages: write"), the repo's read-only default workflow
      # permissions (the job-level permissions block elevates it correctly), and
      # package visibility (public packages failed identically).
      #
      # A NEW service therefore needs both steps. Its first CI push will fail
      # until they are done.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate langchain-agent build inputs
        if: matrix.key == 'agent'
        # Mirrors se-update-code.sh's build-input preflight (lines 196-216).
        # langchain_agent/repo-src/ and langchain_agent/codegraph.db are both
        # generated, gitignored files the Dockerfile COPYs — a clean checkout
        # (this runner) has neither. se-update-code.sh generates them itself,
        # but only after --print-map's early exit, so this job never runs
        # that path; --print-map must stay reachable with no .env, Docker, or
        # cluster access, so the preflight can't move earlier — it has to be
        # reproduced here instead.
        run: |
          set -euo pipefail
          if [ ! -d langchain_agent/repo-src ]; then
            python3 scripts/build-codegraph.py --stage-src langchain_agent/repo-src
          fi
          if [ ! -s langchain_agent/codegraph.db ]; then
            python3 scripts/build-codegraph.py
            cp -f .codegraph/demo-codegraph.db langchain_agent/codegraph.db
          fi
      - name: Build via compose, then push sha and latest tags
        # Build through docker compose, NOT a bare buildx with an assumed
        # context. Build contexts vary and cannot be derived from sourceDir:
        # demo-api-server uses `context: .` (the repo root, because the BFF
        # references scope-topology.json and docs/) with
        # `dockerfile: demo_api_server/Dockerfile`, while llm-proxy uses
        # `context: ./demo_llm_proxy` with `dockerfile: Dockerfile`. Encoding
        # those in the service map would be a sixth and seventh copy of what
        # docker-compose.yml already owns. Compose knows them; use Compose.
        #
        # --profile demo-auth: authz-server and mcp-gateway sit behind that
        # profile and are silently skipped without it — the same trap
        # se-update-code.sh documents in build_and_push().
        #
        # -p ai-demo-se matches SE_COMPOSE_PROJECT so the local tag equals the
        # map's localImage, including llm-proxy's explicit `image:` override.
        #
        # Publish both tags. The immutable sha tag keeps deployments
        # reproducible, while :latest remains available for shared/local
        # namespaces and emergency recovery when a commit-specific image was
        # not published.
        run: |
          set -euo pipefail
          BASE="ghcr.io/${{ github.repository_owner }}/${{ matrix.ghcrImage }}"
          SHA_URI="$BASE:sha-${{ github.sha }}"
          LATEST_URI="$BASE:latest"
          docker compose -p ai-demo-se -f docker-compose.yml --profile demo-auth \
            build "${{ matrix.composeService }}"
          docker tag "${{ matrix.localImage }}:latest" "$SHA_URI"
          docker tag "${{ matrix.localImage }}:latest" "$LATEST_URI"
          docker push "$SHA_URI"
          docker push "$LATEST_URI"
      # Every run leaves its sha-<sha> tag of all 12 images on the runner's
      # daemon (the bff/server image alone is ~3.6 GB). Nothing consumed them —
      # deployments pull from GHCR — and 2026-10-09 the Air's 460 GB disk hit
      # 100% mid-"Install deps" (ENOSPC, attempts 14/16). Keep :latest and the
      # current run's sha tag; drop everything else, plus dangling layers.
      # rmi by REPOSITORY:TAG, not image ID: a server image shares layers with
      # its frontend counterpart's ID space and `rmi <id>` dies with "image is
      # referenced in multiple repositories" when a tag pair exists.
      - name: Prune old local images
        if: always()
        run: |
          set -euo pipefail
          docker images "ghcr.io/${{ github.repository_owner }}/*:sha-*" --format "{{.Repository}}:{{.Tag}}" \
            | /usr/bin/grep -Fv ":sha-${{ github.sha }}" \
            | xargs -r -n1 docker rmi || true
          docker image prune -f >/dev/null
