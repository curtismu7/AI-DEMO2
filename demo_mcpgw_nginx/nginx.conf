# demo_mcpgw_nginx/nginx.conf — TLS front door for the PingOne Privilege MCPGW.
#
# Deck-faithful topology (SE enablement storyboard, slides 3 and 5):
#
#   MCP client -> DNS -> nginx :443 -> MCPGW runtime :8620 -> backend MCP server
#
# One wildcard vhost fronts every Privilege MCP Server application. The
# per-application hostname is what the gateway matches on, so the original Host
# header must survive the hop — see the comment on proxy_set_header Host below.
#
# On Kubernetes this file has no counterpart: ingress-nginx is the nginx engine
# there and k8s/aws/mcpgw-agentless-ingress.yaml carries the same directives as
# annotations. Keep the two in sync.

# The MCP streamable-HTTP transport and the SSE fallback both hold a response
# open for the life of the session. Default proxy timeouts (60s) cut them.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# WebSocket/keep-alive upgrade passthrough.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The gateway matches Host against the FULL registered Frontend Name
# (<app-name>.default.applications.procyon.ai:8643) — nothing else. Verified
# empirically 2026-08-10 on build v1.260726, end to end: with that Host a
# console-token request completed initialize -> tools/list (238 tools) ->
# tools/call through the gateway. Ping's SE deck describes an "EvaluateHost"
# that strips the first DNS label and constructs the name from it; that does
# NOT hold on this build — a bare label host (mcp-pingone-admin.mcpgw...)
# passed through unchanged gets "Domain not found" and an empty 200.
#
# So: one map line per MCP application, client host -> registered name. Adding
# an application = one line here + one /etc/hosts line. Read the real
# registered name from the console API, never the console UI (it displays a
# different domain) — see docs/PRIVILEGE-MCP.md §"the console API reads the
# real config".
map $host $mcpgw_frontend {
    default                                        "MCP-aidemo.default.applications.procyon.ai:8643";
    # Per-app hosts, named after the application for readability:
    MCP-aidemo.mcpgw.local.ping-devops.com         "MCP-aidemo.default.applications.procyon.ai:8643";
    mcp-pingone-admin.mcpgw.local.ping-devops.com  "mcp-pingone-admin.default.applications.procyon.ai:8643";
    # Legacy hostnames:
    aidemo.mcpgw.local.ping-devops.com             "MCP-aidemo.default.applications.procyon.ai:8643";
    mcpgw.local.ping-devops.com                    "MCP-aidemo.default.applications.procyon.ai:8643";
}

server {
    listen 443 ssl;
    http2 on;

    # Gateway base host serves /authorize and /callback (the OIDC dance MCPGW
    # runs itself, advertised in its 401 WWW-Authenticate challenge).
    # Wildcard host serves one frontend per Privilege MCP Server application,
    # e.g. aidemo.mcpgw.local.ping-devops.com.
    server_name mcpgw.local.ping-devops.com *.mcpgw.local.ping-devops.com;

    ssl_certificate     /etc/nginx/certs/mcpgw-wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/mcpgw-wildcard-key.pem;

    # MCP JSON-RPC bodies are small, but tool results (transaction lists) are not.
    client_max_body_size 10m;

    # Docker's embedded DNS. Required because proxy_pass below uses a variable:
    # with a literal upstream name nginx resolves at config-parse time and
    # refuses to start with "host not found in upstream" whenever ping-mcpgw is
    # not already up — which is exactly the state after a gateway re-enrollment.
    # The variable defers resolution to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # 8620 = cyonproxy's -alp-port, "agentless proxy api port" per its own
        # --help. Plain HTTP, and the port that actually answers MCP requests:
        #
        #   curl -i -X POST http://localhost:8620/mcp -d '{"jsonrpc":"2.0",...}'
        #   HTTP/1.1 401 Unauthorized
        #   Bearer Token not found.
        #
        # That is the gateway's documented tokenless response, so this is the
        # frontend hop. Do NOT point this at 8623 (-listen): that is the mesh
        # port, it speaks mTLS, and it answers every request with
        # "tlsv13 alert certificate required" — which nginx surfaces as a bare
        # 502 with the real cause only in its error log. Mounting a server
        # certificate for 8623 does not change this; it was tried.
        #
        # Ports on this container: 8090 debug (loopback), 8620 agentless API,
        # 8623 mesh (-listen), 8690 medusa.
        set $mcpgw_upstream http://ping-mcpgw:8620;

        # proxy_pass carries no URI component, so the original request URI is
        # forwarded unchanged even though the upstream is a variable.
        proxy_pass $mcpgw_upstream;

        proxy_http_version 1.1;

        # Host must be the registered Frontend Name — see the map above.
        # X-Forwarded-Host always carries what the client actually used.
        proxy_set_header Host              $mcpgw_frontend;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Streaming: buffering would hold MCP notifications until the response
        # completed, which for a long-lived session means forever.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
    }
}
