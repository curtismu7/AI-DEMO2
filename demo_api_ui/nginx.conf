server {
    listen 4000 ssl;
    server_name local.ping-devops.com api.ping.demo;

    ssl_certificate     /etc/nginx/certs/api.ping.demo+2.pem;
    ssl_certificate_key /etc/nginx/certs/api.ping.demo+2-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets — the filename changes on every build
    # (e.g. index-Cx58vqao.js), so they are safe to cache forever. This block
    # must come before `location /` so asset requests don't fall through to the
    # no-cache SPA shell below.
    # NOTE: any add_header inside a location DROPS the server-level add_header
    # set, so the security headers are re-declared in each location below.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
    }

    # Token Lab HTML ships in the UI build (public/pinggateway-test.html).
    # Serve it statically so a missing/misconfigured BFF proxy cannot 404 the page.
    location = /pinggateway-test.html {
        try_files /pinggateway-test.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA shell / React Router — index.html references the hashed asset filenames,
    # so it must never be cached or a redeploy won't be picked up until a hard
    # refresh. no-cache => the browser revalidates (304 when unchanged).
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
    }

    # Health check proxy to BFF
    location /health {
        proxy_pass https://demo-api-server:3001/health;
        proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
        proxy_ssl_verify              on;
        proxy_ssl_name                api.ping.demo;
        proxy_ssl_server_name         on;
    }

    # Code Explorer SSE — disable buffering so status/token frames reach the
    # browser while the LLM is still generating (see REGRESSION_PLAN Code Explorer).
    location /api/codegraph/ {
        proxy_pass https://demo-api-server:3001/api/codegraph/;
        proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
        proxy_ssl_verify              on;
        proxy_ssl_name                api.ping.demo;
        proxy_ssl_server_name         on;
        proxy_http_version 1.1;
        proxy_set_header Host api.ping.demo:4000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        gzip off;
    }

    # API proxy to BFF (BFF serves HTTPS when certs are mounted)
    location /api/ {
        proxy_pass https://demo-api-server:3001/api/;
        proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
        proxy_ssl_verify              on;
        proxy_ssl_name                api.ping.demo;
        proxy_ssl_server_name         on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host api.ping.demo:4000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # PingOne webhook to the BFF. Without this, POSTs to /webhook/pingone fall
    # through to `location /` and are answered with the SPA's index.html — a
    # 200 with an HTML body, so PingOne records the delivery as successful and
    # the events are silently discarded.
    # (nginx picks the longest matching prefix, so this beats `location /`
    # wherever it sits in the file — but keep it grouped with /api/ for sanity.)
    location /webhook/ {
        proxy_pass https://demo-api-server:3001/webhook/;
        proxy_ssl_trusted_certificate /etc/nginx/certs/rootCA.pem;
        proxy_ssl_verify              on;
        proxy_ssl_name                api.ping.demo;
        proxy_ssl_server_name         on;
        proxy_http_version 1.1;
        proxy_set_header Host api.ping.demo:4000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PingOne batches up to 500 events; the nginx default of 1m is tight.
        client_max_body_size 5m;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
}
