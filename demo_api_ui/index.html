<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Demo favicon and icons (sized PNGs, generated from super-bank-icon.png) -->
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <!-- iOS ignores manifest.json's "display": "standalone" — these three tags are
       what actually makes "Add to Home Screen" launch chromeless on iOS Safari. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Demo" />
  <meta name="description" content="AI Demo · PingOne AI IAM Core — secure online banking" />
  <link rel="stylesheet" href="https://assets.pingone.com/ux/end-user-nano/0.1.0-alpha.9/end-user-nano.css" />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:title" content="PingOne AI IAM Core" />
  <meta property="og:description" content="Secure online banking with AI-powered assistance" />
  <link rel="manifest" href="/manifest.json" />
  <title>PingOne AI IAM Core</title>
  <!-- Cache buster: 2026-v2-warm-paper-redesign -->
  <script>
    // First paint: ThemeContext only sets data-theme after React mounts, so every
    // full reload (including the return from a sign-in redirect) used to flash the
    // light boot screen at a dark-mode user. Apply the saved choice here, before
    // the stylesheet below paints. Key matches THEME_STORAGE_KEY in ThemeContext.
    try {
      if (localStorage.getItem('ba_dark_mode') === 'true') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* storage disabled: boot light, ThemeContext decides after mount */ }
    // /privilege-mcp-client keeps its own light/dark (cur_priv_theme, default dark),
    // so its boot skeleton must match the page, not the app theme: a light skeleton
    // here read as a big white screen before the dark page painted.
    try {
      if (location.pathname.indexOf('/privilege-mcp-client') === 0
          && localStorage.getItem('cur_priv_theme') !== 'light') {
        document.documentElement.setAttribute('data-boot-dark', '');
      }
    } catch (e) { /* storage disabled: boot light */ }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f7f7f5;
    }

    code {
      font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
        monospace;
    }

    :root[data-theme="dark"] body {
      background-color: #0b1220;
    }

    /* Boot screen: static markup inside #root, painted before the JS bundle
       loads. React's root.render() replaces #root's children on mount, so
       this disappears on its own — no cleanup code needed.
       It sketches the app shell (top bar, side nav, content cards) so a full
       reload looks like the page loading, not a blank sheet. Every colour here
       is a literal pair on purpose: the --th-* tokens live in a stylesheet that
       has not loaded yet, and ink/ground must not mix literals with tokens.

       .boot-skeleton is the SAME skeleton, drawn by React (AuthLoadingScreen) while
       the sign-in check is in flight. It shares every rule below, bar the CSS ring,
       so the swap from this screen to that one is pixel-identical in light and dark.
       Without that the refresh went skeleton, then a blank full-screen overlay, then
       the chrome again: three near-white screens in a row, which read as flashes. */
    #boot-spinner,
    .boot-skeleton {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 56px 1fr;
      background-color: #f7f7f5;
    }

    .boot-bar {
      grid-column: 1 / -1;
      background-color: #ffffff;
      border-bottom: 1px solid #e4e4e0;
    }

    .boot-nav {
      background-color: #efefeb;
      border-right: 1px solid #e4e4e0;
    }

    .boot-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
    }

    .boot-card {
      height: 140px;
      border: 1px solid #e4e4e0;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .boot-card--short {
      height: 90px;
    }

    /* The Ping mark, drawn exactly as React's PingIdentitySpinner draws it (56px,
       outer ring at 42% accent, mark at 55%, same motion), so the swap from this
       screen to AuthLoadingScreen is the same picture and not ring-then-mark. */
    .boot-mark {
      --boot-accent: #dc2626;
      position: fixed;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
    }

    .boot-mark__ring {
      position: absolute;
      inset: 1%;
      border: 2px solid color-mix(in srgb, var(--boot-accent) 42%, transparent);
      border-radius: 50%;
    }

    .boot-mark__img {
      position: relative;
      width: 55%;
      height: 55%;
      filter: drop-shadow(0 10px 14px color-mix(in srgb, var(--boot-accent) 28%, transparent));
      animation: boot-dance 1.8s cubic-bezier(.45, .05, .35, 1) infinite;
    }

    :root[data-theme="dark"] #boot-spinner,
    :root[data-theme="dark"] .boot-skeleton {
      background-color: #0b1220;
    }

    :root[data-theme="dark"] .boot-bar {
      background-color: #102847;
      border-bottom-color: #26304a;
    }

    :root[data-theme="dark"] .boot-nav {
      background-color: #131c2e;
      border-right-color: #26304a;
    }

    :root[data-theme="dark"] .boot-card {
      background-color: #131c2e;
      border-color: #26304a;
    }

    :root[data-theme="dark"] .boot-mark {
      --boot-accent: #ef4444;
    }

    /* /privilege-mcp-client boot: same dark skeleton, keyed to the page's own theme */
    :root[data-boot-dark] #boot-spinner,
    :root[data-boot-dark] .boot-skeleton {
      background-color: #0b1220;
    }

    :root[data-boot-dark] .boot-bar {
      background-color: #102847;
      border-bottom-color: #26304a;
    }

    :root[data-boot-dark] .boot-nav {
      background-color: #131c2e;
      border-right-color: #26304a;
    }

    :root[data-boot-dark] .boot-card {
      background-color: #131c2e;
      border-color: #26304a;
    }

    :root[data-boot-dark] .boot-mark {
      --boot-accent: #ef4444;
    }

    @media (max-width: 768px) {
      #boot-spinner,
      .boot-skeleton {
        grid-template-columns: 1fr;
      }

      .boot-nav {
        display: none;
      }
    }

    /* "Did you know" card under the mark. Same card AuthLoadingScreen draws (.boot-skeleton__tip
       in App.css), repeated here as literals because that stylesheet has not loaded yet. */
    .boot-tip {
      position: fixed;
      top: calc(50% + 56px);
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: min(320px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid #e4e4e0;
      border-left: 4px solid #dc2626;
      border-radius: 8px;
      background-color: #ffffff;
      color: #14213d;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: left;
    }

    .boot-tip b {
      display: block;
      margin-bottom: 4px;
      color: #991b1b;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    :root[data-theme="dark"] .boot-tip,
    :root[data-boot-dark] .boot-tip {
      border-color: #26304a;
      border-left-color: #ef4444;
      background-color: #131c2e;
      color: #e6ebf5;
    }

    :root[data-theme="dark"] .boot-tip b,
    :root[data-boot-dark] .boot-tip b {
      color: #f87171;
    }

    @keyframes boot-dance {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      18% { transform: translate(-2px, -3px) rotate(-5deg) scale(1.02); }
      36% { transform: translate(2px, 1px) rotate(4deg) scale(.98); }
      55% { transform: translate(-1px, -2px) rotate(0deg) scale(1.01); }
      74% { transform: translate(2px, 0) rotate(4deg) scale(.99); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark__img { animation: none; }
    }
  </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"><div id="boot-spinner"><div class="boot-bar"></div><div class="boot-nav"></div><div class="boot-main"><div class="boot-card"></div><div class="boot-card boot-card--short"></div></div><div class="boot-mark"><span class="boot-mark__ring"></span><img class="boot-mark__img" src="/branding/ping-logo.svg" alt=""></div><div class="boot-tip" id="boot-tip" aria-hidden="true"><b>Did you know</b><span>Every agent call swaps the user token for a scoped one (RFC 8693) before it reaches a tool.</span></div></div></div>

  <!-- Rotates the boot tip until React replaces #root (the element is gone, so stop).
       Keep in step with LOADING_TIPS in src/components/shared/loadingTips.js. -->
  <script>
    (function () {
      var tips = [
        "Every agent call swaps the user token for a scoped one (RFC 8693) before it reaches a tool.",
        "The browser never holds a PingOne token. The BFF keeps it server-side and the page only sees a session cookie.",
        "High-value transfers pause for human approval before they run.",
        "Each tool call is checked against policy at the gateway, not just at sign-in."
      ];
      var i = 0;
      var timer = setInterval(function () {
        var el = document.querySelector('#boot-tip span');
        if (!el) { clearInterval(timer); return; }
        i = (i + 1) % tips.length;
        el.textContent = tips[i];
      }, 4000);
    })();
  </script>

  <!--
    Path A (CR-02/CR-04): the global WebSocket URL-token interceptor was
    removed. The browser never holds a PingOne token (token custody) — the
    BFF chat-WS proxy at /ws/langchain resolves and attaches the identity
    token server-side. Re-introducing any client-side token injection here
    would reopen the token-custody hole. See REGRESSION_PLAN §1
    "BFF langchain chat-WS proxy — token custody (Path A)".
  -->

  <!-- Banking Chat Widget CSS -->
  <link rel="stylesheet" href="/banking-chat-widget.css">

  <!-- Banking Chat Widget Script -->
  <script src="/banking-chat-widget.js"></script>
  <script>
    let bankingWidget;

    // Global functions for easy access
    function openChat() {
      console.log('openChat() called');
      if (bankingWidget) {
        bankingWidget.open();
      } else {
        console.warn('Banking widget not initialized yet');
      }
    }

    function closeChat() {
      console.log('closeChat() called');
      if (bankingWidget) {
        bankingWidget.close();
      } else {
        console.warn('Banking widget not initialized yet');
      }
    }

    // Debug function to find and show hidden chat widgets
    function debugChatWidget() {
      console.log('Debugging chat widget...');

      // Find all possible chat widget elements
      const possibleElements = [
        ...document.querySelectorAll('[id*="chat"]'),
        ...document.querySelectorAll('[id*="banking"]'),
        ...document.querySelectorAll('[class*="widget"]'),
        ...document.querySelectorAll('[class*="chat"]'),
        ...document.querySelectorAll('div[style*="position: fixed"]'),
        ...document.querySelectorAll('div[style*="position: absolute"]')
      ];

      console.log('Found possible widget elements:', possibleElements);

      possibleElements.forEach((el, index) => {
        const styles = window.getComputedStyle(el);
        console.log(`Element ${index}:`, {
          element: el,
          id: el.id,
          className: el.className,
          display: styles.display,
          visibility: styles.visibility,
          opacity: styles.opacity,
          zIndex: styles.zIndex,
          position: styles.position,
          top: styles.top,
          right: styles.right,
          bottom: styles.bottom,
          left: styles.left,
          width: styles.width,
          height: styles.height
        });

        // Try to make it visible if it's hidden
        if (styles.display === 'none') {
          console.log(`Making element ${index} visible (was display: none)`);
          el.style.display = 'block';
        }
        if (styles.visibility === 'hidden') {
          console.log(`Making element ${index} visible (was visibility: hidden)`);
          el.style.visibility = 'visible';
        }
        if (styles.opacity === '0') {
          console.log(`Making element ${index} visible (was opacity: 0)`);
          el.style.opacity = '1';
        }

        // Add a red border for identification
        el.style.border = '2px solid red';
        el.style.boxShadow = '0 0 10px red';
      });

      return possibleElements;
    }

    // Function to refresh dashboard data
    function refreshDashboard(actionType, details) {
      console.log('Refreshing dashboard from chat widget:', actionType, details);

      // Dispatch custom event that React components can listen to
      const event = new CustomEvent('chatWidgetAction', {
        detail: {
          type: actionType,
          ...details
        }
      });
      window.dispatchEvent(event);

      // Also dispatch a simple refresh event
      window.dispatchEvent(new CustomEvent('refreshDashboard'));
    }

    // Make functions globally available
    window.openChat = openChat;
    window.closeChat = closeChat;
    window.debugChatWidget = debugChatWidget;


    // Function to initialize chat widget only when authenticated
    function initializeChatWidget(userToken) {
      console.log('Initializing real banking chat widget...');
      console.log('Auth token available:', !!userToken);

      // Try different possible ways the widget might be exported
      let initFunction = null;

      // Check for different possible export patterns
      if (window.initBankingChatWidget) {
        initFunction = window.initBankingChatWidget;
        console.log('Found window.initBankingChatWidget');
      } else if (window.BankingChatWidget) {
        if (typeof window.BankingChatWidget === 'function') {
          initFunction = window.BankingChatWidget;
          console.log('Found window.BankingChatWidget as function');
        } else if (window.BankingChatWidget.init) {
          initFunction = window.BankingChatWidget.init;
          console.log('Found window.BankingChatWidget.init');
        } else if (window.BankingChatWidget.create) {
          initFunction = window.BankingChatWidget.create;
          console.log('Found window.BankingChatWidget.create');
        }
      }

      if (initFunction) {
        try {
          console.log('Calling initialization function...');
          // Path A (CR-02/CR-04): connect to the BFF chat-WS proxy on the
          // SAME origin as every other BFF call (cookie-authenticated). The
          // browser never sends a token in the URL or anywhere else — the BFF
          // resolves the PingOne identity token server-side and attaches it to
          // session_init. ws/wss is chosen from the page protocol.
          const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
          const wsUrl = `${wsScheme}://${window.location.host}/ws/langchain`;
          bankingWidget = initFunction({
            apiUrl: wsUrl,
            position: 'bottom-right',
            theme: 'light',
            title: 'AI Demo Assistant',
            autoOpen: false,
            showFAB: true,  // Show both FAB and custom buttons
            onOpen: () => console.log('Chat opened'),
            onClose: () => console.log('Chat closed'),

            // Callbacks for banking actions that should refresh the dashboard
            onTransactionCompleted: (details) => {
              console.log('Transaction completed:', details);
              refreshDashboard('transaction_completed', details);
            },
            onAccountUpdated: (details) => {
              console.log('Account updated:', details);
              refreshDashboard('account_updated', details);
            },
            onBalanceChanged: (details) => {
              console.log('Balance changed:', details);
              refreshDashboard('balance_changed', details);
            },

            // Generic callback for any action that should refresh
            onActionCompleted: (actionType, details) => {
              console.log('Action completed:', actionType, details);
              refreshDashboard(actionType, details);
            }
          });

          // Store globally for React components
          window.bankingWidget = bankingWidget;
          console.log('Real banking chat widget initialized!', bankingWidget);

        } catch (error) {
          console.error('Failed to initialize real banking chat widget:', error);
          console.log('Available window properties:', Object.keys(window).filter(key =>
            key.toLowerCase().includes('chat') ||
            key.toLowerCase().includes('widget') ||
            key.toLowerCase().includes('banking')
          ));
        }
      } else {
        console.warn('No banking chat widget initialization function found');
        console.log('Available window properties:', Object.keys(window).filter(key =>
          key.toLowerCase().includes('chat') ||
          key.toLowerCase().includes('widget') ||
          key.toLowerCase().includes('banking')
        ));
        console.log('Checking window.BankingChatWidget:', window.BankingChatWidget);
      }
    }

    // Function to destroy chat widget
    function destroyChatWidget() {
      if (bankingWidget && bankingWidget.destroy) {
        console.log('Destroying chat widget...');
        bankingWidget.destroy();
        bankingWidget = null;
      }
    }

    // Make initialization functions globally available
    window.initializeChatWidget = initializeChatWidget;
    window.destroyChatWidget = destroyChatWidget;

    // Listen for authentication events from React.
    // Only auto-initialize the LangChain widget on localhost — it connects to
    // ws://localhost:8082/ws which doesn't exist on Vercel production.
    window.addEventListener('userAuthenticated', function(event) {
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isLocalhost) return; // BankingAgent handles AI on production
      console.log('User authenticated - initializing chat widget');
      const userToken = event.detail && event.detail.token;
      setTimeout(() => initializeChatWidget(userToken), 500);
    });

    window.addEventListener('userLoggedOut', function() {
      console.log('User logged out - destroying chat widget');
      destroyChatWidget();
    });
  </script>

  <!-- Vite app entry point -->
  <script type="module" src="/src/index.jsx"></script>
</body>
