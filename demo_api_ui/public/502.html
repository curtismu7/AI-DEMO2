<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Temporarily Unavailable - PingOne AI IAM Core</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 2.5rem 2rem;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: #1e3a5f;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: #60a5fa;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
    }
    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: #fbbf24;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .retry-btn:hover { background: #1d4ed8; }
    .retry-btn:active { transform: scale(0.97); }
    .auto-retry {
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: #64748b;
    }
    .auto-retry span { color: #94a3b8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </div>
    <h1>Services Are Restarting</h1>
    <p class="subtitle">
      The backend servers are currently unavailable &mdash; they may be restarting
      after a deployment or experiencing a brief interruption. This usually
      resolves within a minute.
    </p>
    <div class="status-bar">
      <span class="status-dot"></span>
      <span>Waiting for services to come back online&hellip;</span>
    </div>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74"/>
        <path d="M21 3v6h-6"/>
      </svg>
      Retry Now
    </button>
    <p class="auto-retry">Auto-retrying in <span id="countdown">30</span>s</p>
  </div>
  <script>
    (function() {
      var seconds = 30;
      var el = document.getElementById('countdown');
      var timer = setInterval(function() {
        seconds--;
        if (el) el.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.reload();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
