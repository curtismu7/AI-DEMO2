# Sealed Secrets — encrypt K8s secrets at rest in etcd
# Deploy to ai-demo namespace (kube-system requires cluster-admin).
#
# Prerequisites:
#   kubectl apply -f k8s/01-namespace.yaml  # creates ai-demo
#
# Usage:
#   kubectl apply -f k8s/00-sealed-secrets-install.yaml
#   k8s/sealed-secrets.sh

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: ai-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-controller
rules:
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-controller
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: ai-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sealed-secrets-controller
  template:
    metadata:
      labels:
        app: sealed-secrets-controller
    spec:
      serviceAccountName: sealed-secrets-controller
      containers:
        - name: sealed-secrets-controller
          image: ghcr.io/getsops/sealed-secrets:v0.24.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SEALED_SECRETS_UPDATE_STATUS
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: ai-demo
  labels:
    app: sealed-secrets-controller
spec:
  selector:
    app: sealed-secrets-controller
  ports:
    - port: 8080
      name: http
