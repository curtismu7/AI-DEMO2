# Grafana — the only monitoring UI reachable from outside the cluster.
#
# Datasource and dashboards are provisioned from files (monitoring/grafana/**,
# turned into ConfigMaps by k8s/create-secrets.sh) rather than clicked in: this
# pod's storage is an emptyDir, so anything configured through the UI is gone on
# the next restart.
#
# Sign-in is required. Anonymous access is off and sign-up is off, so the admin
# account provisioned from grafana-secrets is the only way in. That matters more
# here than it does for /jaeger: these panels expose the gateway's route names,
# JVM state and error counts, and this path is on the public internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-demo
  labels:
    app: ai-demo
    component: grafana
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: grafana
  template:
    metadata:
      labels:
        app: ai-demo
        component: grafana
    spec:
      securityContext:
        # grafana image runs as uid 472; the emptyDir must be writable by it.
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            # Read first so the ROOT_URL below can interpolate it. optional:true
            # keeps the pod starting on a stack where the secret has not been
            # created yet — Grafana then serves on its own origin.
            - name: PUBLIC_APP_URL
              valueFrom:
                secretKeyRef:
                  name: ai-demo-secrets
                  key: PUBLIC_APP_URL
                  optional: true
            # Served under /grafana/ behind nginx, so Grafana has to build its
            # own asset and redirect URLs with that prefix or the UI loads blank.
            - name: GF_SERVER_ROOT_URL
              value: "$(PUBLIC_APP_URL)/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_USER
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
                  optional: true
            # Login required: no anonymous viewing, no self sign-up.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Nothing here should phone home from a demo cluster.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
              subPath: data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
            optional: true
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
            optional: true
        - name: dashboards
          configMap:
            name: grafana-dashboards
            optional: true
        - name: data
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-demo
  labels:
    app: ai-demo
    component: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ai-demo
    component: grafana
