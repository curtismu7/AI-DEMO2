apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-invest
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-invest
spec:
  replicas: 1
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: mcp-invest
  template:
    metadata:
      labels:
        app: ai-demo
        component: mcp-invest
    spec:
      containers:
      - name: mcp-invest
        image: ai-demo-mcp-invest:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: ws
        # Explicit env overrides the shared configmap's mcp-server values
        env:
        - name: NODE_ENV
          value: "production"
        - name: MCP_SERVER_HOST
          value: "0.0.0.0"
        - name: MCP_SERVER_PORT
          value: "8081"
        - name: MCP_RESOURCE_URL
          value: "http://mcp-invest:8081"
        - name: DEMO_API_BASE_URL
          value: "https://demo-api-server:3001"
        envFrom:
        - configMapRef:
            name: ai-demo-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-invest
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-invest
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: ws
  selector:
    app: ai-demo
    component: mcp-invest
