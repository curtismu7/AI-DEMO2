apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
  labels:
    app: ai-demo
    # Start with audit/warn while the remaining legacy workloads are migrated
    # to fully restricted pod security contexts. This prevents silent drift
    # and gives admission operators actionable violations without breaking the
    # existing demo stack immediately.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-demo-quota
  namespace: ai-demo
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "16"
    limits.memory: 48Gi
    persistentvolumeclaims: "10"
    services: "25"
    secrets: "30"
    configmaps: "20"
