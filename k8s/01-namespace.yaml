apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
  labels:
    app: ai-demo
    # Start with audit/warn while the remaining legacy workloads are migrated
    # to fully restricted pod security contexts. This prevents silent drift
    # and gives admission operators actionable violations without breaking the
    # existing demo stack immediately.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-demo-quota
  namespace: ai-demo
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "16"
    limits.memory: 48Gi
    persistentvolumeclaims: "10"
    services: "34"
    secrets: "30"
    configmaps: "20"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-demo-internal
  namespace: ai-demo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-demo
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-demo
  # Allow egress to PingOne and external HTTPS/DNS
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        # Do not permit compromised workloads to reach the AWS instance or
        # container metadata endpoints through this broad egress rule.
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
