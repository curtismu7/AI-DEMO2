apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-gateway
spec:
  # ON by default (changed 2026-08-25). This deployment used to default to 0,
  # on the assumption that it and ping-gateway are mutually exclusive and that
  # demo-sync picks the winner from Quick Flag ff_mcp_gateway_pinggateway.
  # That is no longer true: EXTERNAL MCP clients (LM Studio et al) reach this
  # gateway through the BFF recording façade, whose agent-gateway door targets
  # http://mcp-gateway:3005/mcp unconditionally (routes/mcpFacade.js) and whose
  # OAuth broker lives in this same service. So it must be up regardless of
  # which gateway the demo UI is routed to, or every external door 502s.
  #
  # The Quick Flag still means what it always meant — it selects the gateway the
  # BFF/demo UI ROUTES to (MCP_GATEWAY_HTTP_URL) and whether ping-gateway runs.
  # It just no longer scales THIS deployment down. See demo_sync_cmd in
  # k8s/deploy.sh.
  replicas: 1
  # Zero-downtime rollouts: bring new pod healthy before terminating old one.
  # maxSurge:1 transiently adds one pod (100m CPU / 128Mi) during rollouts only —
  # well within the 8 CPU quota (k8s/01-namespace.yaml). maxUnavailable:0 ensures
  # the gateway is never fully down during a deploy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-demo
      component: mcp-gateway
  template:
    metadata:
      labels:
        app: ai-demo
        component: mcp-gateway
    spec:
      containers:
      - name: mcp-gateway
        image: ai-demo-k8-mcp-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: MCP_GW_PORT
          value: "3005"
        # NB: the gateway reads MCP_OLB_WS_URL / MCP_RESOURCE_SERVER_WS_URL (NOT the
        # MCP_GW_*-prefixed names). Those backend URLs are set in the
        # ai-demo-config configmap so every consumer gets the in-cluster value.
        - name: MCP_GW_PASSTHROUGH_TO_MCP_SERVER
          value: "false"
        # Talk to the authz sidecar (below) over IPv4 loopback. Overrides the
        # gateway-secrets value (http://localhost:9001): in the pod, `localhost`
        # resolves to ::1 first (Node verbatim DNS) but the sidecar binds
        # 127.0.0.1 only, so `localhost` is refused — pin to 127.0.0.1.
        - name: PINGAUTHORIZE_ENDPOINT
          value: "http://127.0.0.1:9001"
        - name: GW_INTROSPECTION_ENDPOINT
          value: "http://127.0.0.1:9001/as/introspect"
        # gateway-secrets' GW_INTROSPECTION_CLIENT_ID/SECRET are the "Demo MCP
        # Gateway" resource's OWN credentials — correct for the authz-server
        # sidecar's real RFC 7662 call below, but McpTokenExchangeClient.ts's
        # actor selection (actorClientId = introspectionClientId || clientId)
        # also reads this same var and would use a resource-server client as
        # the RFC 8693 exchange actor, which PingOne rejects
        # (invalid_client — a resource client can introspect, not exchange).
        # Blank it here so this container falls back to its own
        # MCP_GW_CLIENT_ID/SECRET, as the fallback comment above intends.
        # The authz-server container below keeps the real value from
        # gateway-secrets — do not add the same override there. (Originally
        # applied 2026-08-25 on worktree-se-gateway-actor-secret-fix, which
        # was never merged — re-applied here after a vault-in-k8s-design
        # deploy silently reverted it by applying this file from a branch
        # that predated the fix. Two unmerged branches touching the same
        # shared manifest is the root cause; both need merging to main.)
        - name: GW_INTROSPECTION_CLIENT_ID
          value: ""
        - name: GW_INTROSPECTION_CLIENT_SECRET
          value: ""
        # Path B (dual_token): id_token bridge + resource-server base must hit the
        # in-cluster BFF, not the localhost defaults in config.ts.
        - name: BFF_INTERNAL_ID_TOKEN_URL
          value: "https://demo-api-server:3001/internal/id-token"
        - name: BANKING_RESOURCE_SERVER_BASE_URL
          value: "https://demo-api-server:3001"
        - name: MCP_WEATHER_BACKEND_URL
          value: "http://mcp-weather:8896"
        - name: MCP_BRAVE_BACKEND_URL
          value: "http://mcp-brave:8897"
        - name: MCP_GW_JWTVERIFIER_HTTP_URL
          value: "http://mcp-jwt-verifier:8083"
        # Transaction-trace hop ingest — mirrors docker-compose's BFF_TRANSACTION_HOP_URL.
        # Without this, gatewayAudit.ts's emitHop() silently no-ops (missing url/secret
        # guard), so MCP gateway hops never appear on /transaction-trace.
        - name: BFF_TRANSACTION_HOP_URL
          value: "https://demo-api-server:3001/internal/transaction-hop"
        # mkcert TLS on demo-api-server — same opt-in as MCP_GATEWAY_REJECT_UNAUTHORIZED.
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        # OpenTelemetry → in-cluster Jaeger (k8s/73-jaeger-deployment.yaml).
        # Mirrors docker-compose: the bootstrap script is mounted at /otel from
        # the otel-instrument ConfigMap (created by the deploy scripts).
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: OTEL_SERVICE_NAME
          value: "mcp-gateway"
        - name: NODE_OPTIONS
          value: "-r /otel/otel-instrument.js"
        # gateway-secrets supplies MCP_GW_CLIENT_ID/SECRET, PINGONE_* (from
        # demo_mcp_gateway/.env, same as compose's env_file). configmap last.
        envFrom:
        - secretRef:
            name: gateway-secrets
        - configMapRef:
            name: ai-demo-config
        volumeMounts:
        - name: otel-instrument
          mountPath: /otel
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # startupProbe gates liveness/readiness until the process is actually up.
        # Gives 60s (30 × 2s) for Node to initialise before k8s marks it failing.
        # Once it passes once, liveness takes over; it never fires again.
        startupProbe:
          httpGet:
            path: /health
            port: 3005
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 0
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      # Authorization Server (mock PingOne Authorize) as a sidecar. The gateway
      # reaches it over the shared pod loopback at http://127.0.0.1:9001 (see the
      # PINGAUTHORIZE_ENDPOINT override above). The server binds 127.0.0.1, so
      # probes must run inside the container's netns (exec); an httpGet probe
      # dials the pod IP and would be refused.
      - name: authz-server
        image: ai-demo-k8-authz-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9001
          name: authz
        env:
        - name: NODE_ENV
          value: "production"
        - name: AUTHZ_PORT
          value: "9001"
        # OpenTelemetry → in-cluster Jaeger (same pattern as the gateway above).
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: OTEL_SERVICE_NAME
          value: "authz-server"
        - name: NODE_OPTIONS
          value: "-r /otel/otel-instrument.js"
        # Reuse the gateway's PingOne creds + PINGAUTHORIZE_* config. dotenv falls
        # back to process.env when no .env file is present in the image.
        # ai-demo-secrets LAST (k8s: later envFrom wins on key collisions) —
        # mirrors compose, which layers demo_api_server/.env after the gateway
        # .env. It carries PINGONE_WORKER_CLIENT_ID/SECRET + ENVIRONMENT_ID for
        # the Rule 0a2/tools-list user lookup; without them EVERY decision
        # fails closed with user_lookup_failed and discovery degrades.
        envFrom:
        - secretRef:
            name: gateway-secrets
        - configMapRef:
            name: ai-demo-config
        - secretRef:
            name: ai-demo-secrets
        volumeMounts:
        - name: otel-instrument
          mountPath: /otel
          readOnly: true
        resources:
          requests:
            memory: "96Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        # No liveness probe — authz-server is a loopback-only sidecar.
        # restartPolicy:Always handles crashes; a liveness probe only adds
        # a spurious kill path with no recovery benefit.
        readinessProbe:
          exec:
            command: ["wget", "-qO-", "http://127.0.0.1:9001/health"]
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: otel-instrument
        configMap:
          name: otel-instrument
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-gateway
spec:
  type: ClusterIP
  ports:
  - port: 3005
    targetPort: 3005
    protocol: TCP
    name: http
  selector:
    app: ai-demo
    component: mcp-gateway
