# PingFederate for the SE cluster (namespace ping-devops-curtismuir).
#
# Apply with an explicit namespace:  kubectl -n ping-devops-curtismuir apply -f k8s/pingfederate/pingfederate.yaml
#
# Not in this file, on purpose:
#   - the license:        kubectl -n <ns> create secret generic pingfederate-license --from-file=pingfederate.lic=<path>
#   - the admin password: kubectl -n <ns> create secret generic pingfederate-admin --from-literal=password=<generated>
# Only the engine (9031) is on the public ingress. The admin API/console (9999) is
# a ClusterIP Service: reach it with `kubectl -n <ns> port-forward svc/pingfederate-admin 9999:9999`.
# After the first start, import the configuration archive and set the base URL
# (see k8s/pingfederate/README.md).
apiVersion: v1
kind: Service
metadata:
  name: pingfederate-engine
  labels: { app: pingfederate }
spec:
  selector: { app: pingfederate }
  ports:
    - { name: engine, port: 9031, targetPort: 9031 }
---
apiVersion: v1
kind: Service
metadata:
  name: pingfederate-admin
  labels: { app: pingfederate }
spec:
  selector: { app: pingfederate }
  ports:
    - { name: admin, port: 9999, targetPort: 9999 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pingfederate
  labels: { app: pingfederate }
spec:
  serviceName: pingfederate-engine
  replicas: 1
  selector:
    matchLabels: { app: pingfederate }
  template:
    metadata:
      labels: { app: pingfederate }
    spec:
      # The image runs as uid 9031 (gid 0). A fresh gp2 volume is root-owned, which made
      # the first boot fail at 06-copy-product-bits.sh ("can't create directory /opt/out/instance").
      securityContext:
        runAsUser: 9031
        fsGroup: 9031
      containers:
        - name: pingfederate
          # Same pinned image the local docker-compose.local.yml runs (multi-arch; the cluster is arm64).
          image: pingidentity/pingfederate:13.1.3-alpine_3.24.2-al25-edge@sha256:522cca2db24360fba3fffb90ce099e9ebdf3f59112a742cfed5d8d3109569655
          env:
            - { name: PING_IDENTITY_ACCEPT_EULA, value: "YES" }
            - name: PING_IDENTITY_PASSWORD
              valueFrom:
                secretKeyRef: { name: pingfederate-admin, key: password }
          ports:
            - { name: engine, containerPort: 9031 }
            - { name: admin, containerPort: 9999 }
          volumeMounts:
            - { name: out, mountPath: /opt/out }
            - name: license
              mountPath: /opt/in/instance/server/default/conf/pingfederate.lic
              subPath: pingfederate.lic
              readOnly: true
            - { name: run-secrets, mountPath: /run/secrets }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 3Gi }
          startupProbe:
            httpGet: { path: /pf/heartbeat.ping, port: 9031, scheme: HTTPS }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /pf/heartbeat.ping, port: 9031, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /pf/heartbeat.ping, port: 9031, scheme: HTTPS }
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: license
          secret: { secretName: pingfederate-license }
        - name: run-secrets
          emptyDir: { medium: Memory }
  volumeClaimTemplates:
    - metadata: { name: out }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp2
        resources: { requests: { storage: 5Gi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingfederate
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx-public
  rules:
    - host: cmuir-pf.ping-devops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: pingfederate-engine, port: { number: 9031 } }
