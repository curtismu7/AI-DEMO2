# Deploy namespace via --namespace flag on helm install.
# All sensitive values (proxyToken, oidc.clientSecret) must be supplied
# via --set or a separate --values secrets.yaml — never committed to source control.

mcpgw:
  hostname: "cj-mcpgw.ping-devops.com"
  image: "public.ecr.aws/s7q1z8z4/privilege-proxy"
  serverUrl: "https://cj-mcpgw.ping-devops.com"
  # required — provide via: --set mcpgw.proxyToken=<token>
  proxyToken: ""
  ssl:
    storage: "50Mi"
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
  oidc:
    # Set enabled: true to enable OIDC browser login flow
    enabled: false
    clientId: "c95ca731-7202-45b6-9c3f-a9c1b378d35e"
    # required only if oidc.enabled=true — provide via: --set mcpgw.oidc.clientSecret=<secret>
    clientSecret: ""
    authUrl: "https://auth.pingone.com/5f4badd1-7d97-48e9-84aa-9f15d72ad84f/as/authorize"
    tokenUrl: "https://auth.pingone.com/5f4badd1-7d97-48e9-84aa-9f15d72ad84f/as/token"
    userUrl: "https://auth.pingone.com/5f4badd1-7d97-48e9-84aa-9f15d72ad84f/as/userinfo"
    scopes: "openid profile email"

ingress:
  # This app owns hostname/cert/ingress routing centrally (k8s/aws/se-ingress.yaml,
  # mcpgw-agentless-ingress.yaml, mcpgw-wildcard-certificate.yaml) since mcpgw.hostname
  # here is the app's shared external host, not a chart-dedicated subdomain. Enabling
  # this would create a second Ingress + Certificate for the same host/path the app's
  # own ingress already serves — leave disabled.
  enabled: false
  className: "nginx-public"
  certIssuer: "letsencrypt-pdo"

opensearch:
  # This app has its own MCP servers; the reference chart's OpenSearch/OpenSearch-MCP
  # sample backend is unused here.
  enabled: false
  image: "opensearchproject/opensearch:2"
  storage: "10Gi"
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

opensearchMcpServer:
  enabled: false
  image: "cjmuir710/opensearch-mcp-server:latest"
  imagePullSecretName: "dockerhub-creds"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
