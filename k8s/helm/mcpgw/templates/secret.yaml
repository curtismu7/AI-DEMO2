apiVersion: v1
kind: Secret
metadata:
  name: ping-mcpgw-secrets
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENV_PROXY_TOKEN: {{ required "secrets.envProxyToken is required on first install / re-enrollment" .Values.secrets.envProxyToken | quote }}
  {{- if .Values.secrets.pingoneEnv }}
  pingone.env: |
    {{- .Values.secrets.pingoneEnv | nindent 4 }}
  {{- end }}
  {{- if and (not .Values.certificate.enabled) .Values.secrets.mcpgwCert .Values.secrets.mcpgwKey }}
  mcpgw-cert.pem: |
    {{- .Values.secrets.mcpgwCert | nindent 4 }}
  mcpgw-key.pem: |
    {{- .Values.secrets.mcpgwKey | nindent 4 }}
  {{- end }}
{{- if and (not .Values.certificate.enabled) .Values.ingress.enabled .Values.secrets.mcpgwCert .Values.secrets.mcpgwKey }}
---
# Ingress TLS needs the standard tls.crt/tls.key key names, distinct from the
# mcpgw-cert.pem/mcpgw-key.pem names the pod itself expects above — same cert
# material, duplicated under the two naming conventions each consumer needs.
apiVersion: v1
kind: Secret
metadata:
  name: ping-mcpgw-tls-manual
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{- .Values.secrets.mcpgwCert | nindent 4 }}
  tls.key: |
    {{- .Values.secrets.mcpgwKey | nindent 4 }}
{{- end }}
