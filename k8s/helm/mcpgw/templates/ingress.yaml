{{- if .Values.ingress.enabled }}
# Agentless-mode front door. A single Ingress covers every current and future
# MCP Server application: mcpgw resolves the application by URL PATH
# (/<app-slug>/mcp), not by Host header — confirmed 2026-08-12 against a real
# gateway node, contradicting an earlier (wrong) assumption that Host routing
# mattered here. Adding a new app needs zero new Ingress/cert work.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ping-mcpgw
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # MCP streamable HTTP and SSE hold the response open for the session's life.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.hostname }}
        - "*.{{ .Values.hostname }}"
      secretName: {{ if .Values.certificate.enabled }}ping-mcpgw-tls-certmanager{{ else }}ping-mcpgw-tls-manual{{ end }}
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ping-mcpgw
                port:
                  number: 8623
    # Same backend under the wildcard host too — supports clients using the
    # subdomain-per-app convention (<app>.{{ .Values.hostname }}/mcp) as well
    # as the path-per-app one above (app selection is by URL path either way).
    - host: "*.{{ .Values.hostname }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ping-mcpgw
                port:
                  number: 8623
{{- end }}
