{{- if .Values.mcpgw.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcpgw
  namespace: {{ .Release.Namespace }}
  labels:
    app: mcpgw
    {{- include "privgateway.labels" . | nindent 4 }}
spec:
  selector:
    app: mcpgw
  ports:
    - name: http
      port: 80
      targetPort: 8623
      protocol: TCP
    - name: mcpgw
      port: 8623
      targetPort: 8623
      protocol: TCP
    - name: medusa
      port: 8690
      targetPort: 8690
      protocol: TCP
{{- end }}
