apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcpgw
  namespace: {{ .Release.Namespace }}
  labels:
    app: mcpgw
    {{- include "privgateway.labels" . | nindent 4 }}
spec:
  selector:
    app: mcpgw
  ports:
    - name: http
      port: 80
      targetPort: 8680
      protocol: TCP
    - name: proxy
      port: 8680
      targetPort: 8680
      protocol: TCP
