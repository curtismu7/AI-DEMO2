apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mcpgw-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: mcpgw
    {{- include "privgateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENV_PROXY_TOKEN: {{ required "mcpgw.proxyToken is required — pass via --set mcpgw.proxyToken=<token>" .Values.mcpgw.proxyToken | quote }}
  {{- if .Values.mcpgw.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ required "mcpgw.oidc.clientSecret is required when oidc.enabled=true" .Values.mcpgw.oidc.clientSecret | quote }}
  {{- end }}
