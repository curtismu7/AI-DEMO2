# PingOne Privilege proxy (commercial), agentless / self-hosted frontend mode.
# Policy and session recording are configured in the PingOne Privilege console,
# not by this chart.
#
# Binary: privilege-mcpgw (mcpgw), not the older privilege-proxy (cyonproxy) —
# mcpgw emits a real WWW-Authenticate OAuth challenge on a tokenless request;
# cyonproxy never did. The ValidateInfraJwt kid-comparison wall that blocks
# PingOne-issued client tokens is present in both binaries.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-mcpgw
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "mcpgw.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpgw.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ping-mcpgw
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/procyon/bin/mcpgw"]
          args:
            - "-hostname"
            - {{ .Values.hostname | quote }}
            # -mcpconfpath is REQUIRED on this binary (fatal "MCP Config path not
            # specified" without it) — mcpgw reads pingone.env directly rather
            # than only consuming injected env vars, unlike cyonproxy.
            - "-mcpconfpath"
            - "/var/lib/procyon/config/pingone.env"
          ports:
            - containerPort: 8623
              name: http
            - containerPort: 8690
              name: medusa
          env:
            - name: ENV_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ping-mcpgw-secrets
                  key: ENV_PROXY_TOKEN
          volumeMounts:
            # NOT readOnly, NOT emptyDir: the proxy rewrites its persisted token
            # at startup. Read-only makes it exit 1; emptyDir loses the
            # exchanged token on every restart, forcing re-enrollment each time.
            - name: ssl-certs
              mountPath: /procyon/ssl
            - name: recordings
              mountPath: /procyon/recordings
            - name: logs
              mountPath: /var/log/procyon
            # -mcpconfpath (above) points here. Not optional in practice — mcpgw
            # reads this file eagerly at startup and exits fatally if it's
            # missing, so a missing pingone.env means crash-loop, not soft
            # degradation. optional: true on the volume only avoids failing pod
            # admission if the secret object doesn't exist at all yet.
            - name: pingone-env
              mountPath: /var/lib/procyon/config
              readOnly: true
            # Official Ping config doc lists /var/lib/procyon/ssl/mcpgw-{cert,key}.pem
            # under "Required host configuration" — a different path from
            # ssl-certs above (/procyon/ssl, the proxy's own enrollment-identity
            # store).
            - name: mcpgw-tls
              mountPath: /var/lib/procyon/ssl
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: 8623
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8623
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8623
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: ssl-certs
          persistentVolumeClaim:
            claimName: ping-mcpgw-ssl
        - name: recordings
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: pingone-env
          secret:
            secretName: ping-mcpgw-secrets
            optional: true
            items:
              - key: pingone.env
                path: pingone.env
        - name: mcpgw-tls
          secret:
            {{- if .Values.certificate.enabled }}
            # Reuse the cert-manager-issued pair (tls.crt/tls.key) under the
            # names the vendor doc expects, instead of duplicating cert
            # material into ping-mcpgw-secrets.
            secretName: ping-mcpgw-tls-certmanager
            optional: true
            items:
              - key: tls.crt
                path: mcpgw-cert.pem
              - key: tls.key
                path: mcpgw-key.pem
            {{- else }}
            secretName: ping-mcpgw-secrets
            optional: true
            items:
              - key: mcpgw-cert.pem
                path: mcpgw-cert.pem
              - key: mcpgw-key.pem
                path: mcpgw-key.pem
            {{- end }}
      restartPolicy: Always
