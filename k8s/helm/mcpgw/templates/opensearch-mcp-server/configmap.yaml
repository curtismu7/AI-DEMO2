{{- if .Values.opensearchMcpServer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opensearch-mcp-proxy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: opensearch-mcp-server
    {{- include "privgateway.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;

        # Rewrite /mcp (no trailing slash) directly to /mcp/ upstream
        # so FastMCP never issues a 307 and the mcp-session-id header is preserved
        location = /mcp {
          proxy_pass http://localhost:9900/mcp/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }

        location /mcp/ {
          proxy_pass http://localhost:9900/mcp/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
{{- end }}
