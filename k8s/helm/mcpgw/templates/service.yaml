apiVersion: v1
kind: Service
metadata:
  name: ping-mcpgw
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    {{- include "mcpgw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8623
      targetPort: 8623
      protocol: TCP
      name: http
    # Mesh cluster creation / gateway-to-gateway per the official Ping config
    # doc ("PingOne-Privilege-MCP-Gateway-Configuration.md").
    - port: 8690
      targetPort: 8690
      protocol: TCP
      name: medusa
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    {{- include "mcpgw.labels" . | nindent 4 }}
