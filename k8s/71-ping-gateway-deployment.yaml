# ConfigMap ping-gateway-config is generated by k8s/create-secrets.sh from the
# source files under ping-gateway/config/ and ping-gateway/scripts/groovy/.
# Do NOT embed config here — edit the source files and re-run create-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-gateway
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-gateway
spec:
  replicas: 1
  # Quota-safe: terminate old pod before creating new one (IG is JVM-heavy;
  # surging two pods transiently would double memory consumption).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: ping-gateway
  template:
    metadata:
      labels:
        app: ai-demo
        component: ping-gateway
    spec:
      containers:
      - name: ping-gateway
        image: us-docker.pkg.dev/forgeops-public/images-base/ig:latest
        imagePullPolicy: Always
        # Import mkcert root into a writable JVM truststore copy (same pattern as
        # docker-compose ping-gateway entrypoint) so apikey-dispatch.groovy can
        # HTTPS to the BFF vault bridge. Stock cacerts is root-owned and not
        # writable by the forgerock uid. Then clear any stale ig.pid and start.
        command:
          - /bin/sh
          - -c
          - >-
            cp "$JAVA_HOME/lib/security/cacerts" /var/gateway/mkcert-truststore.jks 2>/dev/null || true;
            keytool -importcert -noprompt -alias mkcert-root
            -keystore /var/gateway/mkcert-truststore.jks -storepass changeit
            -file /certs/rootCA.pem 2>/dev/null || true;
            rm -f /var/gateway/tmp/ig.pid && exec /opt/gateway/bin/start.sh /var/gateway
        ports:
        - containerPort: 8080
          name: http
        # All PingOne / secret values come from ping-gateway-secrets (sourced from
        # ping-gateway/.env by create-secrets.sh). Cluster-internal addresses that
        # differ from the .env standalone defaults are overridden inline below.
        envFrom:
        - secretRef:
            name: ping-gateway-secrets
        env:
        # In-cluster service DNS overrides — these win over the .env values baked
        # into ping-gateway-secrets, which point at host.docker.internal for
        # standalone use.
        - name: PG_OLB_BACKEND_URL
          value: "http://mcp-server:8080"
        - name: PG_INVEST_BACKEND_URL
          value: "http://mcp-resource-server:8081"
        # In-cluster BFF vault bridge. Host URL from refresh-service-envs
        # (api.ping.demo) resolves to 127.0.0.1 inside the pod → bridge 0.
        # demo-api-server is ClusterIP DNS; HostnameVerifier in apikey-dispatch
        # accepts it against the mkcert cert (SAN=api.ping.demo).
        - name: BFF_VAULT_KEY_URL
          value: "https://demo-api-server:3001/internal/vault/service-key"
        - name: PG_API_RESOURCE_SERVER_URL
          value: "http://api-resource-server:8082"
        # Point JVM at the mkcert-augmented truststore built in command: above.
        - name: JAVA_OPTS
          value: "-Djavax.net.ssl.trustStore=/var/gateway/mkcert-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
        # Authz sidecar (below) binds 127.0.0.1 — use IPv4 loopback explicitly.
        # `localhost` in Node resolves to ::1 first and is refused; same risk
        # exists for the Groovy http client inside IG.
        - name: P1AZ_MOCK_BASE
          value: "http://127.0.0.1:9001"
        # P1AZ_DECISION_ENDPOINT_ID comes from ping-gateway-secrets (real decision endpoint UUID).
        # Do NOT hardcode "mcp-policy" here — that mock policy slug 404s against real
        # PingOne .../decisionEndpoints/{id} and returns INVALID_REQUEST (HTTP 400).
        - name: PG_GATEWAY_RESOURCE_URI
          value: "mcpgateway.ping.demo"
        volumeMounts:
        # emptyDir gives IG a writable instance dir. Routes, config, and scripts
        # are overlaid by configMap mounts below — the emptyDir mount must come
        # first so it does not shadow the configMap-mounted subdirectories.
        - name: gateway-instance
          mountPath: /var/gateway
        - name: tls-certs
          mountPath: /certs
          readOnly: true
        - name: gateway-config
          mountPath: /var/gateway/config/admin.json
          subPath: admin.json
          readOnly: true
        - name: gateway-config
          mountPath: /var/gateway/config/config.json
          subPath: config.json
          readOnly: true
        - name: gateway-config
          mountPath: /var/gateway/config/mcp-tool-schemas.json
          subPath: mcp-tool-schemas.json
          readOnly: true
        - name: gateway-routes
          mountPath: /var/gateway/config/routes
          readOnly: true
        - name: gateway-groovy
          mountPath: /var/gateway/scripts/groovy
          readOnly: true
        resources:
          requests:
            memory: "384Mi"
            cpu: "150m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # IG (Java / Vert.x) typically takes 10-15 seconds to load routes and
        # bind the port. startupProbe gives 60 s before declaring failure.
        startupProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        # httpGet (not tcpSocket): a tcp-only check proves the port is open
        # but not that P1AZDecision can reach its backend — that's exactly how
        # the 2026-07-12 outage stayed "Ready" for 8h while denying every
        # request. /health (00-health.json + p1az-readiness.groovy) reports
        # 503 when the real PingOne Authorize backend is unconfigured.
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

      # Authorization Server sidecar — mock PingOne Authorize for the Groovy
      # P1AZ decision filter. Reached over the shared pod loopback at
      # http://127.0.0.1:9001 (P1AZ_MOCK_BASE above). Same pattern as the
      # mcp-gateway pod (k8s/60-mcp-gateway-deployment.yaml).
      - name: authz-server
        image: ai-demo-k8-authz-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9001
          name: authz
        env:
        - name: NODE_ENV
          value: "production"
        - name: AUTHZ_PORT
          value: "9001"
        envFrom:
        # ai-demo-secrets first (lowest precedence): supplies the Rule 0a2
        # PingOne worker credentials (PINGONE_WORKER_CLIENT_ID/SECRET) the user
        # lookup fails closed without — k8s twin of the docker-compose fix that
        # layers demo_api_server/.env into the authz-server (PR #284).
        - secretRef:
            name: ai-demo-secrets
        # ping-gateway-secrets (not gateway-secrets) — this sidecar serves the
        # PingGateway pod and must use IG's PingOne credentials (INTROSPECT_CLIENT_ID,
        # PINGONE_INTROSPECTION_ENDPOINT), not the Node gateway's (MCP_GW_CLIENT_ID);
        # listed after ai-demo-secrets so IG-specific keys win on duplicates.
        - secretRef:
            name: ping-gateway-secrets
        - configMapRef:
            name: ai-demo-config
        resources:
          requests:
            memory: "96Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          exec:
            command: ["wget", "-qO-", "http://127.0.0.1:9001/health"]
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: gateway-instance
        emptyDir: {}
      - name: tls-certs
        secret:
          secretName: tls-certs
      - name: gateway-config
        configMap:
          name: ping-gateway-config
      - name: gateway-routes
        configMap:
          name: ping-gateway-routes
      - name: gateway-groovy
        configMap:
          name: ping-gateway-groovy

      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ping-gateway
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  # MCP sessions are stateful (Mcp-Session-Id). Pin each client to the same
  # pod for the session lifetime, same as mcp-server's service.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: ai-demo
    component: ping-gateway
