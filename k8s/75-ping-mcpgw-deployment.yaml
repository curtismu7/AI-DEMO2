---
# ping-mcpgw: PingOne Privilege proxy (commercial) fronting mcp-server.
# Policy and session recording are configured in the PingOne Privilege console,
# not in this repo. ENV_PROXY_TOKEN comes from the gateway wizard and is stored
# in the ping-mcpgw-secrets K8s secret (created by create-secrets.sh).
# Exposed externally at https://ai-demo.ping-devops.com/mcpgw via se-ingress.yaml,
# and per-application at https://<app>.mcpgw.ai-demo.ping-devops.com/mcp via
# aws/mcpgw-agentless-ingress.yaml (agentless / self-hosted frontend mode — see
# privilege/PRIVILEGE-MCP.md for why that mode sidesteps the JWT issuer-trust wall).
#
# BINARY SWAP 2026-08-12, from privilege-proxy/cyonproxy to privilege-mcpgw/mcpgw.
# cyonproxy never emits a WWW-Authenticate challenge (grep -a over the binary:
# zero occurrences of authorization_uri / MCP OAuth Server /
# oauth-protected-resource). mcpgw's binary contains every one of those strings,
# and a live probe of this same image running in another engineer's cluster
# confirmed it emits the challenge for real on a tokenless request. The
# ValidateInfraJwt kid-comparison wall is present in this binary too, so PingOne
# client tokens passing through it is NOT confirmed — only the discovery layer
# is proven. See the skill's "The PingOne token wall" section.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-mcpgw
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-mcpgw
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: ping-mcpgw
  template:
    metadata:
      labels:
        app: ai-demo
        component: ping-mcpgw
    spec:
      containers:
      - name: ping-mcpgw
        # Pinned by digest (multi-arch manifest list) rather than a tag — no
        # public tag-listing access to confirm a stable version tag exists, and
        # this is the exact build verified against a live cluster (see header
        # comment). Bump by re-pulling :latest and updating the digest.
        image: public.ecr.aws/s7q1z8z4/privilege-mcpgw@sha256:0faad5903a5bd72539b1df525e3c7bc5d458a5bd324aac9755b8af99dfa6647d
        imagePullPolicy: Always
        command: ["/procyon/bin/mcpgw"]
        args:
        - "-hostname"
        - "mcpgw.ai-demo.ping-devops.com"
        # -mcpconfpath is REQUIRED on this binary (fatal "MCP Config path not
        # specified" without it) — confirmed via --help and a scratch container.
        # Unlike cyonproxy, mcpgw reads this file directly rather than only
        # consuming pingone.env's values via injected environment variables.
        - "-mcpconfpath"
        - "/var/lib/procyon/config/pingone.env"
        # -mcpgw is this binary's MCP+OAuth-challenge listener (default :8623) —
        # a different port role than cyonproxy's -alp-port (8620). Left on default
        # rather than pinned explicitly, matching the one proven-working
        # invocation seen live: another engineer's cluster, same image (same
        # digest), same minimal flag set (-hostname, -mcpconfpath only, no
        # -alp-port/-listen/-mcpgw overrides) — POST .../mcp there returned 401
        # with WWW-Authenticate present. NOT yet verified against our own
        # enrollment; this deployment has never run (see PR that added it).
        ports:
        - containerPort: 8623
          name: http
        env:
        - name: ENV_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: ping-mcpgw-secrets
              key: ENV_PROXY_TOKEN
        volumeMounts:
        # NOT readOnly, and NOT emptyDir: the proxy rewrites proxy-token.data at
        # startup (it swaps the short-lived wizard JWT for a long-lived one). A
        # read-only mount makes it exit 1 with "ProxyToken write ... read-only file
        # system"; an emptyDir loses the exchanged token on every restart, forcing
        # a fresh enrollment JWT from the console each time.
        - name: ssl-certs
          mountPath: /procyon/ssl
        - name: recordings
          mountPath: /procyon/recordings
        - name: logs
          mountPath: /var/log/procyon
        # -mcpconfpath (above) points here. NOT optional in practice on this
        # binary the way it was under cyonproxy: mcpgw reads this file eagerly at
        # startup and exits fatally if the path doesn't resolve, so a missing
        # pingone.env now means crash-loop, not soft degradation. `optional: true`
        # on the volume itself is kept only so pod admission doesn't fail outright
        # if the ping-mcpgw-secrets object hasn't been created yet at all.
        - name: pingone-env
          mountPath: /var/lib/procyon/config
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          tcpSocket:
            port: 8623
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: 8623
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8623
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: ssl-certs
        persistentVolumeClaim:
          claimName: ping-mcpgw-ssl
      - name: recordings
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: pingone-env
        secret:
          secretName: ping-mcpgw-secrets
          optional: true
          items:
          - key: pingone.env
            path: pingone.env
      restartPolicy: Always
---
# Holds the long-lived proxy token the proxy writes after enrollment. Losing this
# volume means re-enrolling the gateway in the Privilege console for a fresh JWT —
# get the new token BEFORE deleting it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ping-mcpgw-ssl
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-mcpgw
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ping-mcpgw
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-mcpgw
spec:
  type: ClusterIP
  ports:
  - port: 8623
    targetPort: 8623
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: ai-demo
    component: ping-mcpgw
