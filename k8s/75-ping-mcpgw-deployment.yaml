---
# ping-mcpgw: PingOne Privilege proxy (commercial) fronting mcp-server.
# Policy and session recording are configured in the PingOne Privilege console,
# not in this repo. ENV_PROXY_TOKEN comes from the gateway wizard and is stored
# in the ping-mcpgw-secrets K8s secret (created by create-secrets.sh).
# Exposed externally at https://ai-demo.ping-devops.com/mcpgw via se-ingress.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-mcpgw
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-mcpgw
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: ping-mcpgw
  template:
    metadata:
      labels:
        app: ai-demo
        component: ping-mcpgw
    spec:
      containers:
      - name: ping-mcpgw
        image: public.ecr.aws/s7q1z8z4/privilege-proxy
        imagePullPolicy: Always
        command: ["/procyon/bin/cyonproxy"]
        args:
        - "-hostname"
        - "ai-demo.ping-devops.com"
        - "-listen"
        - ":8680"
        ports:
        - containerPort: 8680
          name: http
        env:
        - name: ENV_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: ping-mcpgw-secrets
              key: ENV_PROXY_TOKEN
        volumeMounts:
        - name: ssl-certs
          mountPath: /procyon/ssl
          readOnly: true
        - name: recordings
          mountPath: /procyon/recordings
        - name: logs
          mountPath: /var/log/procyon
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          tcpSocket:
            port: 8680
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: 8680
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: ssl-certs
        emptyDir: {}
      - name: recordings
        emptyDir: {}
      - name: logs
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ping-mcpgw
  namespace: ai-demo
  labels:
    app: ai-demo
    component: ping-mcpgw
spec:
  type: ClusterIP
  ports:
  - port: 8680
    targetPort: 8680
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: ai-demo
    component: ping-mcpgw
