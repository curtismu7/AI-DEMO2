apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-weather
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-weather
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: mcp-weather
  template:
    metadata:
      labels:
        app: ai-demo
        component: mcp-weather
    spec:
      containers:
      - name: mcp-weather
        image: ai-demo-k8-mcp-weather:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8896
          name: http
        env:
        - name: PORT
          value: "8896"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8896
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8896
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-weather
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-weather
spec:
  type: ClusterIP
  ports:
  - port: 8896
    targetPort: 8896
    protocol: TCP
    name: http
  selector:
    app: ai-demo
    component: mcp-weather
