apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra-agent
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mastra-agent
spec:
  # Off by default to conserve namespace quota. langchain-agent is the always-on
  # runtime; bring this one up on demand via `./k8s/deploy.sh agent mastra`.
  replicas: 0
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: mastra-agent
  template:
    metadata:
      labels:
        app: ai-demo
        component: mastra-agent
    spec:
      containers:
      - name: mastra-agent
        image: ai-demo-k8-mastra-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8892
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: AGENT_HTTP_HOST           # default 127.0.0.1 is unreachable cross-pod
          value: "0.0.0.0"
        - name: AGENT_HTTP_PORT
          value: "8892"
        - name: BFF_BASE_URL
          value: "https://demo-api-server:3001"
        - name: MCP_SERVER_URL
          value: "ws://mcp-server:8080"
        envFrom:
        - configMapRef:
            name: ai-demo-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          tcpSocket:
            port: 8892
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mastra-agent
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mastra-agent
spec:
  type: ClusterIP
  ports:
  - port: 8892
    targetPort: 8892
    protocol: TCP
    name: http
  selector:
    app: ai-demo
    component: mastra-agent
