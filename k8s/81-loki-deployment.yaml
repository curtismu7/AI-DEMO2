# Loki — the log store behind Grafana's Loki datasource.
#
# Grafana holds no logs of its own; it only queries. This is what makes
# "our logs in Grafana" possible at all.
#
# NO ConfigMap: the image ships /etc/loki/local-config.yaml, which is already
# single-binary, filesystem-backed, auth-disabled and listening on 3100 — every
# choice this deployment would have made anyway. A config we do not write is a
# config that cannot drift from upstream.
#
# Storage is an emptyDir, the same trade prometheus and jaeger already make:
# demo telemetry, no PVC to clean up between rebuilds, history resets with the
# pod. If logs ever need to outlive a restart, that is a PVC *and* a retention
# policy — an unattended Loki that fills its volume goes read-only quietly.
#
# ClusterIP only, no ingress: Loki has no auth of its own (auth_enabled: false
# above is the image default), so exposing it would publish every log line. Same
# reasoning that keeps prometheus internal — Grafana is the only monitoring UI
# reachable from outside, and it requires a login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: ai-demo
  labels:
    app: ai-demo
    component: loki
spec:
  replicas: 1
  # Quota-safe restarts, matching prometheus/jaeger: terminate before creating
  # so a rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: loki
  template:
    metadata:
      labels:
        app: ai-demo
        component: loki
    spec:
      securityContext:
        # The image runs as uid 10001; the emptyDir must be writable by it.
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            # local-config.yaml sets path_prefix: /loki and writes chunks, rules
            # and the tsdb index below it. Without a writable mount here Loki
            # exits on boot rather than degrading.
            - name: data
              mountPath: /loki
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            # Loki reports not-ready for its first ~15s while the ingester joins
            # its own ring, so a short delay here just logs noise.
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ai-demo
  labels:
    app: ai-demo
    component: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP
      name: http
  selector:
    app: ai-demo
    component: loki
