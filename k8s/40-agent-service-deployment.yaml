apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-agent
  namespace: ai-demo
  labels:
    app: ai-demo
    component: langchain-agent
spec:
  replicas: 1
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: langchain-agent
  template:
    metadata:
      labels:
        app: ai-demo
        component: langchain-agent
    spec:
      containers:
      - name: langchain-agent
        image: ai-demo-langchain-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
          name: agui
        - containerPort: 8889
          name: ws-chat
        - containerPort: 8890
          name: health
        # secret first, configmap last → cluster URLs in the configmap win
        envFrom:
        - secretRef:
            name: langchain-secrets
        - configMapRef:
            name: ai-demo-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        # Health server binds 127.0.0.1 only (CR-03: /inspector/mcp-host leaks the
        # MCP registry unauthenticated, so it must not reach the pod network).
        # BOTH tcpSocket AND httpGet probes connect via the pod IP, so both are
        # refused by a loopback-only bind — that caused a liveness crashloop.
        # Only an exec probe reaches loopback (it runs inside the container), so
        # liveness uses the same curl-localhost check as readiness.
        livenessProbe:
          exec:
            command: ["curl", "-f", "http://localhost:8890/health"]
          initialDelaySeconds: 20
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["curl", "-f", "http://localhost:8890/health"]
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
---
apiVersion: v1
kind: Service
metadata:
  name: langchain-agent
  namespace: ai-demo
  labels:
    app: ai-demo
    component: langchain-agent
spec:
  type: ClusterIP
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: agui
  - port: 8889
    targetPort: 8889
    protocol: TCP
    name: ws-chat
  - port: 8890
    targetPort: 8890
    protocol: TCP
    name: health
  selector:
    app: ai-demo
    component: langchain-agent
