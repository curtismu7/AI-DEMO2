# Prometheus — scrapes PingGateway's admin connector and keeps the history.
#
# The gateway's counters are cumulative totals since it started, so a single
# read cannot answer "errors per minute" or "did rejections spike". Prometheus
# stores the series so rate() can.
#
# Config lives in monitoring/prometheus.yml and is turned into the
# `prometheus-config` ConfigMap by k8s/create-secrets.sh, so Docker Compose and
# Kubernetes read the same file (same approach as ping-gateway-config).
#
# Storage is an emptyDir with 24h retention: this is demo telemetry, and a PVC
# would be one more thing to clean up between rebuilds. History resets when the
# pod restarts, which is the same trade Jaeger already makes.
#
# ClusterIP only, and no ingress maps it — Grafana is the only monitoring UI
# reachable from outside, and it requires a login. Prometheus has no auth of
# its own, so exposing it would hand anyone the gateway's internals.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ai-demo
  labels:
    app: ai-demo
    component: prometheus
spec:
  replicas: 1
  # Quota-safe restarts, matching jaeger: terminate before creating so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: prometheus
  template:
    metadata:
      labels:
        app: ai-demo
        component: prometheus
    spec:
      securityContext:
        # The image runs as nobody(65534); the emptyDir needs to be writable by it.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            optional: true
        - name: data
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ai-demo
  labels:
    app: ai-demo
    component: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app: ai-demo
    component: prometheus
