apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-server
spec:
  replicas: 1
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: mcp-server
  template:
    metadata:
      labels:
        app: ai-demo
        component: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ai-demo-k8-mcp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: ws
        # OpenTelemetry → in-cluster Jaeger (k8s/73-jaeger-deployment.yaml).
        # Mirrors docker-compose: the bootstrap script is mounted at /otel from
        # the otel-instrument ConfigMap (created by the deploy scripts).
        env:
        # Mirrors docker-compose: SKIP_TOKEN_SIGNATURE_VALIDATION=true in
        # mcp-secrets is a fatal boot guard outside development (validator.ts).
        - name: NODE_ENV
          value: "development"
        # environments.ts defaults development mode to a relative
        # './dev-data/tokens' path that is never created and unwritable under
        # this container's non-root user (runAsUser 1001) — the Dockerfile
        # only pre-creates and chowns /app/data/tokens (the production path).
        # Every session write/cleanup hit EACCES, crashing the process on an
        # unhandled rejection every ~20min and failing every real MCP session
        # the same way. Confirmed live 2026-08-13 against ping-devops-cmuir.
        - name: TOKEN_STORAGE_PATH
          value: "/app/data/tokens"
        # Wide-open mode for Privilege MCP Gateway: the gateway itself
        # enforces authz, so the MCP server trusts all callers on the
        # internal hop (mirrors docker-compose.yml's mcp-server default).
        - name: MCP_AUTH_DISABLED
          value: "true"
        # Admit MCP clients we have never seen — ChatGPT, Claude, LM Studio.
        # None can be pre-registered: all require RFC 7591 dynamic registration
        # or a Client ID Metadata Document, and none offers a field for an
        # initial access token. Set here rather than via `kubectl set env` so a
        # manifest re-apply cannot silently close the door again — the symptom
        # of that would be an external client failing to register with no
        # obvious cause. See oauth-mcp/src/oauth/ClientRegistry.ts.
        - name: MCP_OPEN_CLIENT_REGISTRATION
          value: "true"
        # Scope granted to a self-admitted client, pinned server-side and never
        # read from its registration request. Read-only on purpose: this
        # registration endpoint faces the internet, so a caller that walked in
        # off it does not get write.
        - name: DCR_OPEN_REGISTRATION_SCOPE
          value: "mcp:invoke read"
        # Only these domains may serve a Client ID Metadata Document. The code
        # already refuses non-https, loopback and private-network literals, and
        # requires the document to claim the URL it was served from; this narrows
        # it further to the two clients we actually demo.
        - name: CIMD_ALLOWED_HOSTS
          value: "chatgpt.com,claude.ai"
        # api_key feature tools (show_mortgage/show_health_record/...) executed
        # by this server itself on the gateway-less Privilege/Procyon hop — the
        # same credential swap the demo mcp-gateway does on the normal chain.
        # Keys come from ai-demo-secrets, aligned with the backends by
        # create-secrets.sh align_service_api_keys().
        - name: API_RESOURCE_SERVER_URL
          value: "http://api-resource-server:8082"
        - name: MCP_RESOURCE_SERVER_HTTP_URL
          value: "http://mcp-resource-server:8081"
        - name: DEMO_API_RESOURCE_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: ai-demo-secrets
              key: DEMO_API_RESOURCE_SERVER_KEY
        - name: DEMO_MCP_RESOURCE_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: ai-demo-secrets
              key: DEMO_MCP_RESOURCE_SERVER_KEY
              optional: true
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: OTEL_SERVICE_NAME
          value: "mcp-server"
        - name: NODE_OPTIONS
          value: "-r /otel/otel-instrument.js"
        # secret first, configmap last → cluster URLs in the configmap win
        envFrom:
        - secretRef:
            name: mcp-secrets
        - configMapRef:
            name: ai-demo-config
        volumeMounts:
        - name: otel-instrument
          mountPath: /otel
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /.well-known/mcp-server
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /.well-known/mcp-server
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: otel-instrument
        configMap:
          name: otel-instrument
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: ai-demo
  labels:
    app: ai-demo
    component: mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: ws
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: ai-demo
    component: mcp-server
