apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-server
  namespace: ai-demo
spec:
  template:
    spec:
      containers:
        - name: api-server
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /certs/ca-bundle-with-mkcert.pem
      hostAliases:
        # OrbStack resolves host.orb.internal to this host-gateway address.
        # Keep the PF issuer hostname for TLS and OIDC issuer validation.
        - ip: 0.250.250.254
          hostnames:
            - local.ping-devops.com
