apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-server
  namespace: ai-demo
  labels:
    app: ai-demo
    component: api-server
spec:
  replicas: 1
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: api-server
  template:
    metadata:
      labels:
        app: ai-demo
        component: api-server
    spec:
      containers:
      - name: api-server
        image: ai-demo-k8-api-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: https
        # The BFF runs in development mode (same as docker-compose): the demo's
        # simulatedAuthorizeService refuses to load under NODE_ENV=production.
        # This explicit env overrides the shared configmap's NODE_ENV.
        env:
        - name: NODE_ENV
          value: "development"
        # Demo hardening Phase 4: with NODE_ENV=development (required by the
        # simulated Authorize service), CRASH_GUARD=1 makes unhandled rejections
        # log-and-continue instead of restarting the pod mid-demo.
        # Decision logic: demo_api_server/utils/crashGuard.js.
        - name: CRASH_GUARD
          value: "1"
        # The internal-endpoint hardening in routes/vaultServiceKey.js and
        # routes/agentIdToken.js used to key off NODE_ENV=production, which the
        # line above deliberately prevents — so it never fired in-cluster and any
        # workload with pod-network reach to api-server:3001 could retrieve the
        # backend service keys using the committed default secret. This opt-in
        # arms it independently of NODE_ENV. create-secrets.sh guarantees
        # BFF_INTERNAL_SECRET is a real value, so this cannot 503 the demo.
        - name: VAULT_INTERNAL_STRICT
          value: "true"
        # Open-access Privilege MCP hop: mcp-server (30-mcp-server-deployment.yaml)
        # runs MCP_AUTH_DISABLED=true and swaps the un-exchangeable 'disabled'
        # placeholder for a worker token minted by this BFF's
        # POST /api/path/demo-subject-token — which 404s unless the BFF also
        # declares the flag. Without it every banking DATA tool fails Step 9 with
        # PingOne "Cannot parse token claims for request param 'subject_token'".
        - name: MCP_AUTH_DISABLED
          value: "true"
        # Persist structured logs + the unified token-chain trace to the PVC
        # mounted at /var/log/aidemo (survives pod restarts; queryable while the
        # pod runs). Set here (not the shared configmap) so only the BFF — which
        # has the volume + owns the trace — turns file logging on.
        - name: ENABLE_FILE_LOGGING
          value: "true"
        - name: LOG_DIRECTORY
          value: "/var/log/aidemo"
        # Persist app-events NDJSON on the bff-logs PVC with other BFF logs.
        - name: ACTIVITY_LOG_FILE
          value: "/var/log/aidemo/activity.ndjson"
        # Route BFF→agent-service calls to the k8s service DNS name.
        # Without this the BFF defaults to localhost:3006, which is unreachable
        # inside the pod. This env var must be set before the BFF starts.
        - name: AGENT_SERVICE_URL
          value: "http://agent-service:3006"
        # OpenTelemetry → in-cluster Jaeger (k8s/73-jaeger-deployment.yaml).
        # Mirrors docker-compose: the bootstrap script is mounted at /otel from
        # the otel-instrument ConfigMap (created by the deploy scripts).
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: OTEL_SERVICE_NAME
          value: "demo-api-server"
        - name: NODE_OPTIONS
          value: "-r /otel/otel-instrument.js"
        # /jaeger base path matches QUERY_BASE_PATH=/jaeger on the jaeger
        # deployment — with the base path set, jaeger serves its query API under
        # /jaeger, and the root /api/* returns the UI HTML shell instead of JSON.
        - name: JAEGER_QUERY_URL
          value: "http://jaeger:16686/jaeger"
        # Turns on services/lokiForwarder.js — unset means no-op, so native and
        # any stack without Loki keep working unchanged. Push endpoint, not the
        # query one Grafana uses; both are port 3100 on the same Service.
        - name: LOKI_URL
          value: "http://loki:3100"
        # Baked package trees live at /repo in the image (see Dockerfile).
        # Compose overrides this with a host bind-mount of the same path.
        - name: CODE_SEARCH_REPO_ROOT
          value: "/repo"
        # NotebookLM sidecar. Not in service-topology.json because it is not part
        # of the demo's inter-service chain — it is a docs-lookup side channel
        # that is absent entirely when the sidecar is not deployed. The /v1 suffix
        # matters: notebooklm-server mounts its routes under /v1 and has no
        # unprefixed surface, so dropping it silently 404s every call.
        - name: NOTEBOOKLM_URL
          value: "http://notebooklm:8000/v1"
        # PING_DOCS_BUNDLE_DIR is deliberately unset here. The 6.77MB of doc
        # bundles are not shipped to the cluster (too large for a ConfigMap, and
        # the only storage classes are ReadWriteOnce EBS). loadIndexes() returns
        # [] for a missing directory, so citations render as unlinked excerpts
        # rather than failing — degraded, not broken. See k8s/79-*.template.
        - name: NOTEBOOKLM_SERVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-demo-notebooklm
              key: server-token
              optional: true
        # secret first, configmap last → cluster URLs in the configmap win
        envFrom:
        - secretRef:
            name: ai-demo-secrets
        - configMapRef:
            name: ai-demo-config
        volumeMounts:
        - name: tls-certs
          mountPath: /certs
          readOnly: true
        - name: bff-logs
          mountPath: /var/log/aidemo
        # Persist the LMDB store (report history, configStore overrides) so it
        # survives pod restarts. Without this it lived on the pod's ephemeral
        # filesystem and every restart wiped the past-reports list.
        - name: lmdb-data
          mountPath: /app/data/persistent/lmdb
        - name: otel-instrument
          mountPath: /otel
          readOnly: true
        resources:
          requests:
            memory: "768Mi"
            cpu: "750m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /health
            port: 3001
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["curl", "-k", "-f", "https://localhost:3001/api/healthz"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tls-certs
        secret:
          secretName: tls-certs
      - name: bff-logs
        persistentVolumeClaim:
          claimName: bff-logs
      - name: lmdb-data
        persistentVolumeClaim:
          claimName: lmdb-data
      - name: otel-instrument
        configMap:
          name: otel-instrument
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-server
  namespace: ai-demo
  labels:
    app: ai-demo
    component: api-server
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: https
  selector:
    app: ai-demo
    component: api-server
---
# Persistent LMDB store for the BFF (demo-api-server).
#
# Why: the report-history list (reportStore) and configStore overrides live in
# an LMDB env at /app/data/persistent/lmdb. Without a volume this sat on the
# pod's ephemeral filesystem, so every pod restart wiped all collected reports
# and the "past reports" list came back empty. This PVC makes it durable.
#
# Defined in this file (not a standalone manifest) because k8s/deploy.sh applies
# manifests by explicit filename and already applies 20-api-server-deployment.yaml,
# so the claim is guaranteed to be created alongside the deployment that mounts it.
#
# Single ReadWriteOnce claim is sufficient: the BFF is a single replica and the
# only writer. fsGroup:1001 on the pod makes the volume group-writable by the
# non-root runtime user.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lmdb-data
  namespace: ai-demo
  labels:
    app: ai-demo
    component: api-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
