---
# Ingress for the Ping SE DevOps cluster (ping-dev-aws-us-east-2).
# Uses the cluster's nginx ingress controller — no ALB/ACM needed.
# <<NAMESPACE>> is substituted by deploy.sh with the actual namespace (e.g. ping-devops-cmuir).
# <<APP_HOST>>, <<MCP_HOST>> and <<A2A_HOST>> are substituted by deploy.sh so each
# engineer's namespace gets its own hostname and shared nginx rules never collide.
# Owner namespaces (ping-devops-cmuir, ping-devops-curtismuir) keep the canonical
# ai-demo.ping-devops.com; everyone else gets <slug>.ai-demo.ping-devops.com.
# The app is served at https://ai-demo.ping-devops.com after DNS propagation.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-demo-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Code Explorer SSE streams through this ingress; buffering + short read
    # timeouts turn a slow LLM into a browser "network error".
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Browser perimeter: every app request must carry a BFF session whose
    # PingOne identity passed the exact hosted-domain policy.
    # The SE frontend Service targets nginx's plain-HTTP listener. The frontend
    # then proxies this request to the BFF over its existing internal TLS hop.
    # Using https here attempts TLS against an HTTP port and makes the entire
    # hosted application fail closed.
    nginx.ingress.kubernetes.io/auth-url: "http://frontend.<<NAMESPACE>>.svc.cluster.local:4000/api/auth/hosted-access/check"
    nginx.ingress.kubernetes.io/auth-signin: "https://<<APP_HOST>>/api/auth/hosted-access/login?return_to=$escaped_request_uri"
spec:
  ingressClassName: nginx-public
  rules:
  - host: <<APP_HOST>>
    http:
      paths:
      # Grafana is routed here rather than proxied by the frontend's nginx, so
      # the app does not depend on it existing. nginx resolves a literal
      # upstream at STARTUP and exits if it does not resolve, so a
      # `proxy_pass http://grafana` inside the frontend meant a missing Grafana
      # crash-looped the frontend and took the WHOLE site down — the app, /api
      # and every other route with it. That happened on 2026-08-27.
      #
      # As an ingress path the blast radius is one path: a missing Grafana is a
      # 503 on /grafana and nothing else. Longest-prefix wins, so this beats the
      # "/" rule below regardless of list order.
      #
      # No rewrite-target: the /grafana prefix must reach Grafana intact to match
      # its GF_SERVER_ROOT_URL + GF_SERVER_SERVE_FROM_SUB_PATH, or the UI loads
      # blank.
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000
---
# Only the OAuth bootstrap and callback endpoints bypass ingress external auth.
# They remain protected by state, PKCE, nonce, verified identity claims, and the
# BFF's exact hosted-domain decision. Exact paths prevent broad /api/auth access.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-demo-oauth-bypass-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Login and callback endpoints are public by design, so bound them
    # independently of authenticated application traffic.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx-public
  rules:
  - host: <<APP_HOST>>
    http:
      paths:
      - path: /api/auth/hosted-access/login
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      # Sign-in modal reads the plus-addressing policy (public, no secrets).
      - path: /api/auth/hosted-access/identifier-policy
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-access/callback
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-access/logout
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-registration/request
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-registration/verify
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-registration/resend
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/auth/hosted-registration/status
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      # Public welcome wizard — shareable link for onboarding emails; renders
      # the SPA's /welcome route. Provisioning itself still requires an admin
      # session (POST /api/demo/provision-wizard is requireAdmin-gated).
      - path: /welcome
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      # Public SPA root — the app handles sign-in client-side (same as the
      # local stack). Exact-match: only the bare root is bypassed, every deep
      # link stays behind the hosted-access wall. Who may sign in is enforced
      # by the BFF's hostedAccessPolicy at both OAuth callbacks, not here.
      - path: /
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /request-access
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      # CIMD client documents PingOne Privilege fetches anonymously (Settings >
      # MCP Client Documents). One exact path per agent, GET only, no secrets.
      - path: /api/cimd/privilege/super-banking-ai-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-investment-advisor-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-records-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-purchase-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-membership-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-payroll-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-tax-records-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-financial-aid-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-supplier-contract-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-holdings-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-passenger-records-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-fraud-watch-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-balance-sweep-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/super-banking-identity-verification-specialist-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/langchain-agent/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/demo-agent-service/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      - path: /api/cimd/privilege/privilege-mcp-client/client-metadata.json
        pathType: Exact
        backend:
          service:
            name: frontend
            port:
              number: 4000
      # The registration page is a React SPA route. Its content-hashed JS/CSS
      # files must also bypass the browser auth annotation or the public form
      # loads HTML successfully but cannot boot.
      - path: /assets
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000
---
# The public MCP door: an external agent (ChatGPT, Claude, LM Studio) reaches
# oauth-mcp through PingGateway, which takes the per-tool PingOne Authorize
# decision. Deliberately its own hostname rather than a path under the app host:
# the OAuth endpoints oauth-mcp advertises are root-level (/register,
# /authorize, /token, /jwks) and would collide with the app's own routes.
#
# The name must be a SINGLE label under ping-devops.com — the cluster's
# *.ping-devops.com certificate matches one label only, so no tls block is
# needed here (and a two-label name would need its own Certificate, as
# mcpgw-agentless-ingress.yaml does).
#
# This value is also OAUTH_ISSUER on mcp-server (k8s/30-mcp-server-deployment.yaml).
# The two MUST agree: the issuer string is baked into every token's `iss` and
# into the advertised metadata, so a client that discovered one and is sent to
# the other simply fails.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-public-door-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # MCP streamable HTTP holds the response open for the session's life —
    # buffering or a short read timeout truncates the stream mid-session.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-public
  rules:
  - host: <<MCP_HOST>>
    http:
      paths:
      # RFC 9728 metadata bypasses PingGateway. IG's McpProtectionFilter
      # registers a GLOBAL handler for this path as soon as any route
      # instantiates one, so the delegation route's instance answers here and
      # serves its own resourceId (DELEGATION_RESOURCE_AUDIENCE, literally
      # "https://test") with PingOne as the authorization server. A client
      # following the 401 is then told to register at PingOne, which has no
      # dynamic client registration, and the discovery chain dead-ends with
      # nothing naming the cause. Routing this one path to mcp-server puts the
      # document back in the hands of the server that actually knows its own
      # issuer.
      #
      # pathType Prefix, not Exact: RFC 9728 §3.1 has clients request
      # <well-known>/<resource-path> (here: .../oauth-protected-resource/mcp),
      # not the bare well-known path — confirmed live via MCP Inspector, which
      # got routed past this Exact rule to ping-gateway's global handler and
      # was told to register at PingOne directly (the exact failure mode this
      # rule exists to prevent, just for the suffixed request shape). Prefix
      # matches both the bare path and any /-delimited subpath, and still
      # loses to nothing here: ingress-nginx picks the longest matching path,
      # so this stays more specific than the catch-all `/` rule below for any
      # request actually under oauth-protected-resource/.
      - path: /.well-known/oauth-protected-resource
        pathType: Prefix
        backend:
          service:
            name: mcp-server
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ping-gateway
            port:
              number: 8080
---
# Direct LangChain A2A surface. This has its own host so the public Agent Card
# and customer-IdP bearer contract cannot be confused with the Privilege MCP
# gateway path above. Only the card and /a2a are routed here; health, metrics,
# inspector, AG-UI /run, and MCP connections remain ClusterIP/internal.
#
# Needs its own cert: the controller's default *.ping-devops.com wildcard
# matches one label only, so this two-level host got a name-mismatched cert
# and every client refused it. letsencrypt-pdo is DNS-01 (see
# mcpgw-wildcard-certificate.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: langchain-a2a
  namespace: <<NAMESPACE>>
spec:
  secretName: langchain-a2a-tls
  issuerRef:
    name: letsencrypt-pdo
    kind: ClusterIssuer
  dnsNames:
    - <<A2A_HOST>>
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langchain-a2a-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx-public
  tls:
  - hosts:
    - <<A2A_HOST>>
    secretName: langchain-a2a-tls
  rules:
  - host: <<A2A_HOST>>
    http:
      paths:
      - path: /.well-known/agent-card.json
        pathType: Exact
        backend:
          service:
            name: langchain-agent
            port:
              number: 8888
      - path: /a2a
        pathType: Prefix
        backend:
          service:
            name: langchain-agent
            port:
              number: 8888
---
# The /mcpgw path-based Ingress that used to live here (ai-demo-mcpgw-ingress,
# on this same shared host) is REMOVED as of 2026-08-13 — proven live to be
# categorically incompatible with cyonproxy's TLS-native proxy port (8680):
# it negotiates HTTP/2 via ALPN and presents its own certificate, so nginx
# terminating+re-encrypting (backend-protocol HTTP/HTTPS/GRPCS, all tried
# live) hits TLS handshake failures no matter how it's configured — the fix
# is SSL passthrough, which routes purely by SNI and therefore CANNOT share
# a host+path with the app's own ingress above. See
# k8s/aws/mcpgw-passthrough-ingress.yaml (dedicated hostname, separate
# LoadBalancer) and privilege/PRIVILEGE-MCP.md for the full investigation.
