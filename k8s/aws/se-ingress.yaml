---
# Ingress for the Ping SE DevOps cluster (ping-dev-aws-us-east-2).
# Uses the cluster's nginx ingress controller — no ALB/ACM needed.
# <<NAMESPACE>> is substituted by deploy.sh with the actual namespace (e.g. ping-devops-cmuir).
# The app is served at https://ai-demo.ping-devops.com after DNS propagation.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-demo-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Code Explorer SSE streams through this ingress; buffering + short read
    # timeouts turn a slow LLM into a browser "network error".
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx-public
  rules:
  - host: ai-demo.ping-devops.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000
---
# Separate Ingress object, same host. rewrite-target is an Ingress-LEVEL
# annotation: putting it on ai-demo-ingress above would also rewrite the "/"
# frontend rule and break the app. Kubernetes allows multiple Ingress objects
# per host and nginx merges them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-demo-mcpgw-ingress
  namespace: <<NAMESPACE>>
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Strip the /mcpgw prefix so the container sees /mcp, not /mcpgw/mcp.
    # pathType: Prefix forwards the FULL path, so without this it 404s.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx-public
  rules:
  - host: ai-demo.ping-devops.com
    http:
      paths:
      - path: /mcpgw(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: ping-mcpgw
            port:
              number: 8623