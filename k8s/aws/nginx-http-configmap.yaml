---
# Overrides the nginx config for AWS deployment.
#
# On AWS the ALB terminates TLS — nginx runs plain HTTP internally.
# Apply this BEFORE the frontend deployment when deploying to EKS:
#   kubectl apply -f k8s/aws/nginx-http-configmap.yaml
#
# This replaces the tls-certs volume mount requirement in the frontend pod.
# The frontend deployment also needs imagePullPolicy: Always (set by aws/deploy.sh).

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ai-demo
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Token Lab HTML ships in the UI build (public/pinggateway-test.html).
        # Serve statically so a missing BFF proxy cannot 404 this page on AWS.
        location = /pinggateway-test.html {
            try_files /pinggateway-test.html =404;
            add_header Cache-Control "no-cache" always;
        }

        # Code Explorer SSE — must not buffer or the browser shows a network
        # error while nginx holds status/token frames until the LLM finishes.
        location /api/codegraph/ {
            proxy_pass https://demo-api-server:3001/api/codegraph/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            gzip off;
        }

        # Proxy /api/ to BFF (HTTPS inside cluster — BFF uses self-signed mkcert TLS)
        location /api/ {
            proxy_pass https://demo-api-server:3001/api/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # External MCP client doors (LM Studio, LibreChat). These three routes
        # existed ONLY in k8s/02-configmap.yaml, which this file overrides on
        # AWS/SE — so every deploy that re-applied this configmap silently
        # removed them and nginx answered POSTs with its own 405 HTML. Added
        # here 2026-08-25 so they survive a deploy. Keep in sync with the
        # matching blocks in k8s/02-configmap.yaml.

        # Recording façade in the BFF — same host/cert as /api/ above.
        location /mcp-facade/ {
            proxy_pass https://demo-api-server:3001/mcp-facade/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Agent Gateway's own OAuth broker (RFC 8414 metadata + RFC 7591 DCR +
        # authorize/callback/token) — reached DIRECTLY by the external client,
        # not through the façade. Scoped to exactly these two prefixes: the
        # gateway's other root-level routes (/health, /admin/*, /mcp) must
        # stay internal — this is the only public door into mcp-gateway:3005.
        location /oauth/ {
            proxy_pass http://mcp-gateway:3005/oauth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /.well-known/oauth-authorization-server {
            proxy_pass http://mcp-gateway:3005/.well-known/oauth-authorization-server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # OpenSearch MCP server (Helm release ping-mcpgw). Until now the only
        # way to reach this was a `kubectl port-forward` to localhost:9900 —
        # a tunnel that dies with the laptop, so the door only worked for
        # whoever was running it. This publishes it like the banking doors.
        #
        # KNOWN COUPLING, deliberately accepted: this is a literal upstream, so
        # nginx resolves it once at startup and will refuse to start if the
        # service is absent — and it belongs to a third-party Helm release
        # (ping-mcpgw) that this repo does not manage; part of that release was
        # deleted by hand on 2026-08-25. If it is ever fully uninstalled, delete
        # this block too or the frontend will not come up.
        # A resolver + variable upstream would localise that failure to a 502 on
        # this path, but nginx's resolver ignores /etc/resolv.conf search domains
        # and would need a namespace-qualified FQDN — and k8s/aws/deploy.sh only
        # rewrites the literal string "namespace: ai-demo", so an FQDN here
        # cannot follow the target namespace. The literal short name is the only
        # form that works in both ai-demo and ping-devops-cmuir.
        location /opensearch-mcp/ {
            proxy_pass http://ping-mcpgw-opensearch-mcp-server:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # MCP streamable-HTTP: responses may be SSE, so no buffering.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Proxy /jaeger/ to the in-cluster Jaeger query UI (plain HTTP; base path
        # set via QUERY_BASE_PATH=/jaeger on the jaeger deployment). Mirrors the
        # block in k8s/02-configmap.yaml (this file overrides that configmap on AWS).
        location /jaeger/ {
            # No trailing slash on proxy_pass: preserve the /jaeger prefix so it
            # matches Jaeger's QUERY_BASE_PATH=/jaeger. Stripping it makes
            # /jaeger/api/* hit Jaeger's SPA catch-all (HTML) instead of the
            # query API (JSON), which breaks the trace view.
            proxy_pass http://jaeger:16686;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
    }
