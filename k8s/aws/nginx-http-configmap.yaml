---
# Overrides the nginx config for AWS deployment.
#
# On AWS the ALB terminates TLS — nginx runs plain HTTP internally.
# Apply this BEFORE the frontend deployment when deploying to EKS:
#   kubectl apply -f k8s/aws/nginx-http-configmap.yaml
#
# This replaces the tls-certs volume mount requirement in the frontend pod.
# The frontend deployment also needs imagePullPolicy: Always (set by aws/deploy.sh).

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ai-demo
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Hashed build output — safe to cache forever; the filename changes
        # every build.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
        }

        # Handle React Router.
        #
        # index.html MUST NOT be cached: it is the only file naming the current
        # /assets/index-<hash>.js. Without this header nginx sends no
        # Cache-Control at all and browsers heuristically cache it, so after a
        # deploy they keep asking for the previous build's bundle and the page
        # renders blank. Same header as k8s/02-configmap.yaml — keep in sync.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
        }

        # Token Lab HTML ships in the UI build (public/pinggateway-test.html).
        # Serve statically so a missing BFF proxy cannot 404 this page on AWS.
        location = /pinggateway-test.html {
            try_files /pinggateway-test.html =404;
            add_header Cache-Control "no-cache" always;
        }

        # PingOne webhook to the BFF. Without this, POSTs to /webhook/pingone fall
        # through to `location /` and are answered with the SPA's index.html — a
        # 200 with an HTML body, so PingOne records the delivery as successful and
        # the events are silently discarded. Keep in sync with demo_api_ui/nginx.conf
        # and k8s/02-configmap.yaml.
        location /webhook/ {
            proxy_pass https://demo-api-server:3001/webhook/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # PingOne batches up to 500 events; the nginx default of 1m is tight.
            client_max_body_size 5m;
        }

        # Code Explorer SSE — must not buffer or the browser shows a network
        # error while nginx holds status/token frames until the LLM finishes.
        location /api/codegraph/ {
            proxy_pass https://demo-api-server:3001/api/codegraph/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            gzip off;
        }

        # The page nginx serves while the API is down: JSON for the SPA's fetches, a self-retrying page for a browser
        # navigation (e.g. the OAuth callback landing during a deploy).
        location = /__api_down {
            internal;
            default_type application/json;
            add_header Retry-After 15 always;
            add_header Cache-Control "no-store" always;
            if ($http_accept ~* "text/html") { rewrite ^ /__api_down_html last; }
            return 503 '{"error":"api_restarting","message":"The service is restarting after an update. Try again in about a minute."}';
        }

        location = /__api_down_html {
            internal;
            default_type text/html;
            add_header Retry-After 15 always;
            add_header Cache-Control "no-store" always;
            return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="8"><title>Restarting</title><style>body{font-family:system-ui,sans-serif;background:#051727;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:30rem;padding:2rem;text-align:center}h1{font-size:1.4rem}p{color:#9fb2cc;line-height:1.5}</style></head><body><main><h1>Back in about a minute</h1><p>The service is restarting after an update. This page retries on its own every few seconds.</p></main></body></html>';
        }

        # Proxy /api/ to BFF (HTTPS inside cluster — BFF uses self-signed mkcert TLS)
        location /api/ {
            proxy_pass https://demo-api-server:3001/api/;
            proxy_ssl_verify off;
            # While the api-server restarts (every deploy: its pod is replaced, not surged - its volumes are
            # ReadWriteOnce and LMDB is single-writer) nginx cannot reach it and answers 502/503/504. Say so instead of a
            # bare nginx page. error_page only fires for nginx's own failures (no upstream), not for a 5xx the BFF itself
            # returns (proxy_intercept_errors is off).
            error_page 502 503 504 /__api_down;
            # The OAuth callback answers 302 + a large session Set-Cookie. nginx's
            # default response-header buffer (4-8k) rejects it as "upstream sent
            # too big header" and the browser sees 502 even though the BFF saved
            # the session. busy_buffers_size must be >= buffer_size and less than
            # all buffers minus one (8 x 32k), or nginx -t fails.
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # External MCP client doors (LM Studio, LibreChat). These three routes
        # existed ONLY in k8s/02-configmap.yaml, which this file overrides on
        # AWS/SE — so every deploy that re-applied this configmap silently
        # removed them and nginx answered POSTs with its own 405 HTML. Added
        # here 2026-08-25 so they survive a deploy. Keep in sync with the
        # matching blocks in k8s/02-configmap.yaml.

        # Recording façade in the BFF — same host/cert as /api/ above.
        location /mcp-facade/ {
            proxy_pass https://demo-api-server:3001/mcp-facade/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Agent Gateway's own OAuth broker (RFC 8414 metadata + RFC 7591 DCR +
        # authorize/callback/token) — reached DIRECTLY by the external client,
        # not through the façade. Scoped to exactly these two prefixes: the
        # gateway's other root-level routes (/health, /admin/*, /mcp) must
        # stay internal — this is the only public door into mcp-gateway:3005.
        location /oauth/ {
            proxy_pass http://mcp-gateway:3005/oauth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /.well-known/oauth-authorization-server {
            proxy_pass http://mcp-gateway:3005/.well-known/oauth-authorization-server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # There is deliberately NO location /jaeger/ here.
        #
        # Jaeger has no authentication of any kind, so proxying it published its
        # query API to the internet: GET /jaeger/api/services returned the full
        # service list to anyone, unauthenticated. Traces carry request URLs,
        # correlation ids and the service topology — strictly more than the
        # Grafana metrics next door, which require a login.
        #
        # Traces are still reachable, behind sign-in: Grafana has Jaeger as a
        # datasource (monitoring/grafana/provisioning/datasources/jaeger.yml) and
        # talks to jaeger:16686 in-cluster, never through nginx. The /tracing
        # page links into Grafana Explore instead of Jaeger's own UI.
        #
        # The BFF's own /api/health/tracing/* proxy is unaffected — it reaches
        # Jaeger server-side and is governed by auth-requirements.json.

        # There is deliberately NO location /grafana/ here. It moved to its own
        # path on the SE ingress (k8s/aws/se-ingress.yaml), routed straight to
        # the grafana Service.
        #
        # Why: nginx resolves the literal upstream in `proxy_pass http://grafana`
        # at STARTUP and exits when it does not resolve. So proxying Grafana from
        # here made the entire app depend on Grafana existing — on 2026-08-27 a
        # deploy without it crash-looped the frontend and took the whole site
        # down, /api and the MCP door included, not just /grafana.
        #
        # Every remaining proxy_pass in this file (demo-api-server, mcp-gateway)
        # has the same startup-resolution property, so anything added here must
        # be a Service the frontend genuinely cannot serve without. Grafana is
        # not: it is a separate tool that happens to share a hostname.

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        # 'any': the SE ingress sits in front of this nginx, and the hashed assets are served with
        # Cache-Control: public, so the old list (no-cache no-store private auth) skipped them and the
        # 11 MB JS bundle went out uncompressed (~20 s per cold load).
        gzip_proxied any;
        # Vite emits .js as application/javascript, which the old list did not include.
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
    }
