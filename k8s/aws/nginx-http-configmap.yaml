---
# Overrides the nginx config for AWS deployment.
#
# On AWS the ALB terminates TLS — nginx runs plain HTTP internally.
# Apply this BEFORE the frontend deployment when deploying to EKS:
#   kubectl apply -f k8s/aws/nginx-http-configmap.yaml
#
# This replaces the tls-certs volume mount requirement in the frontend pod.
# The frontend deployment also needs imagePullPolicy: Always (set by aws/deploy.sh).

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ai-demo
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy /api/ to BFF (HTTPS inside cluster — BFF uses self-signed mkcert TLS)
        location /api/ {
            proxy_pass https://demo-api-server:3001/api/;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
    }
