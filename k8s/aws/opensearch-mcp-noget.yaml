# opensearch-mcp-noget — front for the OpenSearch MCP server used by Privilege's MCP Aggregate.
#
# Why: the upstream OpenSearch MCP server (streamable HTTP) holds the optional GET /mcp
# event stream open. Privilege's MCP Aggregate opens that GET first and waits on it, so
# every opensearch__* call through an aggregate hung (measured 2026-10-15; the banking
# member 404s the GET and works). Answering GET with 405 is allowed by the MCP spec and
# unblocks it: aggregate-limited -> opensearch__ListIndexTool went from a hang to 275 ms.
#
# The console app `opensearch` points here:
#   Backends = http://opensearch-mcp-noget.ping-devops-cmuir.svc.cluster.local
# Not applied by deploy.sh. Apply by hand:  kubectl apply -f k8s/aws/opensearch-mcp-noget.yaml
# Also used by the `pftoken` and `opensearch-hitl` doors (since 2026-10-26).
# Revert: point the apps back at the server and delete the noget ConfigMap, Deployment and Service.
# Keep the opensearch-mcp-server Service and the two NetworkPolicies: other doors need them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-mcp-noget
  namespace: ping-devops-cmuir
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        if ($request_method = GET) { return 405; }
        proxy_pass http://opensearch-mcp-server.ping-devops-cmuir.svc.cluster.local:9900;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-mcp-noget
  namespace: ping-devops-cmuir
  labels: { app: opensearch-mcp-noget }
spec:
  replicas: 1
  selector: { matchLabels: { app: opensearch-mcp-noget } }
  template:
    metadata:
      labels: { app: opensearch-mcp-noget }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 200m, memory: 64Mi }
        volumeMounts:
        - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
      - name: conf
        configMap: { name: opensearch-mcp-noget }
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-mcp-noget
  namespace: ping-devops-cmuir
spec:
  selector: { app: opensearch-mcp-noget }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
# The upstream the nginx front above proxies to. This Service was found deleted on 2026-10-26
# (the Deployment `opensearch-mcp-server` was still running), so every call through noget
# timed out (504) and Pass Agent Token discovery failed with "no such host". Restored by hand.
apiVersion: v1
kind: Service
metadata:
  name: opensearch-mcp-server
  namespace: ping-devops-cmuir
  labels: { app: opensearch-mcp-server }
spec:
  type: ClusterIP
  selector: { app: opensearch-mcp-server }
  ports: [{ name: http, port: 9900, targetPort: 9900 }]
---
# mcpgw-lb spreads requests over three gateway pods; two live in ping-devops-curtismuir.
# ai-demo-internal only admits same-namespace pods here, so those two timed out.
# These two policies only add access, port 8080, gateway pods to the noget front.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-mcp-noget-from-gateways
  namespace: ping-devops-cmuir
spec:
  podSelector: { matchLabels: { app: opensearch-mcp-noget } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ping-devops-curtismuir } }
          podSelector: { matchExpressions: [{ key: app, operator: In, values: [agentless-mcpgw, agentless-mcpgw3] }] }
      ports: [{ port: 8080, protocol: TCP }]
---
# Matching egress: ai-demo-internal in ping-devops-curtismuir only allows 80/443/53 off-namespace,
# and a Service on port 80 reaches the noget pod on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateways-to-opensearch-mcp-noget
  namespace: ping-devops-curtismuir
spec:
  podSelector: { matchExpressions: [{ key: app, operator: In, values: [agentless-mcpgw, agentless-mcpgw3] }] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ping-devops-cmuir } }
          podSelector: { matchLabels: { app: opensearch-mcp-noget } }
      ports: [{ port: 8080, protocol: TCP }]
