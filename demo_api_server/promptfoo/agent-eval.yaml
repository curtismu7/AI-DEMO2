# promptfoo eval: agent use-case correctness against the live /api/agent/invoke endpoint.
# Run from demo_api_server/:  npm run promptfoo:eval:authed   (signs in first, see promptfoo/auth-cookie.js)
#   or by hand: PROMPTFOO_BASE_URL=<app url> AGENT_COOKIE=<Cookie header> npx promptfoo eval -c promptfoo/agent-eval.yaml
# Without AGENT_COOKIE every tool-backed case gets "Please sign in again" and the run measures nothing.
# View results:               npx promptfoo@latest view
description: AI-DEMO2 agent use-case correctness matrix

prompts:
  - "{{question}}"

providers:
  - id: http
    label: Agent (heuristics)
    config:
      url: "{{env.PROMPTFOO_BASE_URL}}/api/agent/invoke"
      method: POST
      headers:
        Content-Type: application/json
        Cookie: "{{env.AGENT_COOKIE}}"
      body:
        prompt: "{{question}}"
        vertical: "{{vertical}}"
        provider: heuristics
      transformResponse: json.reply

  - id: http
    label: Agent (LLM)
    config:
      url: "{{env.PROMPTFOO_BASE_URL}}/api/agent/invoke"
      method: POST
      headers:
        Content-Type: application/json
        Cookie: "{{env.AGENT_COOKIE}}"
      body:
        prompt: "{{question}}"
        vertical: "{{vertical}}"
        provider: llamacpp
      transformResponse: json.reply ?? json.message ?? json.response

# Trivial smoke assertion shared by all cases: the agent must return
# non-empty text and must never leak internal error machinery.
defaultTest:
  assert:
    - type: not-icontains
      value: "Heuristics-only mode — no LLM"
    - type: not-icontains
      value: "Unknown action"
    - type: not-icontains
      value: "mcp_authorize_unavailable"

tests: file://agent-eval-tests.yaml
