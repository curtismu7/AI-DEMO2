filebeat.inputs:
  - type: filestream
    id: pingfederate-server-log
    paths:
      - /pf-out/instance/log/server.log*
    exclude_files: ['\.gz$']
    fields_under_root: true
    fields:
      service: pingfederate
      event.dataset: pingfederate.server
  - type: filestream
    id: pingfederate-audit-log
    paths:
      - /pf-out/instance/log/audit.log*
    exclude_files: ['\.gz$']
    fields_under_root: true
    fields:
      service: pingfederate
      event.dataset: pingfederate.audit

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_URL}"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  index: "pingfederate-logs-%{+yyyy.MM.dd}"
