# Local-only PingFederate runtime.
#
# This file is deliberately separate from the demo stack compose file. Run it
# from the repository's main checkout or through the approved worktree-serving
# workflow; do not run Docker Compose from an isolated worktree.
#
# Required external values:
#   PINGFEDERATE_PROFILE_PATH       absolute path to a prepared PF classic profile
#   PINGFEDERATE_ADMIN_PASSWORD     local PF admin password
#
# The prepared profile must contain the license at
# instance/server/default/conf/pingfederate.lic. Keep the profile, license,
# and password outside Git.

name: ai-demo-pingfederate

services:
  pingfederate:
    image: ${PINGFEDERATE_IMAGE:-pingidentity/pingfederate:13.1.3-alpine_3.24.2-al25-edge@sha256:522cca2db24360fba3fffb90ce099e9ebdf3f59112a742cfed5d8d3109569655}
    container_name: ${PINGFEDERATE_CONTAINER_NAME:-ai-demo-pingfederate}
    restart: unless-stopped
    ports:
      # Loopback only: these were published on every interface, so anyone on the same network
      # could reach the admin API (9999) and the runtime (9031). The browser (local.ping-devops.com
      # is 127.0.0.1) and other containers (OrbStack forwards host-gateway traffic to the Mac's
      # loopback, checked) still reach them. Override PINGFEDERATE_BIND to expose them on purpose.
      - "${PINGFEDERATE_BIND:-127.0.0.1}:${PINGFEDERATE_ADMIN_PORT:-9999}:9999"
      - "${PINGFEDERATE_BIND:-127.0.0.1}:${PINGFEDERATE_ENGINE_PORT:-9031}:9031"
    environment:
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PING_IDENTITY_PASSWORD: ${PINGFEDERATE_ADMIN_PASSWORD:?set PINGFEDERATE_ADMIN_PASSWORD outside Git}
    volumes:
      - pingfederate-out:/opt/out
      # JVM truststore (mkcert root import) survives redeploys — without this,
      # every recreate loses the SPIRE JWKS trust and the JWT Token Processor
      # 2.0 cannot validate SVIDs until the CA is re-imported by hand.
      - pingfederate-jvm-security:/opt/java/lib/security
      - ${PINGFEDERATE_PROFILE_PATH:?set PINGFEDERATE_PROFILE_PATH outside Git}:/opt/in:ro
    tmpfs:
      - /run/secrets
    extra_hosts:
      # PF's JVM fetches the SPIRE JWKS (JWT Token Processor 2.0) from this
      # origin; map it to the host gateway so the JVM resolves it inside the
      # container (OrbStack's 127.0.0.1 magic only applies to some resolvers).
      - "local.ping-devops.com:host-gateway"
    networks:
      ai-demo:
        aliases:
          - pingfederate

networks:
  ai-demo:
    external: true
    name: ${PINGFEDERATE_NETWORK_NAME:-ai-demo_ai-demo}

volumes:
  pingfederate-out:
    # MUST match the live configured instance volume (Federation-Info base URL
    # https://local.ping-devops.com:9031, admin user, clients/policies). The
    # older ai-demo-pingfederate-out volume still has the localhost base URL
    # baked in and silently reverts the styling fix if a recreate picks it.
    name: ${PINGFEDERATE_VOLUME_NAME:-ai-demo-pingfederate-out-classic}
  pingfederate-jvm-security:
    name: ${PINGFEDERATE_JVM_VOLUME_NAME:-ai-demo-pingfederate-jvm-security}
