# Export-time gitleaks config for scripts/export-edition.js (the gitleaks gate).
# The gate runs `gitleaks detect --no-git`, which ignores .gitleaksignore, so the
# non-secret findings that cannot change in the live repo are listed here instead.
#
# Rules: extends the default ruleset; only exact literal strings or exact file
# paths below; no wildcard paths, no whole directories, no rule disables. A real
# secret is replaced in the tracked file, never allowlisted here.
# The gate loads THIS file from the source repo, never from the exported tree.

title = "AI-DEMO2 edition export gitleaks config"

[extend]
useDefault = true

# Public PingOne resource-server audience URI. Not a secret: the "apikey" in the path
# makes generic-api-key fire. Appears in scope-topology.json (root and ping-gateway
# copy), both .env.example files, docs/scope-topology.md and the P1AZ snapshot JSON.
# Same value is accepted in the repo's .gitleaksignore. The pattern ends at a quote,
# whitespace, comma or line end, so the URI with extra characters appended is not exempt.
[[allowlists]]
description = "public audience URI https://api.ping.demo:3036/mcp/apikey (non-secret; repo .gitleaksignore)"
regexTarget = "line"
regexes = ['''https://api\.ping\.demo:3036/mcp/apikey(?:["'`\s,\\)]|$)''']

# Glean image content ids in <img src> URLs: key= identifies the image, not a credential.
# owner-confirmed 2026-09-12 (repo .gitleaksignore). Exact files only.
[[allowlists]]
description = "Glean image ids in the agent-guardrails pages (owner-confirmed 2026-09-12)"
condition = "AND"
paths = [
  '''/ping_agent_guardrails_diagram\.html$''',
  '''/demo_api_ui/public/learning-mirror/agent-guardrails\.html$''',
]
regexTarget = "line"
regexes = ['''src="https://pingidentity-be\.glean\.com/api/v1/images\?key=''']
