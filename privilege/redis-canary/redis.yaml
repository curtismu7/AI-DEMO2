# The shared Redis both Privilege gateways use for their token store (MCPGW_REDIS_URL).
# Kept since 2026-10-04 (the folder name "redis-canary" is historical). Not part of any
# deploy list: apply by hand.
#   kubectl --context us -n ping-devops-cmuir apply -f privilege/redis-canary/redis.yaml
# What it does, why, how to set it up and check it, and the rules for running it (never
# restart a gateway while this is down): privilege/GATEWAY-LOAD-BALANCER.md section 00b.
#
# The gateway reaches it by full Service name from either namespace:
#   privilege-redis.ping-devops-cmuir.svc.cluster.local:6379
# The password lives in the Secret privilege-redis (key: password); create it first, and never
# paste it into a chat or a commit:
#   kubectl --context us -n ping-devops-cmuir create secret generic privilege-redis \
#     --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=')"
#
# Persistence: append-only file on a 1Gi volume (everysec fsync), so a Redis restart no longer
# forgets every registered client. The first version of this file had none on purpose, as a
# throwaway. Still ONE replica: Redis is a single point of failure for both gateways; what the
# gateways do while it is down is recorded in the load balancer status doc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privilege-redis
  labels:
    app: privilege-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privilege-redis
  template:
    metadata:
      labels:
        app: privilege-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          # Digest-pinned (repo rule for third-party images); the index covers linux/arm64,
          # which is what the SE cluster nodes are.
          image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          command: ["sh", "-c"]
          args:
            - exec redis-server --dir /data --save "" --appendonly yes --appendfsync everysec --maxmemory 64mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: privilege-redis
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privilege-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: privilege-redis-data
  labels:
    app: privilege-redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: privilege-redis
  labels:
    app: privilege-redis
spec:
  type: ClusterIP
  selector:
    app: privilege-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
