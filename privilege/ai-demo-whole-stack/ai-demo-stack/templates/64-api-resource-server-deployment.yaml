apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-resource-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-demo
    component: api-resource-server
spec:
  replicas: 1
  # Quota-safe restarts: terminate the old pod before creating the new one so a
  # rollout never surges past the namespace CPU quota (k8s/01-namespace.yaml).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-demo
      component: api-resource-server
  template:
    metadata:
      labels:
        app: ai-demo
        component: api-resource-server
    spec:
      containers:
      - name: api-resource-server
        image: "{{ .Values.imageRegistry }}/ai-demo-api-resource-server:{{ .Values.imageTag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_RESOURCE_SERVER_PORT   # server reads API_RESOURCE_SERVER_PORT, not PORT
          value: "8082"
        - name: API_RESOURCE_SERVER_HOST     # default 127.0.0.1 is unreachable cross-pod
          value: "0.0.0.0"
        - name: DEMO_API_BASE_URL
          value: "https://demo-api-server:3001"
        envFrom:
        - configMapRef:
            name: ai-demo-config
        # API_RESOURCE_SERVER_API_KEY — provisioned by create-secrets.sh
        # (align_service_api_keys) with the SAME value the BFF vault bridge
        # serves, so apikey-dispatch never 401s on a fresh deploy.
        - secretRef:
            name: mortgage-secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api-resource-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-demo
    component: api-resource-server
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: ai-demo
    component: api-resource-server
