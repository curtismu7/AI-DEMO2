    restart: unless-stopped

  # ── MCP Proxy (HTTP-to-MCP sidecar — exposes MCP tools as plain REST) ──────────
  # Stateless agents (OpenAI Agents, Pydantic AI, Mastra) can call MCP tools via
  # simple HTTP (GET /tools, POST /tools/:name) without implementing MCP protocol.
  # Auth: callers pass Bearer token; proxy forwards it to the MCP gateway unchanged.
  mcp-proxy:
    build:
      context: ./demo_mcp_proxy
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-proxy
    ports:
      - "8895:8895"
    environment:
      PORT: "8895"
      # Topology SoT default (mcp-gateway:3005). run-docker.sh demo-sync recreates this
      # service with ping-gateway:8080 when Quick Flags select the real PingGateway stack.
      MCP_GATEWAY_HTTP_URL: "http://mcp-gateway:3005"
    networks:
      - ai-demo
    depends_on:
      ping-gateway:
        condition: service_started
    restart: unless-stopped

  # ── PingGateway (Ping Identity IG) — alternative MCP gateway ─────────────────
  # Selected at runtime by the BFF feature flag ff_mcp_gateway_pinggateway (the BFF
  # reaches it at http://ping-gateway:8080). PingGateway introspects the inbound
  # token, mirrors the Node PingOneAuthorizeClient decision (live-switchable mock
  # authz-server vs real PingOne Authorize via the X-Authz-Simulated header the BFF
  # stamps), and performs an IG-native RFC 8693 exchange to the backend MCP servers.
  # Host port is 3036 (NOT 3006 — OrbStack reserves host 3006 on macOS, same reason
  # agent-service maps 3016:3006); 3036 is only for host-side curl/testing.
  # Run the whole stack with COMPOSE_PROJECT_NAME=ai-demo so service DNS resolves.
  ping-gateway:
    image: us-docker.pkg.dev/forgeops-public/images-base/ig:latest
    container_name: ai-demo-ping-gateway
    # OrbStack preserves the container writable layer across daemon restarts, so
    # tmp/ig.pid survives an unclean stop even without a named volume. Delete it
    # before handing off to the real startup script.
    # keytool -cacerts (the stock approach) fails here: the image runs as a fixed
    # non-root uid (forgerock) with no privilege drop, and $JAVA_HOME/lib/security/
    # cacerts is root:root 0644 (not group-writable) — confirmed live via
    # `docker exec ai-demo-ping-gateway id -u` (11111) and `ls -l cacerts`.
    # Fallback: copy the JDK cacerts (keeps trust for real auth.pingone.com /
    # api.pingone.com calls IG also makes) into the writable /var/gateway instance
    # dir, then import the mkcert root into that copy; JAVA_OPTS below points the
    # JVM at it. Idempotent via `|| true` (mkcert-root re-import on restart no-ops).
    # `$$JAVA_HOME` (not `$JAVA_HOME`): Compose interpolates single-`$` vars from
    # the HOST env at `docker compose config` time (confirmed live — an unset host
    # JAVA_HOME silently rendered as an empty string). `$$` escapes to a literal
    # `$`, deferring expansion to the container's own shell/JAVA_HOME at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp "$$JAVA_HOME/lib/security/cacerts" /var/gateway/mkcert-truststore.jks 2>/dev/null || true;
        keytool -importcert -noprompt -alias mkcert-root -keystore /var/gateway/mkcert-truststore.jks -storepass changeit
        -file /certs/mkcert-rootCA.pem 2>/dev/null || true;
        rm -f /var/gateway/tmp/ig.pid && exec /opt/gateway/bin/start.sh /var/gateway
    ports:
      - "3036:8080"
    volumes:
      # /var/gateway is IG's instance dir: it must be writable + EPHEMERAL. The Docker
      # container layer (writable by default) is the Compose equivalent of the k8s
      # emptyDir the PingGateway docs require. Do NOT use a named volume here — a
      # persisted /var/gateway keeps a stale tmp/ig.pid after an unclean stop, and IG
      # then refuses to start ("PID file already exists. Cannot start") on every recreate.
      #
      # Mount config + groovy as DIRECTORIES, not individual files. IG's RouterHandler
      # watches the routes dir every ~10s; with per-file bind mounts the watcher
      # mis-detects changes and UNLOADS the routes at runtime (then /mcp 404s). A stable
      # read-only directory mount has consistent mtimes, so routes load once and stay.
      # runc/OCI can't create a new mountpoint node under an already-read-only bind
      # mount, so the nested mcp-tool-schemas.json bind mount below needs a real file
      # already present at that path in ./ping-gateway/config (a committed placeholder)
      # to bind over — that lets this directory mount stay :ro.
      - ./ping-gateway/config:/var/gateway/config:ro
      - ./ping-gateway/scripts/groovy:/var/gateway/scripts/groovy:ro
      - ./mcp-tool-schemas.json:/var/gateway/config/mcp-tool-schemas.json:ro
      - ./certs:/certs:ro   # mkcert CA imported into the JVM truststore at start (IG→BFF TLS)
    environment:
      # In-stack overrides (env block wins over env_file): reach backends + the mock
      # authz server by compose service DNS, not host.docker.internal.
      # https when mTLS is on (mcp-server serves TLS on the SAME port); http otherwise.
      PG_OLB_BACKEND_URL: "${PG_OLB_BACKEND_URL:-https://mcp-server:8080}"
      # Client cert IG presents to the MCP server. certs/ is already mounted at
      # /certs on this service. Empty => plaintext, unchanged behaviour.
      PG_MTLS_KEYSTORE_PATH: "${PG_MTLS_KEYSTORE_PATH:-/certs/gw-mtls/gw-client.p12}"
      PG_MTLS_KEYSTORE_PASSWORD: "${PG_MTLS_KEYSTORE_PASSWORD:-changeit}"
      PG_INVEST_BACKEND_URL: "http://mcp-invest:8081"
      PG_WEATHER_BACKEND_URL: "http://mcp-weather:8896"
      PG_BRAVE_BACKEND_URL: "http://mcp-brave:8897"
      PG_INBOUND_SCOPE: "gateway:mcp:invoke"
      P1AZ_MOCK_BASE: "http://authz-server:9001"
      # P1AZ_WORKER_ID comes from ./ping-gateway/.env (real decision endpoint id).
      # Do NOT pin it here — the env block wins over env_file, and a placeholder
      # pin silently overrides the real id (the mock only uses it as a path param,
      # so the real value works for both backends).
      PG_MORTGAGE_BACKEND_URL: "http://mortgage-service:8082"
      BFF_VAULT_KEY_URL: "https://api.ping.demo:3001/internal/vault/service-key"
      BFF_WEATHER_FLAG_URL: "http://api-server:3001/internal/feature-flags/weather-mcp-showcase"
      BFF_BRAVE_FLAG_URL: "https://api.ping.demo:3001/internal/feature-flags/brave-mcp-showcase"
      # BFF_INTERNAL_SECRET comes from env_file (ping-gateway/.env, written by
      # refresh-service-envs.js) so it matches the BFF's real value — do NOT set
      # it here (environment: would override env_file with a wrong/default value).
      #
      # INTENT_TOKEN_SECRET: SAME RULE, and the reason intent verification was dead
      # on this path. p1az-decision.groovy reads INTENT_TOKEN_SECRET (falling back to
      # SESSION_SECRET); with neither present the verifier short-circuits and omits
      # IntentTokenValid / IntentMatchesTool, so ~190 lines of correct HMAC checking
      # never ran. It arrives via env_file from refresh-service-envs.js, which must
      # write the BFF's EFFECTIVE signing key (intentTokenService.js:8 signs with
      # INTENT_TOKEN_SECRET || SESSION_SECRET — writing only the former leaves the
      # gateway verifying with a different key than the BFF signed with, which is a
      # silent invalid_signature on every request). Do NOT pin it here: a
      # `${INTENT_TOKEN_SECRET:-}` default would resolve to empty on a host without
      # the var and override env_file, re-killing the verifier.
      #
      # TraT parity (Path A / Path B must agree). mcp-server and mcp-gateway both
      # default this true; ping-gateway set it nowhere, so it was effectively false
      # here and the SAME request had its RAR / purp / cnf evidence forwarded to the
      # PDP through the Node gateway and silently dropped through PingGateway — while
      # PingGateway is the DEFAULT path (ff_mcp_gateway_pinggateway). Chose `true` to
      # match the other two rather than flipping them to false: the BFF's TraT context
      # is simulated for the demo, so false would strip RAR/purp/cnf from the decision
      # everywhere and leave the F4 finding unfixed on both paths. Same variable name
      # across all three services, so one host-level override moves them together.
      ALLOW_UNSIGNED_TRAT_CONTEXT: ${ALLOW_UNSIGNED_TRAT_CONTEXT:-true}
      # Fallback truststore (see entrypoint comment above): -cacerts isn't writable
      # by the fixed non-root image user, so the mkcert root is imported into a
      # copy of cacerts under /var/gateway instead, and the JVM is pointed at it.
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/var/gateway/mkcert-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
    env_file:
      # Secrets + PingOne endpoints + resource ids (gitignored; .env.example is SoT).
      - path: ./ping-gateway/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      mcp-server:
        condition: service_started
      mcp-invest:
        condition: service_started
      mcp-weather:
        condition: service_started
      mcp-brave:
        condition: service_started
      mortgage-service:
        condition: service_started
      authz-server:
        condition: service_started
        required: false   # demo-auth profile — mock Authorize when ff_authorize_simulated is ON
    restart: unless-stopped

  # ── PingOne Privilege MCPGW (commercial) ───────────────────────────────────
  # Inline MCP security gateway: just-in-time least-privilege plus full session
  # recording. Policy is authored in the PingOne Privilege console, NOT in this
  # repo — the deliberate contrast with ping-gateway above, whose policy lives
  # in ping-gateway/config/routes/.
  #
  # MCPGW_IMAGE comes from the Privilege console gateway wizard
  # (Privilege > Cloud > Gateways > Add New > Add via Wizard). No default on
  # purpose: an unset value must fail the compose run, not pull something wrong.
  ping-mcpgw:
    profiles: ["mcpgw"]
    image: ${MCPGW_IMAGE:?set MCPGW_IMAGE from the PingOne Privilege gateway wizard}
    container_name: ai-demo-ping-mcpgw
    ports:
      - "8623:8623"
    volumes:
      # Vendor doc: pingone.env is READ AS A FILE at this path, not injected as
      # env vars. Directory mount (not per-file) — per-file bind mounts are
      # mis-detected when the host file is replaced, same lesson as the
      # ping-gateway config mount above.
      - ./ping-mcpgw/config:/var/lib/procyon/config:ro
      # Reuse the existing mkcert pair rather than duplicating a private key.
      # Per-file here because the vendor expects these exact filenames; the
      # certs are stable until Oct 2028 so the replace-hazard does not apply.
      - ./certs/api.ping.demo+2.pem:/var/lib/procyon/ssl/mcpgw-cert.pem:ro
      - ./certs/api.ping.demo+2-key.pem:/var/lib/procyon/ssl/mcpgw-key.pem:ro
    networks:
      ai-demo:
        # Cert-valid alias. certs/api.ping.demo+2.pem covers
        # local.ping-devops.com, so the BFF's server-side fetch verifies TLS
        # normally, while the browser reaches the same URL via /etc/hosts and
        # the published port. One URL string, correct for both callers.
        aliases:
          - local.ping-devops.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── RAG Code Search Services ──────────────────────────────────────────────
  weaviate:
    profiles: ["rag"]
    image: semitechnologies/weaviate:latest
    container_name: ai-demo-weaviate
    # No host port publish — consumed only container-to-container as
    # http://weaviate:8080 (compose DNS). Publishing host :8080 collides with
    # mcp-server, which owns host :8080.
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_APIKEY_ENABLED: "false"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Bring-your-own vectors: the code-search service supplies embeddings,
      # so Weaviate needs no vectorizer module of its own.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      # Stable raft node identity. Without this, Weaviate derives the raft node ID
      # from the random container hostname; on a container recreate the persisted
      # weaviate-data volume then references a dead node and no leader is ever
      # elected — every schema/index op 500s ("leader not found") while the
      # raft-free /v1/meta healthcheck still passes, so it looks healthy.
      # NOTE: first applying/changing this needs a one-time `weaviate-data` volume
      # wipe + reindex to align the persisted node ID with CLUSTER_HOSTNAME.
      CLUSTER_HOSTNAME: weaviate
      RAFT_BOOTSTRAP_EXPECT: "1"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - ai-demo
    healthcheck:
      # weaviate image ships wget, not curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Embedding model server — llama.cpp in --embedding mode (NOT Ollama).
  # Serves the OpenAI-compatible /v1/embeddings endpoint. The GGUF model
  # (~140MB) downloads once via -hf and is cached in the embed-models volume.
  embeddings:
    profiles: ["rag"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-demo-embeddings
    ports:
      - "8084:8080"
    # Memory-tuned for Code Search: single slot, ctx/batch pinned to the
    # model's TRAINED context (nomic-embed v1.5 = 2048 tokens — llama.cpp
    # clamps -c to it anyway). Embeddings are non-causal, so any input longer
    # than the physical batch OR the context is rejected outright ("input (N
    # tokens) is too large to process" / "larger than the max context size"),
    # which 500'd the whole index batch. -b/-ub must equal -c, and the
    # code-search embedder truncates chunks to fit (embeddings.ts
    # MAX_EMBED_CHARS).
    command: >
      --host 0.0.0.0 --port 8080
      --embedding --pooling mean
      -c 2048 -b 2048 -ub 2048 --parallel 1
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0
    volumes:
      - embed-models:/root/.cache/llama.cpp
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  demo-mcp-code-search:
    profiles: ["rag"]
    build:
      context: ./demo_mcp_code_search
      dockerfile: Dockerfile
    image: ai-demo-mcp-code-search:latest
    container_name: ai-demo-mcp-code-search
    ports:
      - "8095:8095"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LOG_LEVEL: info
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      # service_started (not _healthy): this service's own /health stays green
      # while the embedder warms up; index/search return 503 until it's ready.
      embeddings:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8095/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  llamaindex-agent:
    profiles: ["rag"]
    build:
      context: ./llamaindex_agent
      dockerfile: Dockerfile
    image: ai-demo-llamaindex-agent:latest
    container_name: ai-demo-llamaindex-agent
    ports:
      - "8894:8894"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LLAMACPP_BASE_URL: http://llm-proxy:8090
      AGENT_MAX_TOOL_CALLS: "4"
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      embeddings:
        condition: service_started
      llm-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8894/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── LLM Proxy (Node.js smart router) ──────────────────────────────────────
  # Serves the :8090 endpoint that BFF + agent-service already target via
  # LLAMACPP_BASE_URL. Classifies each request and routes to one of 2 local
  # llama-server tiers (small :8091 / big :8096), swapping on demand.
  # Start the model backends first: bash demo_llm_proxy/start-local-models.sh
  llm-proxy:
    build:
      context: ./demo_llm_proxy
      dockerfile: Dockerfile
    image: ai-demo-llm-proxy:latest
    container_name: ai-demo-llm-proxy
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: production
      LLM_PROXY_PORT: "8090"
      # Keep-warm: 0 disables idle decay so a loaded tier stays loaded.
      # Restore classic swap decay with LLM_PROXY_IDLE_DECAY_MS=300000.
      # Optional pin: LLM_PROXY_PIN_TIER=8096
      LLM_PROXY_IDLE_DECAY_MS: "${LLM_PROXY_IDLE_DECAY_MS:-0}"
      LLM_PROXY_PIN_TIER: "${LLM_PROXY_PIN_TIER:-}"
      # Keep BOTH tiers loaded on hosts with enough RAM (≥32GB via residencyPolicy).
      # Costs ~14GB resident. Empty string = classic swap / pin-phi (24GB strategy).
      # Use ${VAR-default} (not :-) so an explicit empty from run-docker.sh is honored.
      LLM_PROXY_RESIDENT_TIERS: "${LLM_PROXY_RESIDENT_TIERS-8091,8096}"
      # PostHog LLM Analytics ($ai_generation). Optional — proxy no-ops when unset.
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://us.i.posthog.com}"
    networks:
      - ai-demo
    # Access host llama-server instances via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # K8-only tier swap manager (built for in-cluster llm stack; never starts in compose).
  tier-manager-k8:
    profiles: ["k8-build"]
    build:
      context: ./demo_llm_proxy
      dockerfile: Dockerfile.tier-manager
    image: ai-demo-tier-manager:latest

  # ── Ungoverned Agent (demo prop — DOES NOT auto-start) ───────────────────────
  # A headless browser that rides a logged-in bank session and moves money via
  # the UI — the containerized analog of an agent driving your logged-in Chrome
  # (e.g. OpenCLI). No agent identity / scope / consent / audit: the demo records
  # it as a plain user session. Gated behind the "demo-attack" profile so it is
  # only run on demand:  docker compose run --rm ungoverned-agent
  ungoverned-agent:
    build:
      context: ./demo_ungoverned_agent
      dockerfile: Dockerfile
    container_name: ai-demo-ungoverned-agent
    profiles: ["demo-attack"]
    environment:
      UI_URL: ${UNGOV_UI_URL:-https://ui:4000}
      # Supply ONE of these from a signed-in customer (see the runbook). The bank
      # APIs require a real PingOne customer session — a local login is not enough.
      SESSION_COOKIE: ${UNGOV_SESSION_COOKIE:-}
      ACCESS_TOKEN: ${UNGOV_ACCESS_TOKEN:-}
      ALLOW_LOCAL_LOGIN: ${UNGOV_ALLOW_LOCAL_LOGIN:-false}
      DEMO_USER: ${UNGOV_DEMO_USER:-john.doe}
      DEMO_PASS: ${UNGOV_DEMO_PASS:-${SEED_CUSTOMER_PASSWORD:-password123}}
      AMOUNT: ${UNGOV_AMOUNT:-50}
      DESCRIPTION: ${UNGOV_DESCRIPTION:-Ungoverned agent transfer}
    networks:
      - ai-demo
    restart: "no"

  # ── promptfoo step narration (core — always on, idle until eval) ───────────
  # Sidecar with promptfoo installed. Does not auto-run the eval on start.
  #   ./run-docker.sh promptfoo
  # Targets host :8090 (llm-proxy publish or host oMLX/mlx) via host.docker.internal.
  promptfoo-step-narration:
    build:
      context: ./demo_api_server/promptfoo
      dockerfile: Dockerfile
    image: ai-demo-promptfoo:latest
    container_name: ai-demo-promptfoo-step-narration
    environment:
      OPENAI_API_KEY: not-needed
      OPENAI_API_BASE_URL: http://host.docker.internal:8090/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-demo
    restart: unless-stopped

networks:
  ai-demo:
    driver: bridge

volumes:
  # BFF persistent LMDB store — survives `docker compose up --force-recreate`.
  ai-demo-bff-data:
  # RAG Code Search volumes
  weaviate-data:
  embed-models:
