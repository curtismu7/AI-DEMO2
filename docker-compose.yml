  # ── MCP JWT Verifier (Python / FastMCP — JWT/JWKS diagnostic tools) ─────────
  # profile demo-auth — only useful behind the Node mcp-gateway (co-starts with it).
  mcp-jwt-verifier:
    profiles: ["demo-auth"]
    build:
      context: ./demo_mcp_jwt_verifier
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-jwt-verifier
    ports:
      - "8083:8083"
    environment:
      MCP_JWT_VERIFIER_HOST: "0.0.0.0"
      MCP_JWT_VERIFIER_PORT: "8083"
      # RFC 8707 audience — must match demo_mcp_gateway's MCP_JWTVERIFIER_RESOURCE_URI
      # so the gateway's RFC 8693 re-exchange mints tokens this server accepts.
      MCP_JWTVERIFIER_RESOURCE_URI: "mcp-jwt-verifier.ping.demo"
    env_file:
      - path: ./demo_mcp_jwt_verifier/.env
        required: false   # copy demo_mcp_jwt_verifier/.env.example for PINGONE_JWKS_URI / PINGONE_ISSUER
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Mortgage Service (plain JS) ───────────────────────────────────────────────
  mortgage-service:
    build:
      context: ./demo_mortgage_service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mortgage-service
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      MORTGAGE_SERVICE_PORT: "8082"      # server reads MORTGAGE_SERVICE_PORT, not PORT
      MORTGAGE_SERVICE_HOST: "0.0.0.0"   # default 127.0.0.1 is unreachable cross-container
      # Shared with mcp-gateway DEMO_MORTGAGE_SERVICE_KEY — never use demo-mortgage-key-0000
      # (mortgage-service rejects that committed default).
      MORTGAGE_SERVICE_API_KEY: ${MORTGAGE_SERVICE_API_KEY:-mortgage-compose-dev-key}
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
    env_file:
