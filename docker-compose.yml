  # ── MCP Invest Server (TypeScript — investment tools) ───────────────────────
  mcp-resource-server:
    build:
      context: ./demo_mcp_resource_server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-resource-server
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8081"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # RFC 8693 rollout: gateway exchanges to this backend's own resource URI before
      # forwarding (aud=mcp-invest.ping.demo — the audience the PingOne resource
      # actually carries; scope-topology.json used to claim mcp-resource-server.ping.demo,
      # which exists nowhere in PingOne, so Exchange #3 never landed and the inbound
      # gateway token was forwarded instead). All three are ACCEPTED, not swapped:
      # mcpgateway.ping.demo is still what the forward-unchanged fallback sends, and
      # mcp-resource-server.ping.demo keeps any pinned older caller working.
      # Compose env wins over demo_mcp_resource_server/.env.
      # This server's OWN var — MCP_SERVER_RESOURCE_URI means the banking MCP
      # server's list everywhere else (TECH_DEBT 2026-08-16, T4).
      MCP_RESOURCE_SERVER_RESOURCE_URI: "mcp-invest.ping.demo,mcp-resource-server.ping.demo,mcpgateway.ping.demo"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "mcp-resource-server"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      # Transaction-trace hop ingest — mirrors mcp-gateway's BFF_TRANSACTION_HOP_URL.
      # BFF_INTERNAL_SECRET isn't wired for local compose (no demo_mcp_resource_server/.env
      # in the setup flow yet); emitHop() fail-opens without it, so hops just don't
      # appear locally — same no-op behavior as before this file existed.
      BFF_TRANSACTION_HOP_URL: "https://demo-api-server:3001/internal/transaction-hop"
    env_file:
      - path: ./demo_mcp_resource_server/.env
        required: false
    volumes:
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      # Airlines SQLite database. Bind (not named volume) on purpose: the DB proof
      # is "edit airlines.db from the host with sqlite3 and the next chip click
      # shows the new value". Seeded on first open from the image's seed/ dir.
      - ./demo_mcp_resource_server/data:/app/data
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
    restart: unless-stopped

