# AI Demo — local Docker Compose
#
# Starts: BFF (3001 HTTPS), UI/nginx (4000 HTTPS), MCP server (8080), LangChain agent (8888/8889/8890)
#
# Prerequisites:
#   1. Run bootstrap first: cd demo_api_server && npm run pingone:bootstrap
#      Bootstrap writes demo_api_server/.env AND generates certs/ at the repo root.
#   2. Bootstrap automatically registers Redirect URIs for all deployment targets
#      (local dev, SE DevOps cluster, and PUBLIC_APP_URL) in both PingOne apps.
#      No manual URI registration needed unless you use a custom hostname.
#   3. Add to /etc/hosts if not already there:
#        127.0.0.1  api.ping.demo
#   4. Optionally copy langchain_agent/.env.example → langchain_agent/.env for LLM key.
#
# Usage:
#   docker compose up --build          # first run (or after code changes)
#   docker compose up                  # subsequent runs (no rebuild)
#   docker compose down                # stop and remove containers
#   docker compose restart <service>   # restart one service
#
# Logs (terminal):
#   docker compose logs -f                          # all services interleaved
#   docker compose logs -f banking-api-server       # BFF
#   docker compose logs -f langchain-agent          # AI agent
#   docker compose logs -f mcp-gateway              # MCP gateway
#   docker compose logs -f mcp-server               # MCP tools
#   docker compose logs -f frontend                 # UI (nginx)
#   docker compose logs -f --tail=100 <service>     # last 100 lines + follow
#
# Logs (Docker Desktop UI):
#   1. Open Docker Desktop
#   2. Click "Containers" in the left sidebar
#   3. Click the "ai-demo" stack to expand it
#   4. Click any container name (e.g. ai-demo-api-server) to open its log view
#   5. Use the search box to filter log lines
#   6. Click the download icon to save logs to a file
#
# Optional compose profiles (run-docker.sh default = core + rag):
#   rag        weaviate, embeddings, demo-mcp-code-search, llamaindex-agent (on by default)
#   agents     openai-agent, mastra-agent, pydantic-agent
#   tracing    jaeger
#   demo-auth  demo authz-server + demo mcp-gateway (when FF selects demo path)
# Core default: real PingOne Authorize + PingGateway (IG). Flip FF in admin, then
#   ./run-docker.sh demo-sync   (or restart the stack) to start/stop demo-auth.

# Pin the Compose project name so bare `docker compose` from this directory
# matches run-docker.sh (COMPOSE_PROJECT_NAME=ai-demo). Without this, the
# default is the directory basename (e.g. ai-demo2), which splits the stack
# and makes stop/restart appear to hang.
name: ai-demo

services:

  # ── Jaeger UI + OTLP collector (free local tracing backend) ────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ai-demo-jaeger
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ai-demo
  demo-api-server:
    build:
      context: .    # repo root — BFF references scope-topology.json and docs/ from ../../
      dockerfile: demo_api_server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-api-server
    ports:
      - "3001:3001"
    env_file:
      - path: ./demo_api_server/.env
        required: true   # generated by bootstrap (npm run pingone:bootstrap in demo_api_server/)
      # dotenvx runtime decrypt key (vault→dotenvx cutover), delivered via env_file
      # — NEVER `environment:` (that always overrides env_file for the same key,
      # even when the key is absent today; see PR #911/#914 and the compose-env-
      # shadow hygiene check). Also deliberately NOT a line inside
      # demo_api_server/.env itself: that file is the ciphertext DOTENV_PRIVATE_KEY
      # decrypts, so co-locating the key with what it decrypts would defeat
      # encryption-at-rest entirely (a leaked .env would carry its own key). The
      # migration plan's own architecture puts the key in the SEPARATE, gitignored
      # `.env.keys` (2026-08-18-vault-dotenvx-full-replace.md — "`.env.keys` =
      # `DOTENV_PRIVATE_KEY` (gitignored)"), exactly like VAULT_PASSWORD living in
      # demo_api_server/.env while decrypting the SEPARATE secrets.vault file, never
      # itself. required:false: absent (un-migrated / fresh clone) is a no-op — the
      # service's own `.env` is then plaintext and loads unchanged.
      - path: ./.env.keys
        required: false
    environment:
      NODE_ENV: development
      # Allow self-signed TLS (host.docker.internal MCP server)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Open-access demo flag — same value the mcp-server gets. The BFF reads it
      # only to gate /api/path/demo-subject-token (mints the demo-user token the
      # mcp-server needs as a Step 9 subject_token on the Privilege open-access
      # hop). 404s the endpoint when false. No other BFF behavior keys on it.
      MCP_AUTH_DISABLED: "${MCP_AUTH_DISABLED:-false}"
      # Phase 4 crash guard: unhandled rejections log-and-continue in demo runs
      # (see demo_api_server/utils/crashGuard.js).
      CRASH_GUARD: "1"
      # OpenTelemetry → local Jaeger. Unset = tracing disabled (no-op in instrument.js).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "demo-api-server"
      # ── MCP Enterprise-Managed Authorization (native ID-JAG) ────────────────
      # Must match mcp-server's values: the BFF signs the assertion with
      # ENTERPRISE_IDP_ISSUER and oauth-mcp validates `iss` against the same.
      ENTERPRISE_IDP_ISSUER: "${ENTERPRISE_IDP_ISSUER:-https://idp.ping.demo}"
      ENTERPRISE_IDP_JWKS_URL: "${ENTERPRISE_IDP_JWKS_URL:-https://demo-api-server:3001/api/enterprise-idp/jwks}"
      # Where the BFF POSTS the grant vs the audience it names in the assertion.
      # These deliberately differ: oauth-mcp publishes its issuer as
      # https://localhost:8080 but is reachable in-network at mcp-server:8080,
      # and `aud` must equal the issuer or verification fails on audience.
      ENTERPRISE_MCP_AS_TOKEN_URL: "${ENTERPRISE_MCP_AS_TOKEN_URL:-http://mcp-server:8080/token}"
      ENTERPRISE_MCP_AS_ISSUER: "${ENTERPRISE_MCP_AS_ISSUER:-https://localhost:8080}"
      # enterpriseMcpPolicyService.getAllowedResourceUris() defaults to the
      # scope-topology gateway-routed audiences (mcpserver.ping.demo,
      # mcpgateway.ping.demo) only — an external EMA client connecting
      # DIRECTLY to mcp-server (bypassing the gateway, e.g. MCP Inspector at
      # http://localhost:8080/mcp for local testing) requests that raw
      # resource identifier instead, and leg 2 (ID-JAG mint) 400s with
      # invalid_target unless it's explicitly allow-listed here. Setting this
      # REPLACES the whole default list (see getAllowedResourceUris), so both
      # existing audiences are repeated rather than dropped.
      ENTERPRISE_MCP_RESOURCE_URIS: "${ENTERPRISE_MCP_RESOURCE_URIS:-mcpserver.ping.demo,mcpgateway.ping.demo,http://localhost:8080/mcp}"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      JAEGER_QUERY_URL: "http://jaeger:16686"
      # Don't wipe persisted sessions on every restart/recreate — otherwise each
      # api-server boot logs out all users (server.js defaults this ON when unset),
      # so a redeploy silently blanks logged-in pages like /themes until re-auth.
      CLEAR_SESSIONS_ON_BOOT: "false"
      # The vault's audit trail defaults to a sibling of the vault file, which
      # here is /secrets.vault (a :ro mount at container root, owned by root).
      # appuser cannot create /secrets.vault.audit.log, so the fail-closed
      # writability check at open threw EACCES and the BFF refused to start
      # entirely. Point the trail at the persistent volume instead — same
      # enforcement, writable location.
      VAULT_AUDIT_LOG_PATH: "/app/data/persistent/secrets.vault.audit.log"
      # TLS cert paths — BFF auto-detects these and serves HTTPS when they exist
      SSL_CRT_FILE: "/certs/api.ping.demo+2.pem"
      SSL_KEY_FILE:  "/certs/api.ping.demo+2-key.pem"
      # Container-to-container MCP (plain HTTP — internal network only)
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Derived from the single MCP_MTLS_ON switch (see mcp-server, ~L343). When on,
      # the server serves TLS on MCP_SERVER_PORT, so the BFF's direct WS client has
      # to dial wss:// — plaintext ws:// into that listener dies with "socket hang
      # up" and the MCP Inspector falls back to the local catalog.
      # mcpWebSocketClient.getMcpServerUrl() reads this flag.
      MCP_MTLS_ENABLED: "${MCP_MTLS_ON:+true}"
      # Route BFF tool calls through the active MCP gateway. Core stack default is
      # real PingGateway (ping-gateway:8080); run-docker.sh demo-sync recreates the
      # BFF with mcp-gateway:3005 when Quick Flags select the demo Node gateway.
      MCP_GATEWAY_HTTP_URL: "http://ping-gateway:8080"
      # RAG code-search service (Weaviate + embeddings). Must be the compose DNS
      # name — routes/codeSearch.js defaults to localhost:8095, which inside this
      # container is the BFF itself, so the /code-search UI page fails without it.
      MCP_CODE_SEARCH_URL: "http://demo-mcp-code-search:8095"
      # PingGateway (IG) gateway — the DEFAULT MCP enforcement point (real PingOne
      # token end-to-end). Env is synced into the store at every boot (FF_ENV_MAP),
      # so this value wins over persisted toggles; flip here to change the default.
      # Internal service DNS (OrbStack reserves host 3006; PingGateway's host port is 3036).
      MCP_PINGGATEWAY_URL: "http://ping-gateway:8080"
      # Default MCP endpoint offered by the /privilege-mcp-client page.
      # host.docker.internal resolves to the host machine's local MCP server (self-signed TLS).
      # MCP endpoint the Privilege client page defaults to. This must be the
      # GATEWAY FRONTEND (ping-mcpgw, profile mcpgw), not the Privilege tenant
      # cloud API: https://privilege.pingone.com/api/mcp answers 401 "User is
      # not authorized" to every token this environment can mint, including one
      # from the env's own "Privilege Cloud MCP Gateway" app, because that aud
      # belongs to the demo tenant. It also 401s its own
      # .well-known/oauth-protected-resource and sends no WWW-Authenticate, so
      # discoverAuth() never learns the real authorization server and silently
      # falls back to the demo environment's PingOne.
      # Overridable so the SE cluster can point at https://ai-demo.ping-devops.com/mcpgw.
      # The Privilege console ASSIGNS each MCP Server application a frontend FQDN
      # (Agentic Apps -> mypingone -> Frontend Name) and hosts it in the cloud:
      # requests land on privilege.pingone.com and are routed over the mesh to the
      # enrolled private proxy, which forwards to Backend Name. Nothing binds
      # locally, so pointing this at a local port can never work — verified by
      # probing the FQDN (401 with a real challenge) vs local ports (no listener).
      # No hardcoded/default overrides here — environment: would shadow env_file
      # (demo_api_server/.env is `required: true` above) per PR #914's rule.
      # PRIVILEGE_MCPGW_URL, PRIVILEGE_SSO_ENV_ID, PRIVILEGE_SSO_CLIENT_ID,
      # PRIVILEGE_SSO_CLIENT_SECRET live only in demo_api_server/.env — fresh
      # rebuild target is PingOne env 8d4d7a4c-de40-4f71-9b98-0c3507cd4d1b.
      PRIVILEGE_LOGIN_HINT: "cmuir+ssoEndUser@pingone.com"
      MCPGW_CONFIG_PATH: "/app/mcpgw-config"
      PINGONE_MCP_GATEWAY_CLIENT_ID: "6586d3de-b916-454c-84e5-6d21b572a534"
      # Agent Gateway + Authorize engine toggles live in admin Quick Flags (not pinned
      # here) so operators can switch demo vs real without rebuilding. After flipping,
      # run `./run-docker.sh demo-sync` (or restart the stack) to start/stop the
      # demo-auth compose profile (authz-server + mcp-gateway).
      #
      # AUTHORIZE ENGINE (default = real PingOne Authorize ONLY, 2026-06-20):
      # ff_authorize_real is the SINGLE positive flag. Default "true" routes the
      # BFF to the real cloud PingOne
      # Authorize decision endpoint and FAILS CLOSED (HTTP 503) on a genuine PingOne
      # outage — it does NOT fall back to the mock. ff_authorize_real also
      # drives the inverse X-Authz-Simulated header, so "true" routes the agent/MCP
      # tool path to real P1AZ too (PERMITs end-to-end per the provisioned MCP policy).
      # To force the simulated/education engine on BOTH paths, flip the feature
      # flag: FF_AUTHORIZE_REAL: "false" (or toggle it in the admin UI). To allow
      # mock fallback on an outage instead of failing closed, set
      # AUTHORIZE_FAILOVER_MODE: "fallback_simulated".
      # Do NOT set AUTHORIZE_MODE here — an explicit authorize_mode wins over the
      # flag in resolveAuthorizeMode() and would make the flip a no-op.
      AUTHORIZE_FAILOVER_MODE: "deny"
      # Mock Authorize PDP for teaching surfaces (/api/authorize/mock-authz-rules).
      # Must be compose DNS — localhost:9001 is the BFF code default and is unreachable
      # inside this container (left the A2A explain modal empty for Authorize rules).
      PINGAUTHORIZE_ENDPOINT: "http://authz-server:9001"
      PINGAUTHORIZE_MOCK_BASE: "http://authz-server:9001"
      # Forwarded as X-Authz-Admin-Token by authorize.js's mock-authz-rules proxy
      # (_authzAdminHeaders()). Must match authz-server's AUTHZ_ADMIN_TOKEN above —
      # same dev-only default, override via shell env together.
      AUTHZ_ADMIN_TOKEN: "${AUTHZ_ADMIN_TOKEN:-dev-authz-admin-token-change-me}"
      # Default agent to the local llama.cpp reasoning engine (free, no external
      # key). NOTE: getEffective() reads env-FIRST, so this AGENT_MODE env var
      # OVERRIDES any persisted /config selection on every read — it is the
      # single source of truth for the default agent mode. The reason loop runs
      # in agent-service (:3006) against LLAMACPP_BASE_URL (the :8090 model proxy).
      AGENT_MODE: "llamacpp"
      # Cap messages forwarded to stateless agents (env wins over persisted /config).
      AGENT_HISTORY_LIMIT: "10"
      LANGCHAIN_AGENT_HTTP_URL: "http://langchain-agent:8888"
      AGENT_SERVICE_HOST: "langchain-agent"
      HITL_SERVICE_URL: "http://hitl-service:3009"
      AGENT_SERVICE_URL: "http://agent-service:3006"
      # Web Bot Auth: the origin the BFF advertises in Signature-Agent, which the
      # GATEWAY then fetches for the key directory. Unset, mcpGatewayClient falls
      # back to http://localhost:3001 — and inside the gateway container that is
      # the GATEWAY, not the BFF, so the fetch always failed:
      #   "[GW] Web Bot Auth monitor: key directory fetch failed
      #    (http://localhost:3001/.well-known/http-message-signatures-directory)"
      # wbaMode is 'monitor', so nothing blocked and a monitor that had NEVER
      # verified anything looked exactly like one finding nothing wrong.
      # https + service name because the BFF serves TLS on 3001 and the gateway
      # mounts the mkcert CA bundle (NODE_EXTRA_CA_CERTS), so it validates.
      WBA_SIGNATURE_AGENT_URL: "https://demo-api-server:3001"
      MCP_GW_PASSTHROUGH_TO_MCP_SERVER: "false"
      # Pin MCP audiences so stale demo_api_server/.env cannot fail startupConfigGuard.
      # Both keys map to the mcpServer role and MUST include mcpserver.ping.demo
      # (see startupConfigGuard.js + scope-topology.json).
      # https://api.pingone.com accepted for PingOne Privilege proxy client_credentials tokens.
      # https://api.ping.demo:3036/mcp (PingGateway/IG) — kept in sync with the mcp-server
      # service's own copy below; see that comment for why native ID-JAG needs it.
      MCP_SERVER_RESOURCE_URI: "mcpserver.ping.demo,mcpgateway.ping.demo,https://api.pingone.com,https://api.ping.demo:3036/mcp"
      MCP_RESOURCE_URI: "mcpserver.ping.demo,mcpgateway.ping.demo,https://api.pingone.com,https://api.ping.demo:3036/mcp"
      # Accept Node-gateway + PingGateway audiences (Path B dual_token when IG mode is ON),
      # plus the A2A specialists' dedicated Exchange #2 audience (see
      # a2aDelegationService.js resolveA2aConfig / pingoneProvisionService.js Step 37a-A2A) —
      # tokenValidator.ts already parses this as a comma-separated list.
      # mcpserver.ping.demo (4th entry) is oauth-mcp's OWN audience — a native
      # ID-JAG-redeemed token is always minted for it (TokenIssuer.resolveOwnAudience,
      # oauth-mcp), never for this gateway's own audience, so the Node gateway must
      # accept it directly. tokenValidator.ts's ID-JAG filter verifies these tokens
      # against oauth-mcp's own JWKS (not PingOne's) before this aud check ever runs.
      MCP_GW_RESOURCE_URI: "mcpgateway.ping.demo,https://api.ping.demo:3036/mcp,mcpgateway-a2a.ping.demo,mcpserver.ping.demo"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # Agent frameworks (langchain et al) call back into the BFF at this origin
      # to execute tools with RFC 8693 exchange — agentRun.js appends
      # /internal/agent-tool itself, so this must be the ORIGIN ONLY. Without it
      # the code falls back to 127.0.0.1 — unreachable from agent containers, so
      # every AG-UI tool call died with ConnectError and the agent never replied.
      # Hostname must match the mkcert cert SAN (api.ping.demo — see the network
      # alias on this service below).
      BFF_INTERNAL_TOOL_URL: "https://api.ping.demo:3001"
      # NOTE: Public URLs (PINGONE_PUBLIC_APP_URL, PINGONE_RESOURCE_PINGGATEWAY_URI,
      # redirect URIs, etc.) are now sourced from demo_api_server/.env (master copy).
      # No hardcoded overrides in this docker-compose.yml — env_file loads them from .env.
      # See scope-topology.json for the definition of these values per environment.
      # scope-topology.json is bind-mounted via the repo root as a DIRECTORY (see
      # volumes: ./:/repo below) so it survives host-file replacement; point the
      # BFF readers (scopeTopology.js, configStore.js) at that stable path.
      SCOPE_TOPOLOGY_PATH: "/repo/scope-topology.json"
      # llama.cpp — BFF status probe (llmProviderStatus.js) needs the host-reachable
      # URL (origin only; the service appends /v1). Launch llama-server on the host.
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      # Small NON-reasoning model: BFF NL-intent / teaching answers must return
      # under the SPA fetch timeout. A reasoning model takes ~22s+ and blows it,
      # surfacing "Could not parse: signal timed out"; a 3.8B-class model answers
      # in ~3s. Leave LLAMACPP_MODEL unset to use whatever llama-server reports.
      LLAMACPP_MODEL: "phi-4-mini-instruct"
      # Apple mlx-lm demo agent mode (host mlx_lm.server on :8098; Mac only).
      MLX_LM_BASE_URL: "http://host.docker.internal:8098"
      # Trust the mkcert root so the BFF can complete a TLS handshake with the
      # demo's own hosts. mcpChallengeProbe follows the RFC 9728 pointer in the
      # gateway's WWW-Authenticate challenge, which is
      # https://api.ping.demo:3036/.well-known/... — without this the metadata
      # leg of the MCP discovery dance fails verification and the token chain
      # shows the 401 with no authorization server resolved. Bundle = system CAs
      # PLUS the mkcert root (NODE_EXTRA_CA_CERTS appends, never replaces), same
      # file the other Node services already use.
      NODE_EXTRA_CA_CERTS: /certs/ca-bundle-with-mkcert.pem
      CODE_SEARCH_DEFAULT_INDEX: ${CODE_SEARCH_DEFAULT_INDEX:-true}
      CODE_SEARCH_REPO_ROOT: /repo
      LLAMAINDEX_AGENT_URL: http://llamaindex-agent:8894
    command: npm start  # Dockerfile uses production deps only (no nodemon)
    volumes:
      - ./certs:/certs:ro   # mkcert certs generated by bootstrap
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      - ./LLM2.json:/LLM2.json:ro   # Helix agent key (gitignored secret — mount from host)
      - ./llm-timeouts.json:/llm-timeouts.json:ro   # agentReasoningClient.js resolves via ../../ from /app/services
      # pingcli: staged into demo_api_server/bin/ by ensure_bind_mounts (repo-relative;
      # OrbStack cannot bind-mount /opt/homebrew). Reached at /app/bin/pingcli via the
      # demo_api_server bind mount below — no separate host-path volume needed.
      # Hot reload: mount source code so changes reflect instantly without rebuild
      - ./demo_api_server:/app
      - /app/node_modules  # exclude node_modules from mount (use container's version)
      - .:/repo:ro   # read-only repo root for the default code-search index
      # Agent Gateway JSON config editor (/agent-gateway-config admin page): the BFF
      # reads/writes the gateway's JSON on the host. RW (not :ro) so saves persist;
      # IG picks up routes/*.json via its ~10s directory watcher, config/admin need a
      # restart.
      - ./ping-gateway/config:/app/gateway-config
      - ./ping-mcpgw/config:/app/mcpgw-config
      # scope-topology.json (configStore + scopeTopology SSOT) is read via
      # SCOPE_TOPOLOGY_PATH=/repo/scope-topology.json. Mounting the repo root as a
      # DIRECTORY — rather than the single file — is deliberate: a single-file
      # bind mount goes stale when the host file is replaced (git merge /
      # topology regen give it a new inode), vanishing in-container and
      # crash-looping the BFF at require-time. A directory mount re-resolves the
      # file on every read. Must be RW: the /agent-gateway-config admin editor
      # saves scope-topology.json through this mount (writeAtomic temp+rename,
      # backups in /repo/.backups — gitignored) and a :ro mount turns every
      # save into a 500 (EROFS).
      - ./:/repo
      # Encrypted secrets vault (Phase 269). vaultLoader's default path is
      # REPO_ROOT/secrets.vault, which resolves to /secrets.vault inside /app —
      # mount the committed encrypted file there. VAULT_PASSWORD arrives via the
      # env_file (demo_api_server/.env); without it the BFF fails fast (exit 1),
      # so run-docker.sh's vault preflight verifies the password decrypts first.
      - ./secrets.vault:/secrets.vault:ro
      # One-click "Restart gateway" button hits the Docker Engine API over this socket
      # (no docker CLI/dep in the image). Admin-gated; only restarts the two allowlisted
      # containers. This grants host container control — keep the endpoint locked down.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the BFF LMDB store (configStore, sessions, accounts, demo
      # scenarios, client registry, security monitoring) across container
      # recreate. Without this, `docker compose up --force-recreate` rebuilds
      # the writable layer and wipes runtime config (e.g. authorize_mode).
      - ai-demo-bff-data:/app/data/persistent
    # Join the docker.sock's group so the non-root BFF (appuser) can call the
    # Docker Engine API for the /agent-gateway one-click restart. OrbStack/Docker
    # Desktop expose the socket as root:root (mode 660), so group 0 is required.
    # The restart endpoint is admin-gated and only touches two allowlisted
    # containers; this does NOT run the BFF as root.
    # api.ping.demo is a host /etc/hosts name (mkcert issued the cert for it), so
    # it does not resolve on the compose network. mcpChallengeProbe follows the
    # gateway's RFC 9728 pointer literally — https://api.ping.demo:3036/... —
    # rather than substituting an internal name, because rewriting the URL would
    # make the token chain claim a document the client was never pointed at.
    # Mapping the name to the host lets that published port answer.
    extra_hosts:
      - "api.ping.demo:host-gateway"
    group_add:
      - "0"
    networks:
      ai-demo:
        # Cert-valid alias: the mkcert cert SANs cover api.ping.demo (not the
        # demo-api-server service name), so agent containers can verify TLS on
        # the internal tool callback (BFF_INTERNAL_TOOL_URL above).
        aliases:
          - api.ping.demo
    depends_on:
      jaeger:
        condition: service_started
        required: false   # tracing profile — BFF starts without Jaeger when profile is off
      mcp-server:
        condition: service_started
    healthcheck:
      # -k skips chain verify (mkcert cert, trusted on host but not inside container)
      test: ["CMD", "curl", "-k", "-f", "https://localhost:3001/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── UI (Vite build → nginx HTTPS) ──────────────────────────────────────────
  ui:
    build:
      context: .    # repo root — builder needs llm-timeouts.json (../../../ from /app/src/services)
      dockerfile: demo_api_ui/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        # Read from the ROOT .env. Build-time, not runtime: the production stage
        # is static nginx, so Vite must inline the value during `npm run build`.
        REACT_APP_POSTHOG_KEY: ${REACT_APP_POSTHOG_KEY:-}
        REACT_APP_POSTHOG_HOST: ${REACT_APP_POSTHOG_HOST:-}
    container_name: ai-demo-ui
    ports:
      # Container listens on 4000 in both modes — nginx (production stage,
      # nginx.conf `listen 4000 ssl`) and the Vite dev server (vite.config.js).
      # Same container port means the dev override inherits this mapping and
      # needs no `ports` override (no Compose `!override` tag required).
      - "4000:4000"
    volumes:
      - ./demo_api_ui/src:/app/src  # Hot reload: Vite watches src changes
      - ./certs:/etc/nginx/certs:ro
      - ./llm-timeouts.json:/llm-timeouts.json:ro   # demoAgentService.js resolves via ../../../ from /app/src/services
    networks:
      - ai-demo
    depends_on:
      demo-api-server:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Server (WebSocket — plain HTTP, internal only) ───────────────────────
  mcp-server:
    build:
      context: ./oauth-mcp
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      # environments.ts defaults development mode to a relative
      # './dev-data/tokens' path the Dockerfile never creates/chowns (only
      # /app/data/tokens, the production path, for the non-root appuser) —
      # every session write hits EACCES. See k8s/30-mcp-server-deployment.yaml.
      TOKEN_STORAGE_PATH: "/app/data/tokens"
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8080"
      # Opt-in TLS+ALPN listener for real HTTP/2 to the BFF's http2McpBridge.js.
      # Default off: when unset, no second port is bound, no cert is generated,
      # and the plain ws:// listener on MCP_SERVER_PORT is completely unaffected.
      MCP_TLS_ENABLED: "${MCP_TLS_ENABLED:-false}"
      MCP_TLS_PORT: "8443"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "mcp-server"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      MCP_RESOURCE_URL: "http://localhost:8080"
      HTTP_MCP_TRANSPORT_ENABLED: "true"
      # embeddedIssuer.ts defaults to https://localhost:<MCP_SERVER_PORT> when
      # unset, but MCP_TLS_ENABLED defaults off — so an external client (e.g.
      # MCP Inspector) that follows the discovery document literally gets a
      # TLS connection failure on every advertised endpoint, even though the
      # same paths work fine over plain HTTP. K8s deployments already set
      # OAUTH_ISSUER explicitly to their real public host; this default only
      # fixes local docker-compose.
      OAUTH_ISSUER: "${OAUTH_ISSUER:-http://localhost:8080}"
      # Open DCR so an external client (MCP Inspector, ChatGPT, Claude Desktop)
      # can self-register without a pre-shared initial access token — same
      # posture the SE cluster's external door already runs with. Local-only:
      # nothing else in this compose stack calls /register.
      MCP_OPEN_CLIENT_REGISTRATION: "${MCP_OPEN_CLIENT_REGISTRATION:-true}"
      # ── MCP Enterprise-Managed Authorization (native ID-JAG) ────────────────
      # Both halves of native mode are configured HERE, not at runtime:
      # OAuthRouter.nativeIdJagEnabled() reads process.env, so a UI toggle could
      # never arm this side. With it always configured, oauth-mcp stands willing
      # to redeem an ID-JAG and the BFF's ff_enterprise_managed_mcp_auth flag —
      # which IS runtime-settable — becomes the single demo switch.
      # NODE_EXTRA_CA_CERTS (above) trusts the BFF's mkcert TLS, so this JWKS
      # fetch verifies for real rather than being waved through.
      ENTERPRISE_IDP_ISSUER: "${ENTERPRISE_IDP_ISSUER:-https://idp.ping.demo}"
      ENTERPRISE_IDP_JWKS_URL: "${ENTERPRISE_IDP_JWKS_URL:-https://demo-api-server:3001/api/enterprise-idp/jwks}"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # api_key feature tools (show_mortgage/show_health_record/...) executed by
      # this server itself on gateway-less hops (Privilege/Procyon AI Gateway
      # client → mcp-server direct) — same credential swap the demo mcp-gateway
      # does on the normal chain. Mirrors mcp-gateway's values below.
      API_RESOURCE_SERVER_URL: "http://api-resource-server:8082"
      DEMO_API_RESOURCE_SERVER_KEY: ${API_RESOURCE_SERVER_API_KEY:-mortgage-compose-dev-key}
      MCP_RESOURCE_SERVER_HTTP_URL: "http://mcp-resource-server:8081"
      DEMO_MCP_RESOURCE_SERVER_KEY: ${API_RESOURCE_SERVER_API_KEY:-mortgage-compose-dev-key}
      # RFC 8693 rollout: the gateway now exchanges the inbound token for one scoped to
      # this backend's own resource URI (RFC 8707 `resource` param) before forwarding, so
      # MCP server tokens carry aud=mcpserver.ping.demo. MCP_SERVER_RESOURCE_URI accepts a
      # comma-separated list; mcpgateway.ping.demo is kept as a transitional second entry
      # so tokens from callers still on the old forward-unchanged contract keep validating.
      # https://api.pingone.com accepted for PingOne Privilege proxy client_credentials tokens.
      # https://api.ping.demo:3036/mcp (PingGateway/IG) accepted so a native ID-JAG minted
      # under this demo's default PingGateway routing mode can be redeemed here — same
      # audience MCP_GW_RESOURCE_URI below already accepts for the Node gateway's own
      # dual_token path. Without it, IdJagGrantHandler rejects the resource as "not served
      # by this authorization server" even though the mint itself succeeds.
      # http://localhost:8080/mcp accepted so an EMA client (MCP Inspector) that
      # addresses this server directly by its published host port can redeem an
      # ID-JAG minted for that resource — the demo-api-server side already
      # allow-lists the same URI via ENTERPRISE_MCP_RESOURCE_URIS.
      MCP_SERVER_RESOURCE_URI: "mcpserver.ping.demo,mcpgateway.ping.demo,https://api.pingone.com,https://api.ping.demo:3036/mcp,http://localhost:8080/mcp"
      # mTLS on the PingGateway -> MCP server hop. When on the server serves
      # HTTPS (self-signed, regenerated each start) and REQUIRES a client cert
      # whose SHA-256 matches MCP_MTLS_GATEWAY_CERT_PATH.
      #
      # ONE SWITCH — `MCP_MTLS_ON` in the root .env — drives every side of the hop,
      # because they must move together or the channel breaks in both directions:
      #   this listener (here) · BFF ws/wss + audit hop (~L105) · Node mcp-gateway
      #   MCP_GW_OLB_WS_URL + client certs (~L493) · PingGateway PG_OLB_BACKEND_URL
      #   + keystore (~L1044).
      # Set MCP_MTLS_ON=1 to turn mTLS on; leave it unset/empty for plaintext.
      # `${MCP_MTLS_ON:+x}` is how a bare on/off switch becomes a scheme (http/https,
      # ws/wss) and a "true" without a second variable that can drift out of sync.
      #
      # Currently OFF: 50dd52be (privilege-mcp) turned this listener plaintext while
      # every client still dialled TLS, which killed the gateway->MCP hop
      # ("Unsupported or unrecognized SSL message"). Re-enable with MCP_MTLS_ON=1
      # once the Privilege MCP path works with an mTLS listener.
      MCP_MTLS_ENABLED: "${MCP_MTLS_ON:+true}"
      MCP_MTLS_GATEWAY_CERT_PATH: "/certs/gw-mtls/gw-client.crt"
      # Step 9 (RFC 8693): the MCP server exchanges the gateway-scoped token for a
      # Demo API (enduser.ping.demo) resource-scoped one before calling the Banking
      # API — the MCP-spec hop. Uses a DEDICATED PingOne app, not the shared
      # exchanger: PingOne forbids one app holding two scopes of the same NAME
      # across resource grants, so "Demo AI App - Token Exchanger" (read/write on
      # Demo MCP Server) can never also hold them on Demo API.
      #
      # Its three settings are NOT declared here on purpose:
      #   PINGONE_MCP_EXCHANGER_CLIENT_ID / _SECRET / BANKING_API_RESOURCE_URI
      # They come from this service's env_file (oauth-mcp/.env). A compose
      # `environment:` entry OVERRIDES env_file, so declaring them here with a
      # "${VAR:-}" default blanked the real secret that env_file already supplied
      # — the gate then silently fell back to agent-passthrough. Set or comment
      # BANKING_API_RESOURCE_URI in oauth-mcp/.env to switch Step 9 on/off.
      # RAG code-search service — the code_search/get_code/list_codebases tool
      # handlers call this over compose DNS.
      MCP_CODE_SEARCH_URL: "http://demo-mcp-code-search:8095"
      # Parity with mcp-gateway: allow BFF TraT simulation header in demo compose.
      ALLOW_UNSIGNED_TRAT_CONTEXT: ${ALLOW_UNSIGNED_TRAT_CONTEXT:-true}
      # Wide-open mode for Privilege MCP Gateway: the gateway itself enforces authz,
      # so the MCP server trusts all callers on the internal hop.
      MCP_AUTH_DISABLED: "${MCP_AUTH_DISABLED:-false}"
      BFF_TRANSACTION_HOP_URL: "https://demo-api-server:3001/internal/transaction-hop"
      # Durable MCP audit sink (feeds /audit). config.ts defaults this to
      # http://localhost:3001/... which, inside this container, is the gateway
      # itself — not the BFF — so every audit POST silently 404'd/refused and
      # the Audit page stayed empty. Point it at the BFF explicitly.
      BFF_INTERNAL_ID_TOKEN_URL: "https://demo-api-server:3001/internal/id-token"
      # mkcert CA so the emitter's HTTPS POST to the BFF can verify its leaf cert.
      # Without it every hop fails UNABLE_TO_VERIFY_LEAF_SIGNATURE and is silently
      # swallowed by the fire-and-forget .catch() -- an invisible, empty chain.
      NODE_EXTRA_CA_CERTS: /certs/ca-bundle-with-mkcert.pem
    env_file:
      - path: ./oauth-mcp/.env
        required: false   # copy oauth-mcp/.env.example if you need overrides
      # dotenvx runtime decrypt key (vault→dotenvx cutover) — see demo-api-server's
      # env_file entry above for the full rationale (env_file not environment:;
      # separate file from what it decrypts). required:false: no-op pre-migration.
      - path: ./.env.keys
        required: false
    volumes:
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      # Gateway client cert for the mTLS pin. certs/ is gitignored; generate via
      # scripts/ensure-gateway-mtls-certs.sh. Read-only, public cert only.
      # Dir mount, not a single file -- a single-file bind pins the inode.
      - ./certs:/certs:ro
    tmpfs:
      - /app/dev-data:uid=1001,gid=1001  # writable for dev-mode session data
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js", "localhost", "8080", "/.well-known/mcp-server"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Privilege MCPGW (Procyon cyonproxy) ──────────────────────────────────────
  mcpgw:
    image: public.ecr.aws/s7q1z8z4/privilege-proxy:latest
    container_name: ai-demo-mcpgw
    ports:
      - "8443:8443"
    environment:
      # Privilege gateway enrollment token (from Privilege console Setup > Gateways)
      ENV_PROXY_TOKEN: "${PRIVILEGE_PROXY_TOKEN:-}"
    volumes:
      - /var/log/procyon:/var/log/procyon
      - /var/lib/procyon/ssl:/procyon/ssl
      - /var/lib/procyon/recordings:/procyon/recordings
    networks:
      - ai-demo
    restart: unless-stopped
    depends_on:
      - mcp-server

  # ── LangChain Agent (Python / uvicorn) ───────────────────────────────────────
  langchain-agent:
    build:
      context: .
      dockerfile: langchain_agent/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-langchain-agent
    command: ./scripts/startup.sh
    ports:
      - "8888:8888"   # AG-UI SSE / FastAPI
      - "8889:8889"   # WebSocket chat
      - "8890:8890"   # health
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      AGUI_HTTP_PORT: "8888"
      WEBSOCKET_PORT: "8889"
      HEALTH_HTTP_PORT: "8890"
      # Servers bind 127.0.0.1 by default; published ports need the container override.
      AGUI_HTTP_HOST: "0.0.0.0"
      CHAT_WS_HOST: "0.0.0.0"
      # CodeGraph Explorer LLM — priority: Anthropic > Groq > local llama
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      LLAMACPP_MODEL: "gpt-oss-20b"
      # GROQ_API_KEY intentionally absent: environment: overrides env_file, so a
      # "${GROQ_API_KEY:-}" entry here blanks the value langchain_agent/.env supplies
      # whenever the shell does not set it. Let env_file own the key.
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      # Code Explorer "Refresh index" reads live source + writes the rebuilt DB
      # under the bind-mounted repo (see volumes below). Pointing both at the live
      # tree means grep/read_file always see current source and a re-index only
      # needs to rerun the indexer — no image rebuild, no repo-src re-stage.
      REPO_SRC_ROOT: "/app/live-repo"
      # Separate from the host CodeGraph product DB at .codegraph/codegraph.db
      # (same bind mount) so Refresh cannot be overwritten by the IDE daemon.
      CODEGRAPH_DB_PATH: "/app/live-repo/.codegraph/demo-codegraph.db"
      # Prefer the live-mounted script over the baked /app/indexer copy so
      # indexer fixes apply without rebuilding the langchain-agent image.
      CODEGRAPH_INDEXER: "/app/live-repo/scripts/build-codegraph.py"
      # Do NOT set CODEGRAPH_INDEX_ALL here — Refresh/startup must stay scoped to
      # demo_api_ui + demo_api_server (full-repo walks are opt-in via --all only).
      # Trust the BFF's mkcert TLS cert on the internal tool callback (httpx
      # honors SSL_CERT_FILE). Combined bundle = system roots + mkcert root CA,
      # so external HTTPS (Anthropic/OpenAI/PingOne) keeps verifying. Generate:
      #   cat /etc/ssl/cert.pem "$(mkcert -CAROOT)/rootCA.pem" > certs/ca-bundle-with-mkcert.pem
      SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./langchain_agent/.env
        required: false   # add LLM provider key (ANTHROPIC_API_KEY / OPENAI_API_KEY)
    volumes:
      # Live repo, read-only — source the agent greps/reads + the indexer scans.
      - ./:/app/live-repo:ro
      # .codegraph overlaid read-write so Refresh can rewrite demo-codegraph.db
      # (directory mount — unlink+recreate is safe; a single-file bind would pin
      # the old inode). Host product CodeGraph may also use this dir for
      # codegraph.db — demo must keep the demo-codegraph.db filename.
      - ./.codegraph:/app/live-repo/.codegraph
      # CA bundle for SSL_CERT_FILE above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── MCP Gateway (TypeScript proxy — routes to mcp-server and mcp-resource-server) ──────
  # Demo Agent Gateway — profile demo-auth. OFF when ff_mcp_gateway_pinggateway uses
  # real PingGateway (IG). Start via `./run-docker.sh demo-sync` after flipping FF.
  mcp-gateway:
    profiles: ["demo-auth"]
    build:
      context: .    # repo root — needs scope-topology.json and sibling openapi files
      dockerfile: demo_mcp_gateway/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-gateway
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      MCP_GW_PORT: "3005"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "mcp-gateway"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      # Scheme and client cert both follow MCP_MTLS_ON (see mcp-server, ~L343):
      # with mTLS on, mcp-server's :8080 is TLS and pins certs/gw-mtls/gw-client.crt,
      # so plain ws:// dies at the handshake — every olb-routed A2A sensitive_*
      # tools/call was a 502 "upstream_unavailable". With it off the listener is
      # plaintext and wss:// fails the same way in reverse, so both must derive
      # from the one switch. Empty cert paths = no client cert offered.
      MCP_GW_OLB_WS_URL: "ws${MCP_MTLS_ON:+s}://mcp-server:8080"
      MCP_GW_UPSTREAM_CLIENT_CERT_PATH: "${MCP_MTLS_ON:+/certs/gw-mtls/gw-client.crt}"
      MCP_GW_UPSTREAM_CLIENT_KEY_PATH: "${MCP_MTLS_ON:+/certs/gw-mtls/gw-client.key}"
      MCP_GW_RESOURCE_SERVER_WS_URL: "ws://mcp-resource-server:8081"
      MCP_GW_JWTVERIFIER_HTTP_URL: "http://mcp-jwt-verifier:8083"
      MCP_JWTVERIFIER_RESOURCE_URI: "mcp-jwt-verifier.ping.demo"
      # Weather/Brave showcase backends — mirrors ping-gateway's PG_WEATHER_BACKEND_URL /
      # PG_BRAVE_BACKEND_URL (~L1100 below). Streamable HTTP, no RFC 8693 exchange
      # (see src/scopePolicies.ts) — the Node gateway forwards the caller's original
      # bearer token unchanged, same as ping-gateway's rsFilter->ReverseProxyHandler chain.
      MCP_WEATHER_BACKEND_URL: "http://mcp-weather:8896"
      MCP_BRAVE_BACKEND_URL: "http://mcp-brave:8897"
      BFF_WEATHER_FLAG_URL: "https://api.ping.demo:3001/internal/feature-flags/weather-mcp-showcase"
      BFF_BRAVE_FLAG_URL: "https://api.ping.demo:3001/internal/feature-flags/brave-mcp-showcase"
      MCP_GW_PASSTHROUGH_TO_MCP_SERVER: "false"
      # Accepted token audiences (comma list, tokenValidator.ts): Node-gateway +
      # PingGateway + the A2A specialists' dedicated Exchange #2 audience. This
      # list was wired onto demo-api-server/authz-server but never onto the
      # gateway itself, whose env_file pinned the single Node audience — so every
      # A2A specialist call 401'd at the gateway with "Audience mismatch".
      # mcpserver.ping.demo (4th entry) is oauth-mcp's OWN audience — a native
      # ID-JAG-redeemed token is always minted for it (TokenIssuer.resolveOwnAudience,
      # oauth-mcp), never for this gateway's own audience, so the Node gateway must
      # accept it directly. tokenValidator.ts's ID-JAG filter verifies these tokens
      # against oauth-mcp's own JWKS (not PingOne's) before this aud check ever runs.
      MCP_GW_RESOURCE_URI: "mcpgateway.ping.demo,https://api.ping.demo:3036/mcp,mcpgateway-a2a.ping.demo,mcpserver.ping.demo"
      PINGAUTHORIZE_ENDPOINT: "http://authz-server:9001"
      # Declare the mock explicitly. Decision provenance (contract C2) and the
      # /health posture block both derive "is this a real PDP?" by comparing the
      # endpoint against this value. With it unset, a deployment pointed at the
      # mock reports policySource 'p1az' — i.e. the audit trail claims cloud
      # PingOne Authorize decided when the mock did. Must equal PINGAUTHORIZE_ENDPOINT
      # whenever that endpoint IS the mock.
      PINGAUTHORIZE_MOCK_BASE: "http://authz-server:9001"
      PINGAUTHORIZE_WORKER_ID: "mcp-gateway"
      MCP_GW_P1AZ_ENABLED: "true"
      # Token validation on this gateway is JWKS, not introspection.
      #
      # RFC 7662 introspection CANNOT work here, and three reverts were spent
      # discovering that. PingOne scopes introspection to the ISSUING client.
      # This gateway serves the A2A path only, and those tokens are minted by
      # FIVE different specialist clients — probed live 2026-07-27, a specialist
      # token introspected by the Token Exchanger (f4dd707d, the gateway's
      # introspection identity) returns active:false, while the specialist
      # introspecting its own returns active:true. So no single
      # GW_INTROSPECTION_CLIENT_ID can ever cover them: pointing this at real
      # PingOne blocks every A2A call at the first filter. It is the wrong
      # mechanism for a multi-issuer resource server, not a permission gap.
      #
      # JWKS verifies anything PingOne signed regardless of issuer. Confirmed
      # active on this path: a forged token is rejected with "no kid header and
      # the JWKS exposes 4 keys" — the gateway really fetched PingOne's keys.
      #
      # Real introspection still runs where it CAN: PingGateway/IG serves the
      # main path, where tokens ARE minted by f4dd707d, and introspects against
      # real PingOne. Both mechanisms are live, each where it works.
      #
      # A skipped introspection audits as filterChain TokenIntrospection=skipped
      # and audit.introspection=null — never "passed". A check that did not run
      # must never read as a check that succeeded.
      GW_INTROSPECTION_ENABLED: "false"
      # This stack has never configured PINGONE_JWKS_ENDPOINT, so the gateway has
      # always run decode-only (no signature verification). That used to be silent;
      # it now requires this explicit opt-in and is reported in the failOpen list of
      # GET /health. Closing it means pointing the gateway at real PingOne JWKS —
      # which needs a live check first, because demo tokens introspect against the
      # mock authz-server and some are minted HS256 locally.
      # false, now that JWKS verification is real.
      #
      # This does not change today's behaviour: the flag is only consulted when
      # NO JWKS endpoint is configured, and one is. What it changes is the
      # FAILURE mode. If JWKS ever stops resolving — key rotation, a network
      # partition, someone renaming the var again — "true" silently degrades the
      # gateway to decode-only and it accepts forged tokens. "false" makes it
      # REFUSE instead. A loud failure beats a silent bypass.
      MCP_GW_ALLOW_UNVERIFIED_TOKENS: "false"
      API_RESOURCE_SERVER_URL: "http://api-resource-server:8082"   # api-key dispatch backend (mortgage + invest routes)
      # Must match api-resource-server API_RESOURCE_SERVER_API_KEY (no committed demo default).
      DEMO_API_RESOURCE_SERVER_KEY: ${API_RESOURCE_SERVER_API_KEY:-mortgage-compose-dev-key}
      # TraT simulation: BFF forwards unsigned X-TraT-Context when PingOne does not
      # embed TraT claims. Opt-in for demo compose; leave unset in production-like envs.
      ALLOW_UNSIGNED_TRAT_CONTEXT: ${ALLOW_UNSIGNED_TRAT_CONTEXT:-true}
      BFF_TRANSACTION_HOP_URL: "https://demo-api-server:3001/internal/transaction-hop"
      # mkcert CA so the emitter's HTTPS POST to the BFF can verify its leaf cert.
      # Without it every hop fails UNABLE_TO_VERIFY_LEAF_SIGNATURE and is silently
      # swallowed by the fire-and-forget .catch() -- an invisible, empty chain.
      NODE_EXTRA_CA_CERTS: /certs/ca-bundle-with-mkcert.pem
    env_file:
      - path: ./demo_mcp_gateway/.env
        required: false
      # dotenvx runtime decrypt key (vault→dotenvx cutover) — see demo-api-server's
      # env_file entry for the full rationale (env_file not environment:; separate
      # file from what it decrypts). required:false: no-op pre-migration.
      - path: ./.env.keys
        required: false
    volumes:
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      - ./certs:/certs:ro  # dir mount, not a single file -- a single-file bind pins the inode
    networks:
      - ai-demo
    depends_on:
      mcp-server:
        condition: service_started
      mcp-resource-server:
        condition: service_started
        required: false   # core service — routes invest when up
      mcp-jwt-verifier:
        condition: service_started
        required: false   # routes jwt_* diagnostic tools when up
      mcp-weather:
        condition: service_started
        required: false   # routes get_weather when up
      mcp-brave:
        condition: service_started
        required: false   # routes brave_news_search when up
      authz-server:
        condition: service_started
        required: false   # demo-auth profile — co-starts with mcp-gateway via demo-sync
    restart: unless-stopped

  # ── Agent Service (TypeScript — LangGraph / Helix routing) ───────────────────
  agent-service:
    build:
      context: ./demo_agent_service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-agent-service
    ports:
      - "3016:3006"   # 3006 is reserved by OrbStack on macOS; internal port is still 3006
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"    # override loopback default (REGRESSION_PLAN §3) for container networking
      AGENT_SERVICE_PORT: "3006"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "agent-service"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_GATEWAY_URL: "http://mcp-gateway:3005"
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      # Agent reasoning + native tool calls → strongest tier. The proxy treats
      # this as a minimum capability class (per-agent routing, swap mode).
      LLAMACPP_MODEL: "gpt-oss-20b"
      MLX_LM_BASE_URL: "http://host.docker.internal:8098"
      BFF_TRANSACTION_HOP_URL: "https://demo-api-server:3001/internal/transaction-hop"
      # mkcert CA so the emitter's HTTPS POST to the BFF can verify its leaf cert.
      # Without it every hop fails UNABLE_TO_VERIFY_LEAF_SIGNATURE and is silently
      # swallowed by the fire-and-forget .catch() -- an invisible, empty chain.
      NODE_EXTRA_CA_CERTS: /certs/ca-bundle-with-mkcert.pem
    env_file:
      - path: ./demo_agent_service/.env
        required: false
      # dotenvx runtime decrypt key (vault→dotenvx cutover) — see demo-api-server's
      # env_file entry for the full rationale (env_file not environment:; separate
      # file from what it decrypts). required:false: no-op pre-migration.
      - path: ./.env.keys
        required: false
    volumes:
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      - ./certs:/certs:ro  # dir mount, not a single file -- a single-file bind pins the inode
    networks:
      - ai-demo
    depends_on:
      demo-api-server:
        condition: service_started
      mcp-gateway:
        condition: service_started
        required: false   # demo-auth profile — agent-service uses BFF; demo GW optional
    restart: unless-stopped

  # ── HITL Service (plain JS — human-in-the-loop consent) ─────────────────────
  hitl-service:
