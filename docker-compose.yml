  # ── MCP Proxy (HTTP-to-MCP sidecar — exposes MCP tools as plain REST) ──────────
  # Stateless agents (OpenAI Agents, Pydantic AI, Mastra) can call MCP tools via
  # simple HTTP (GET /tools, POST /tools/:name) without implementing MCP protocol.
  # Auth: callers pass Bearer token; proxy forwards it to the MCP gateway unchanged.
  mcp-proxy:
    build:
      context: ./demo_mcp_proxy
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-proxy
    ports:
      - "8895:8895"
    environment:
      PORT: "8895"
      # Topology SoT default (mcp-gateway:3005). run-docker.sh demo-sync recreates this
      # service with ping-gateway:8080 when Quick Flags select the real PingGateway stack.
      MCP_GATEWAY_HTTP_URL: "http://mcp-gateway:3005"
    networks:
      - ai-demo
    depends_on:
      ping-gateway:
        condition: service_started
    restart: unless-stopped

  # ── PingGateway (Ping Identity IG) — alternative MCP gateway ─────────────────
  # Selected at runtime by the BFF feature flag ff_mcp_gateway_pinggateway (the BFF
  # reaches it at http://ping-gateway:8080). PingGateway introspects the inbound
  # token, mirrors the Node PingOneAuthorizeClient decision (live-switchable mock
  # authz-server vs real PingOne Authorize via the X-Authz-Simulated header the BFF
  # stamps), and performs an IG-native RFC 8693 exchange to the backend MCP servers.
  # Host port is 3036 (NOT 3006 — OrbStack reserves host 3006 on macOS, same reason
  # agent-service maps 3016:3006); 3036 is only for host-side curl/testing.
  # Run the whole stack with COMPOSE_PROJECT_NAME=ai-demo so service DNS resolves.
  ping-gateway:
    image: us-docker.pkg.dev/forgeops-public/images-base/ig:latest
    container_name: ai-demo-ping-gateway
    # OrbStack preserves the container writable layer across daemon restarts, so
    # tmp/ig.pid survives an unclean stop even without a named volume. Delete it
    # before handing off to the real startup script.
    # keytool -cacerts (the stock approach) fails here: the image runs as a fixed
    # non-root uid (forgerock) with no privilege drop, and $JAVA_HOME/lib/security/
    # cacerts is root:root 0644 (not group-writable) — confirmed live via
    # `docker exec ai-demo-ping-gateway id -u` (11111) and `ls -l cacerts`.
    # Fallback: copy the JDK cacerts (keeps trust for real auth.pingone.com /
    # api.pingone.com calls IG also makes) into the writable /var/gateway instance
    # dir, then import the mkcert root into that copy; JAVA_OPTS below points the
    # JVM at it. Idempotent via `|| true` (mkcert-root re-import on restart no-ops).
    # `$$JAVA_HOME` (not `$JAVA_HOME`): Compose interpolates single-`$` vars from
    # the HOST env at `docker compose config` time (confirmed live — an unset host
    # JAVA_HOME silently rendered as an empty string). `$$` escapes to a literal
    # `$`, deferring expansion to the container's own shell/JAVA_HOME at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp "$$JAVA_HOME/lib/security/cacerts" /var/gateway/mkcert-truststore.jks 2>/dev/null || true;
        keytool -importcert -noprompt -alias mkcert-root -keystore /var/gateway/mkcert-truststore.jks -storepass changeit
        -file /certs/mkcert-rootCA.pem 2>/dev/null || true;
        rm -f /var/gateway/tmp/ig.pid && exec /opt/gateway/bin/start.sh /var/gateway
    ports:
      # HTTPS, not HTTP. PG_GATEWAY_RESOURCE_ID is https://api.ping.demo:3036/mcp
      # and IG's McpProtectionFilter derives its RFC 9728 resource_metadata URL
      # from that value — so a client following the WWW-Authenticate challenge
      # fetches https://api.ping.demo:3036/.well-known/... . With 3036 mapped to
      # IG's plaintext 8080 that fetch died in the TLS handshake and the
      # discovery half of the MCP dance was unreachable from anywhere, host or
      # container. The resource id cannot move (p1az-decision.groovy checks it as
      # `aud`), so the listener moves instead: 8443 is IG's TLS connector, see
      # ping-gateway/config/admin.json. In-stack callers are unaffected — they
      # use ping-gateway:8080, which stays plaintext.
      - "3036:8443"
    volumes:
      # /var/gateway is IG's instance dir: it must be writable + EPHEMERAL. The Docker
      # container layer (writable by default) is the Compose equivalent of the k8s
      # emptyDir the PingGateway docs require. Do NOT use a named volume here — a
      # persisted /var/gateway keeps a stale tmp/ig.pid after an unclean stop, and IG
      # then refuses to start ("PID file already exists. Cannot start") on every recreate.
      #
      # Mount config + groovy as DIRECTORIES, not individual files. IG's RouterHandler
      # watches the routes dir every ~10s; with per-file bind mounts the watcher
      # mis-detects changes and UNLOADS the routes at runtime (then /mcp 404s). A stable
      # read-only directory mount has consistent mtimes, so routes load once and stay.
      # NEVER re-add a nested per-file mount of mcp-tool-schemas.json here. macOS
      # VirtioFS resolves a single-file bind mount to the host INODE, and git replaces
      # files by rename — so any pull touching that artifact left the container with a
      # dangling mount ("-????????? mcp-tool-schemas.json") and every /mcp POST 500'd
      # until a container recreate. Twice: 2026-07-17 and 2026-08-03 (REGRESSION_PLAN §4).
      # ping-gateway/config/mcp-tool-schemas.json is now a real generated copy inside
      # this directory mount (npm run gen:tool-schemas writes both, drift-tested), which
      # resolves by NAME on every open and therefore survives replacement.
      - ./ping-gateway/config:/var/gateway/config:ro
      - ./ping-gateway/scripts/groovy:/var/gateway/scripts/groovy:ro
      - ./certs:/certs:ro   # mkcert CA imported into the JVM truststore at start (IG→BFF TLS)
    environment:
      # In-stack overrides (env block wins over env_file): reach backends + the mock
      # authz server by compose service DNS, not host.docker.internal.
      # https when mTLS is on (mcp-server serves TLS on the SAME port); http otherwise.
      # Scheme derives from MCP_MTLS_ON (see mcp-server, ~L343) so it can never drift
      # from the listener: a TLS dial into the plaintext listener fails with
      # "Unsupported or unrecognized SSL message" and the tool call never runs.
      PG_OLB_BACKEND_URL: "${PG_OLB_BACKEND_URL:-http${MCP_MTLS_ON:+s}://mcp-server:8080}"
      # Client cert IG presents to the MCP server. certs/ is already mounted at
      # /certs on this service. Empty => plaintext, unchanged behaviour.
      PG_MTLS_KEYSTORE_PATH: "${PG_MTLS_KEYSTORE_PATH:-${MCP_MTLS_ON:+/certs/gw-mtls/gw-client.p12}}"
      PG_MTLS_KEYSTORE_PASSWORD: "${PG_MTLS_KEYSTORE_PASSWORD:-changeit}"
      PG_INVEST_BACKEND_URL: "http://mcp-resource-server:8081"
      PG_WEATHER_BACKEND_URL: "http://mcp-weather:8896"
      PG_BRAVE_BACKEND_URL: "http://mcp-brave:8897"
      # Unlocks certs/pg-tls/pg-server.p12 for the 8443 TLS connector. IG's
      # SystemAndEnvSecretStore resolves the secret id pg.tls.keystore.password
      # to this variable (dots -> underscores, uppercased). Must match the
      # password scripts/ensure-pinggateway-tls-cert.sh exported the p12 with —
      # dev-only material for a gitignored local keystore.
      PG_TLS_KEYSTORE_PASSWORD: "${PG_TLS_KEYSTORE_PASSWORD:-changeit}"
      PG_INBOUND_SCOPE: "gateway:mcp:invoke"
      # apikey-disposition tools (show_mortgage, show_gear_order, ...) validate
      # against a separate scope on the /mcp/apikey route's own PingOne resource
      # (PINGONE_RESOURCE_MCP_APIKEY_URI) — see 00-mcp-apikey.json and
      # agentMcpTokenService.js _performTwoExchangeDelegation.
      PG_APIKEY_INBOUND_SCOPE: "apikey:mcp:invoke"
      P1AZ_MOCK_BASE: "http://authz-server:9001"
      # HITL_SERVICE_URL / HITL_INTERNAL_SECRET are supplied by env_file
      # (ping-gateway/.env, written by refresh-service-envs.js) — NOT here.
      # environment: overrides env_file, so pinning them here would blank the
      # real secret on any machine whose shell does not export it, and the HITL
      # verify call would 401 into a permanent 503. Same rule as
      # BFF_INTERNAL_SECRET and INTENT_TOKEN_SECRET above.
      # P1AZ_WORKER_ID comes from ./ping-gateway/.env (real decision endpoint id).
      # Do NOT pin it here — the env block wins over env_file, and a placeholder
      # pin silently overrides the real id (the mock only uses it as a path param,
      # so the real value works for both backends).
      PG_API_RESOURCE_SERVER_URL: "http://api-resource-server:8082"
      BFF_VAULT_KEY_URL: "https://api.ping.demo:3001/internal/vault/service-key"
      BFF_WEATHER_FLAG_URL: "https://api.ping.demo:3001/internal/feature-flags/weather-mcp-showcase"
      BFF_BRAVE_FLAG_URL: "https://api.ping.demo:3001/internal/feature-flags/brave-mcp-showcase"
      # Transaction-ledger hop ingest (transaction-hop.groovy). Without this the
      # gateway leg of /transaction-trace is structurally absent: the Node
      # gateway's instrumentation is bypassed whenever MCP traffic routes
      # through PingGateway, which is the default path.
      BFF_TRANSACTION_HOP_URL: "https://api.ping.demo:3001/internal/transaction-hop"
      # BFF_INTERNAL_SECRET comes from env_file (ping-gateway/.env, written by
      # refresh-service-envs.js) so it matches the BFF's real value — do NOT set
      # it here (environment: would override env_file with a wrong/default value).
      #
      # INTENT_TOKEN_SECRET: SAME RULE, and the reason intent verification was dead
      # on this path. p1az-decision.groovy reads INTENT_TOKEN_SECRET (falling back to
      # SESSION_SECRET); with neither present the verifier short-circuits and omits
      # IntentTokenValid / IntentMatchesTool, so ~190 lines of correct HMAC checking
      # never ran. It arrives via env_file from refresh-service-envs.js, which must
      # write the BFF's EFFECTIVE signing key (intentTokenService.js:8 signs with
      # INTENT_TOKEN_SECRET || SESSION_SECRET — writing only the former leaves the
      # gateway verifying with a different key than the BFF signed with, which is a
      # silent invalid_signature on every request). Do NOT pin it here: a
      # `${INTENT_TOKEN_SECRET:-}` default would resolve to empty on a host without
      # the var and override env_file, re-killing the verifier.
      #
      # TraT parity (Path A / Path B must agree). mcp-server and mcp-gateway both
      # default this true; ping-gateway set it nowhere, so it was effectively false
      # here and the SAME request had its RAR / purp / cnf evidence forwarded to the
      # PDP through the Node gateway and silently dropped through PingGateway — while
      # PingGateway is the DEFAULT path (ff_mcp_gateway_pinggateway). Chose `true` to
      # match the other two rather than flipping them to false: the BFF's TraT context
      # is simulated for the demo, so false would strip RAR/purp/cnf from the decision
      # everywhere and leave the F4 finding unfixed on both paths. Same variable name
      # across all three services, so one host-level override moves them together.
      ALLOW_UNSIGNED_TRAT_CONTEXT: ${ALLOW_UNSIGNED_TRAT_CONTEXT:-true}
      # Fallback truststore (see entrypoint comment above): -cacerts isn't writable
      # by the fixed non-root image user, so the mkcert root is imported into a
      # copy of cacerts under /var/gateway instead, and the JVM is pointed at it.
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/var/gateway/mkcert-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
    env_file:
      # Secrets + PingOne endpoints + resource ids (gitignored; .env.example is SoT).
      - path: ./ping-gateway/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      mcp-server:
        condition: service_started
      mcp-resource-server:
        condition: service_started
      mcp-weather:
        condition: service_started
      mcp-brave:
        condition: service_started
      api-resource-server:
        condition: service_started
      authz-server:
        condition: service_started
        required: false   # demo-auth profile — mock Authorize when ff_authorize_real is OFF
    restart: unless-stopped

  # ── PingOne Privilege MCPGW (commercial) ───────────────────────────────────
  # PingOne Privilege proxy: just-in-time least-privilege plus full session
  # recording. Policy is authored in the PingOne Privilege console, NOT in this
  # repo. ENV_PROXY_TOKEN comes from the gateway wizard; store it in
  # ping-mcpgw/procyon/config/proxy-token.env (gitignored).
  ping-mcpgw:
    profiles: ["mcpgw"]
    # BINARY SWAP 2026-08-12, from privilege-proxy/cyonproxy to
    # privilege-mcpgw/mcpgw. Reason: cyonproxy never emits a WWW-Authenticate
    # challenge on a tokenless request (verified by grep -a over the binary —
    # zero occurrences of authorization_uri / MCP OAuth Server /
    # oauth-protected-resource). mcpgw's binary contains every one of those
    # strings, and a live probe of another engineer's cluster running this same
    # image confirmed it emits the challenge for real:
    #   401, www-authenticate: Bearer realm="MCP OAuth Server", authorization_uri="..."
    # ValidateInfraJwt (the kid-vs-infra-root-jwt wall) is present in this binary
    # too, so this is NOT confirmed to unblock PingOne-issued client tokens —
    # only the discovery/challenge layer is proven. See privilege/PRIVILEGE-MCP.md
    # and the skill's "The PingOne token wall" section.
    #
    # Pinned by digest (multi-arch manifest list, works on both Apple Silicon and
    # amd64) rather than a tag — no public tag-listing access to confirm a stable
    # version tag exists, and this is the exact build verified above. Bump by
    # re-pulling :latest and updating the digest when re-verifying.
    image: public.ecr.aws/s7q1z8z4/privilege-mcpgw@sha256:0faad5903a5bd72539b1df525e3c7bc5d458a5bd324aac9755b8af99dfa6647d
    pull_policy: always
    container_name: ai-demo-ping-mcpgw
    # AGENTLESS (self-hosted frontend) MODE — see privilege/PRIVILEGE-MCP.md.
    #
    # There are two Privilege topologies and they behave completely differently:
    #
    #   mesh / cloud frontend  the console assigns each MCP Server application an
    #                          *.applications.privilege.pingone.com FQDN, requests
    #                          land in Ping's cloud and are routed back over the
    #                          outbound gRPC stream. Nothing binds locally. Privilege
    #                          validates the client's PingOne JWT itself — which is
    #                          the "IssuerPublicKey:[]" / "JWT signature validation
    #                          failed" wall this demo hit for weeks.
    #
    #   agentless / self-hosted frontend  (this config) the console's Frontend Name
    #                          is OUR domain, the proxy binds locally, and the
    #                          gateway runs the OIDC dance itself against the
    #                          endpoints in ping-mcpgw/procyon/config/pingone.env.
    #
    # -mcpconfpath is REQUIRED on this binary (fatal "MCP Config path not
    # specified" without it) — unlike cyonproxy, which only ever read pingone.env
    # via env_file-injected environment variables and never touched the file
    # itself. Confirmed by running --help and a scratch container.
    command: /procyon/bin/mcpgw -hostname local.ping-devops.com -mcpconfpath /var/lib/procyon/config/pingone.env
    # pingone.env is an ENV FILE — load its contents as environment variables, AND
    # (per the command above) mcpgw reads the file directly via -mcpconfpath.
    #
    # required: false on both so the profile still starts on a checkout that has not
    # created them yet (both gitignored — copy pingone.env.example for the first).
    # Unlike under cyonproxy, a genuinely missing pingone.env is no longer a soft
    # degradation here — mcpgw reads -mcpconfpath eagerly at startup and exits
    # fatally if the path doesn't resolve.
    #
    # NO `environment:` block here. It used to carry
    # ENV_PROXY_TOKEN: "${PRIVILEGE_PROXY_TOKEN:-}", which the compose-env-shadow
    # hygiene gate correctly rejects once env_file is in play: `environment:` wins
    # over env_file unconditionally, so on any checkout where the shell or root .env
    # does not set PRIVILEGE_PROXY_TOKEN it would blank the token to "".
    #
    # The enrollment token travels in its own env file, ENV_PROXY_TOKEN=eyJ...:
    #
    #   printf 'ENV_PROXY_TOKEN=%s\n' 'eyJ...' > ping-mcpgw/procyon/config/proxy-token.env
    #
    # Only needed for FIRST boot or re-enrollment. After that the proxy authenticates
    # to the control plane with the mTLS cert pair in /procyon/ssl (proxy-crt.pem,
    # proxy-key.pem, proxy-ca.pem) and ignores this entirely — which is why an
    # enrollment token that expired days ago still starts the container fine.
    env_file:
      - path: ./ping-mcpgw/procyon/config/pingone.env
        required: false
      - path: ./ping-mcpgw/procyon/config/proxy-token.env
        required: false
    ports:
      - "8620:8620"
      - "8690:8690"
      # -mcpgw's own listener (default :8623) — the port that actually answers MCP
      # requests and emits the OAuth challenge on this binary. mcpgw-nginx targets
      # this port; the published host port is for direct-probe troubleshooting only
      # (curl -i https://localhost:8623/mcp).
      - "8623:8623"
    volumes:
      # NO single-file bind of the enrollment token here. The proxy REWRITES
      # /procyon/ssl/proxy-token.data at startup (the SAME token, rewritten — it is
      # not swapped for a long-lived one), so a :ro bind made it exit 1 on every
      # boot — "ProxyToken write to /procyon/ssl/proxy-token.data failed …
      # read-only file system" — and a :rw single-file bind breaks the same way
      # as soon as the proxy replaces rather than truncates the file.
      # The token arrives via ENV_PROXY_TOKEN (above) and the proxy persists its
      # exchanged copy into this writable volume, which is what the vendor's own
      # `docker run` does with -v /var/lib/procyon/ssl:/procyon/ssl.
      - mcpgw-ssl:/procyon/ssl
      - mcpgw-logs:/var/log/procyon
      - mcpgw-recordings:/procyon/recordings
      # The WHOLE /var/lib/procyon tree, same path on both sides. This mirrors the
      # vendor's own run command, which is embedded verbatim in the cyctl binary:
      #
      #   --net=host --name procyon-proxy \
      #     -v /var/log/procyon:/var/log/procyon \
      #     -v /var/lib/procyon/ssl:/procyon/ssl \
      #     -v /var/lib/procyon/recordings:/procyon/recordings \
      #     -v /var/lib/procyon:/var/lib/procyon \        <- this one
      #     -v /etc/ssh/sshd_config:/etc/ssh/sshd_config
      #
      # We previously bound only the config subdirectory, which put pingone.env at
      # the right path but hid every sibling the proxy might expect next to it.
      # Note the console's "Get Docker Command" output omits this mount entirely —
      # a proxy enrolled straight from that command has no /var/lib/procyon at all.
      #
      # Directory mount, never single files: a single-file bind goes stale when the
      # host file is replaced (git checkout, editor save-by-rename give it a new
      # inode) and then vanishes inside the container.
      - ./ping-mcpgw/procyon:/var/lib/procyon
    networks:
      ai-demo:
        aliases:
          - local.ping-devops.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── MCPGW front door (nginx) ───────────────────────────────────────────────
  # The "nginx engine" from the Privilege SE storyboard: customer-owned DNS and
  # TLS in front of the gateway runtime, so the frontend URL a client calls is a
  # domain we control rather than a Ping-assigned cloud FQDN.
  #
  #   https://aidemo.mcpgw.local.ping-devops.com/mcp  ->  nginx :443
  #                                                    ->  ping-mcpgw :8623
  #                                                    ->  mcp-server :8080
  #
  # Requires /etc/hosts entries — a wildcard cert works, but /etc/hosts has no
  # wildcard, so add one 127.0.0.1 line per frontend host (see
  # privilege/runbooks/mcpgw-nginx.md).
  #
  # The wildcard cert pair is NOT the core stack's api.ping.demo+2 pair; it is
  # generated separately by scripts/ensure-mcpgw-certs.sh into the same certs/
  # directory (gitignored).
  mcpgw-nginx:
    profiles: ["mcpgw"]
    image: nginx:alpine
    container_name: ai-demo-mcpgw-nginx
    ports:
      # Host 443 so the frontend URLs registered in the Privilege console carry
      # no port, matching the vendor's own SE material. If something else on the
      # host claims 443, change this to 8643:443 and append :8643 to every
      # Frontend Name in the console and to PRIVILEGE_MCPGW_URL.
      - "443:443"
    volumes:
      - ./demo_mcpgw_nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      ping-mcpgw:
        condition: service_started
    networks:
      ai-demo:
        # In-container DNS aliases for the per-app frontend hosts, so the BFF
        # (ai-demo-api-server) reaches the gateway front door by the same
        # hostname a browser uses. Without the app-named entries the BFF cannot
        # resolve them (those names live only in the host's /etc/hosts), and the
        # Privilege client's gateway path is dead from inside Docker. The
        # wildcard cert already covers every name here.
        aliases:
          - mcpgw.local.ping-devops.com
          - aidemo.mcpgw.local.ping-devops.com
          - MCP-aidemo.mcpgw.local.ping-devops.com
          - mcp-pingone-admin.mcpgw.local.ping-devops.com
    restart: unless-stopped

  # OpenSearch + its MCP server — sample backend for the Privilege MCP gateway.
  # Not this app's own MCP servers; useful only when testing against an
  # OpenSearch-backed MCP application registered in the Privilege console
  # (app name: cmuir-opensearch, backend: http://opensearch-mcp-server:9900/mcp).
  opensearch:
    profiles: ["mcpgw"]
    image: opensearchproject/opensearch:2
    container_name: ai-demo-opensearch
    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ai-demo
    restart: unless-stopped

  opensearch-mcp-server:
    profiles: ["mcpgw"]
    image: cjmuir710/opensearch-mcp-server:latest
    container_name: ai-demo-opensearch-mcp-server
    command: ["--transport", "stream", "--host", "0.0.0.0", "--port", "9900"]
    environment:
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_NO_AUTH: "true"
    ports:
      - "9900:9900"
    depends_on:
      opensearch:
        condition: service_started
    networks:
      - ai-demo
    restart: unless-stopped

  # ── RAG Code Search Services ──────────────────────────────────────────────
  weaviate:
    profiles: ["rag"]
    image: semitechnologies/weaviate:latest
    container_name: ai-demo-weaviate
    # No host port publish — consumed only container-to-container as
    # http://weaviate:8080 (compose DNS). Publishing host :8080 collides with
    # mcp-server, which owns host :8080.
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_APIKEY_ENABLED: "false"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Bring-your-own vectors: the code-search service supplies embeddings,
      # so Weaviate needs no vectorizer module of its own.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      # Stable raft node identity. Without this, Weaviate derives the raft node ID
      # from the random container hostname; on a container recreate the persisted
      # weaviate-data volume then references a dead node and no leader is ever
      # elected — every schema/index op 500s ("leader not found") while the
      # raft-free /v1/meta healthcheck still passes, so it looks healthy.
      # NOTE: first applying/changing this needs a one-time `weaviate-data` volume
      # wipe + reindex to align the persisted node ID with CLUSTER_HOSTNAME.
      CLUSTER_HOSTNAME: weaviate
      RAFT_BOOTSTRAP_EXPECT: "1"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - ai-demo
    healthcheck:
      # weaviate image ships wget, not curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Embedding model server — llama.cpp in --embedding mode (NOT Ollama).
  # Serves the OpenAI-compatible /v1/embeddings endpoint. The GGUF model
  # (~140MB) downloads once via -hf and is cached in the embed-models volume.
  embeddings:
    profiles: ["rag"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-demo-embeddings
    ports:
      - "8084:8080"
    # Memory-tuned for Code Search: single slot, ctx/batch pinned to the
    # model's TRAINED context (nomic-embed v1.5 = 2048 tokens — llama.cpp
    # clamps -c to it anyway). Embeddings are non-causal, so any input longer
    # than the physical batch OR the context is rejected outright ("input (N
    # tokens) is too large to process" / "larger than the max context size"),
    # which 500'd the whole index batch. -b/-ub must equal -c, and the
    # code-search embedder truncates chunks to fit (embeddings.ts
    # MAX_EMBED_CHARS).
    command: >
      --host 0.0.0.0 --port 8080
      --embedding --pooling mean
      -c 2048 -b 2048 -ub 2048 --parallel 1
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0
    volumes:
      - embed-models:/root/.cache/llama.cpp
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  demo-mcp-code-search:
    profiles: ["rag"]
    build:
      context: ./demo_mcp_code_search
      dockerfile: Dockerfile
    image: ai-demo-mcp-code-search:latest
    container_name: ai-demo-mcp-code-search
    ports:
      - "8095:8095"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LOG_LEVEL: info
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      # service_started (not _healthy): this service's own /health stays green
      # while the embedder warms up; index/search return 503 until it's ready.
      embeddings:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8095/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  llamaindex-agent:
    profiles: ["rag"]
    build:
      context: ./llamaindex_agent
      dockerfile: Dockerfile
    image: ai-demo-llamaindex-agent:latest
    container_name: ai-demo-llamaindex-agent
    ports:
      - "8894:8894"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LLAMACPP_BASE_URL: http://host.docker.internal:8090
      AGENT_MODE: single-shot
      AGENT_MAX_TOOL_CALLS: "4"
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      embeddings:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8894/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── LLM Proxy (Node.js smart router) ──────────────────────────────────────
  # Serves the :8090 endpoint that BFF + agent-service already target via
  # LLAMACPP_BASE_URL. Classifies each request and routes to one of 2 local
  # llama-server tiers (small :8091 / big :8096), swapping on demand.
  # Start the model backends first: bash demo_llm_proxy/start-local-models.sh
  llm-proxy:
    build:
      context: ./demo_llm_proxy
      dockerfile: Dockerfile
    image: ai-demo-llm-proxy:latest
    container_name: ai-demo-llm-proxy
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: production
      LLM_PROXY_PORT: "8090"
      # Keep-warm: 0 disables idle decay so a loaded tier stays loaded.
      # Restore classic swap decay with LLM_PROXY_IDLE_DECAY_MS=300000.
      # Optional pin: LLM_PROXY_PIN_TIER=8096
      LLM_PROXY_IDLE_DECAY_MS: "${LLM_PROXY_IDLE_DECAY_MS:-0}"
      LLM_PROXY_PIN_TIER: "${LLM_PROXY_PIN_TIER:-}"
      # Keep BOTH tiers loaded on hosts with enough RAM (≥32GB via residencyPolicy).
      # Costs ~14GB resident. Empty string = classic swap / pin-phi (24GB strategy).
      # Use ${VAR-default} (not :-) so an explicit empty from run-docker.sh is honored.
      LLM_PROXY_RESIDENT_TIERS: "${LLM_PROXY_RESIDENT_TIERS-8091,8096}"
      # PostHog LLM Analytics ($ai_generation). Optional — proxy no-ops when unset.
      POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://us.i.posthog.com}"
    networks:
      - ai-demo
    # Access host llama-server instances via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # K8-only tier swap manager (built for in-cluster llm stack; never starts in compose).
  tier-manager-k8:
    profiles: ["k8-build"]
    build:
      context: ./demo_llm_proxy
      dockerfile: Dockerfile.tier-manager
    image: ai-demo-tier-manager:latest

  # ── Ungoverned Agent (demo prop — DOES NOT auto-start) ───────────────────────
  # A headless browser that rides a logged-in bank session and moves money via
  # the UI — the containerized analog of an agent driving your logged-in Chrome
  # (e.g. OpenCLI). No agent identity / scope / consent / audit: the demo records
  # it as a plain user session. Gated behind the "demo-attack" profile so it is
  # only run on demand:  docker compose run --rm ungoverned-agent
  ungoverned-agent:
    build:
      context: ./demo_ungoverned_agent
      dockerfile: Dockerfile
    container_name: ai-demo-ungoverned-agent
    profiles: ["demo-attack"]
    environment:
      UI_URL: ${UNGOV_UI_URL:-https://ui:4000}
      # Supply ONE of these from a signed-in customer (see the runbook). The bank
      # APIs require a real PingOne customer session — a local login is not enough.
      SESSION_COOKIE: ${UNGOV_SESSION_COOKIE:-}
      ACCESS_TOKEN: ${UNGOV_ACCESS_TOKEN:-}
      ALLOW_LOCAL_LOGIN: ${UNGOV_ALLOW_LOCAL_LOGIN:-false}
      DEMO_USER: ${UNGOV_DEMO_USER:-john.doe}
      DEMO_PASS: ${UNGOV_DEMO_PASS:-${SEED_CUSTOMER_PASSWORD:-password123}}
      AMOUNT: ${UNGOV_AMOUNT:-50}
      DESCRIPTION: ${UNGOV_DESCRIPTION:-Ungoverned agent transfer}
    networks:
      - ai-demo
    restart: "no"

  # ── promptfoo step narration (core — always on, idle until eval) ───────────
  # Sidecar with promptfoo installed. Does not auto-run the eval on start.
  #   ./run-docker.sh promptfoo
  # Targets host :8090 (llm-proxy publish or host oMLX/mlx) via host.docker.internal.
  promptfoo-step-narration:
    build:
      context: ./demo_api_server/promptfoo
      dockerfile: Dockerfile
    image: ai-demo-promptfoo:latest
    container_name: ai-demo-promptfoo-step-narration
    environment:
      OPENAI_API_KEY: not-needed
      OPENAI_API_BASE_URL: http://host.docker.internal:8090/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-demo
    restart: unless-stopped

networks:
  ai-demo:
    driver: bridge

volumes:
  # BFF persistent LMDB store — survives `docker compose up --force-recreate`.
  ai-demo-bff-data:
  # RAG Code Search volumes
  weaviate-data:
  embed-models:
  # Privilege proxy ephemeral data
  mcpgw-ssl:
  mcpgw-logs:
  mcpgw-recordings:
  opensearch-data:
