      # Agent LLM → host llama.cpp proxy (:8090, OpenAI-compatible). Containers
      # reach the host proxy via host.docker.internal (same as LLAMACPP_BASE_URL).
      AGENT_LLM_BASE_URL: "http://host.docker.internal:8090/v1"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (httpx honors
      # SSL_CERT_FILE). Without it, every tool call to https://api.ping.demo fails
      # with CERTIFICATE_VERIFY_FAILED. Same bundle as the langchain agent.
      SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
