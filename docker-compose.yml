# AI Demo — local Docker Compose
#
# Starts: BFF (3001 HTTPS), UI/nginx (4000 HTTPS), MCP server (8080), LangChain agent (8888/8889/8890)
#
# Prerequisites:
#   1. Run bootstrap first: cd demo_api_server && npm run pingone:bootstrap
#      Bootstrap writes demo_api_server/.env AND generates certs/ at the repo root.
#   2. Bootstrap automatically registers Redirect URIs for all deployment targets
#      (local dev, SE DevOps cluster, and PUBLIC_APP_URL) in both PingOne apps.
#      No manual URI registration needed unless you use a custom hostname.
#   3. Add to /etc/hosts if not already there:
#        127.0.0.1  api.ping.demo
#   4. Optionally copy langchain_agent/.env.example → langchain_agent/.env for LLM key.
#
# Usage:
#   docker compose up --build          # first run (or after code changes)
#   docker compose up                  # subsequent runs (no rebuild)
#   docker compose down                # stop and remove containers
#   docker compose restart <service>   # restart one service
#
# Logs (terminal):
#   docker compose logs -f                          # all services interleaved
#   docker compose logs -f banking-api-server       # BFF
#   docker compose logs -f langchain-agent          # AI agent
#   docker compose logs -f mcp-gateway              # MCP gateway
#   docker compose logs -f mcp-server               # MCP tools
#   docker compose logs -f frontend                 # UI (nginx)
#   docker compose logs -f --tail=100 <service>     # last 100 lines + follow
#
# Logs (Docker Desktop UI):
#   1. Open Docker Desktop
#   2. Click "Containers" in the left sidebar
#   3. Click the "ai-demo" stack to expand it
#   4. Click any container name (e.g. ai-demo-api-server) to open its log view
#   5. Use the search box to filter log lines
#   6. Click the download icon to save logs to a file

services:

  # ── BFF (Express — HTTPS via mounted mkcert certs) ─────────────────────────
  demo-api-server:
    build:
      context: .    # repo root — BFF references scope-topology.json and docs/ from ../../
      dockerfile: demo_api_server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-api-server
    ports:
      - "3001:3001"
    env_file:
      - path: ./demo_api_server/.env
        required: true   # generated by bootstrap (npm run pingone:bootstrap in demo_api_server/)
    environment:
      NODE_ENV: development
      # Don't wipe persisted sessions on every restart/recreate — otherwise each
      # api-server boot logs out all users (server.js defaults this ON when unset),
      # so a redeploy silently blanks logged-in pages like /themes until re-auth.
      CLEAR_SESSIONS_ON_BOOT: "false"
      # TLS cert paths — BFF auto-detects these and serves HTTPS when they exist
      SSL_CRT_FILE: "/certs/api.ping.demo+2.pem"
      SSL_KEY_FILE:  "/certs/api.ping.demo+2-key.pem"
      # Container-to-container MCP (plain HTTP — internal network only)
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Route BFF tool calls through the gateway (mcp-gateway:3005), not straight
      # to the MCP server; passthrough=false so the gateway does the 2nd RFC 8693
      # exchange (no skipping). Mirrors service-topology.json — run
      # `node scripts/gen-service-topology.js check` to verify no drift.
      MCP_GATEWAY_HTTP_URL: "http://mcp-gateway:3005"
      # RAG code-search service (Weaviate + embeddings). Must be the compose DNS
      # name — routes/codeSearch.js defaults to localhost:8095, which inside this
      # container is the BFF itself, so the /code-search UI page fails without it.
      MCP_CODE_SEARCH_URL: "http://demo-mcp-code-search:8095"
      # PingGateway (IG) gateway — the DEFAULT MCP enforcement point (real PingOne
      # token end-to-end). Env is synced into the store at every boot (FF_ENV_MAP),
      # so this value wins over persisted toggles; flip here to change the default.
      # Internal service DNS (OrbStack reserves host 3006; PingGateway's host port is 3036).
      MCP_PINGGATEWAY_URL: "http://ping-gateway:8080"
      FF_MCP_GATEWAY_PINGGATEWAY: "true"
      # Authz defaults for the demo. configStore seeds these into LMDB only when
      # no value is persisted yet, and persisted /config overrides still win — so
      # these just make a FRESH bff-data volume come up with this engine. See
      # memory reference_full_rebuild_wipes_authz_config.
      #
      # AUTHORIZE ENGINE (default = real PingOne Authorize ONLY, 2026-06-20):
      # ff_authorize_simulated is the SINGLE flip flag. Default "false" + failover
      # "deny" => strict PingOne: the BFF evaluates against the real cloud PingOne
      # Authorize decision endpoint and FAILS CLOSED (HTTP 503) on a genuine PingOne
      # outage — it does NOT fall back to the mock. ff_authorize_simulated also
      # drives the BFF's X-Authz-Simulated header, so "false" routes the agent/MCP
      # tool path to real P1AZ too (PERMITs end-to-end per the provisioned MCP policy).
      # To force the simulated/education engine on BOTH paths, flip the feature
      # flag: FF_AUTHORIZE_SIMULATED: "true" (or toggle it in the admin UI). To allow
      # mock fallback on an outage instead of failing closed, set
      # AUTHORIZE_FAILOVER_MODE: "fallback_simulated".
      # Do NOT set AUTHORIZE_MODE here — an explicit authorize_mode wins over the
      # flag in resolveAuthorizeMode() and would make the flip a no-op.
      FF_AUTHORIZE_SIMULATED: "false"
      AUTHORIZE_FAILOVER_MODE: "deny"
      # Default agent to the local llama.cpp reasoning engine (free, no external
      # key). NOTE: getEffective() reads env-FIRST, so this AGENT_MODE env var
      # OVERRIDES any persisted /config selection on every read — it is the
      # single source of truth for the default agent mode. The reason loop runs
      # in agent-service (:3006) against LLAMACPP_BASE_URL (the :8090 model proxy).
      AGENT_MODE: "llamacpp"
      LANGCHAIN_AGENT_HTTP_URL: "http://langchain-agent:8888"
      AGENT_SERVICE_HOST: "langchain-agent"
      HITL_SERVICE_URL: "http://hitl-service:3009"
      AGENT_SERVICE_URL: "http://agent-service:3006"
      MCP_GW_PASSTHROUGH_TO_MCP_SERVER: "false"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # Agent frameworks (langchain et al) call back into the BFF at this origin
      # to execute tools with RFC 8693 exchange — agentRun.js appends
      # /internal/agent-tool itself, so this must be the ORIGIN ONLY. Without it
      # the code falls back to 127.0.0.1 — unreachable from agent containers, so
      # every AG-UI tool call died with ConnectError and the agent never replied.
      # Hostname must match the mkcert cert SAN (api.ping.demo — see the network
      # alias on this service below).
      BFF_INTERNAL_TOOL_URL: "https://api.ping.demo:3001"
      # NOTE: Public URLs (PINGONE_PUBLIC_APP_URL, PINGONE_RESOURCE_PINGGATEWAY_URI,
      # redirect URIs, etc.) are now sourced from demo_api_server/.env (master copy).
      # No hardcoded overrides in this docker-compose.yml — env_file loads them from .env.
      # See scope-topology.json for the definition of these values per environment.
      # scope-topology.json is bind-mounted via the repo root as a DIRECTORY (see
      # volumes: ./:/repo below) so it survives host-file replacement; point the
      # BFF readers (scopeTopology.js, configStore.js) at that stable path.
      SCOPE_TOPOLOGY_PATH: "/repo/scope-topology.json"
      # llama.cpp — BFF status probe (llmProviderStatus.js) needs the host-reachable
      # URL (origin only; the service appends /v1). Launch llama-server on the host.
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      # Small NON-reasoning model: BFF NL-intent / teaching answers must return
      # under the SPA fetch timeout. A reasoning model takes ~22s+ and blows it,
      # surfacing "Could not parse: signal timed out"; a 3B-class model answers in
      # ~3s. Leave LLAMACPP_MODEL unset to use whatever llama-server reports.
      LLAMACPP_MODEL: "gemma-3-4b-it"
      CODE_SEARCH_DEFAULT_INDEX: ${CODE_SEARCH_DEFAULT_INDEX:-true}
      CODE_SEARCH_REPO_ROOT: /repo
      LLAMAINDEX_AGENT_URL: http://llamaindex-agent:8894
    command: npm start  # Dockerfile uses production deps only (no nodemon)
    volumes:
      - ./certs:/certs:ro   # mkcert certs generated by bootstrap
      - ./LLM2.json:/LLM2.json:ro   # Helix agent key (gitignored secret — mount from host)
      - /opt/homebrew/bin/pingcli:/usr/local/bin/pingcli:ro   # host pingcli binary for demo page
      # Hot reload: mount source code so changes reflect instantly without rebuild
      - ./demo_api_server:/app
      - /app/node_modules  # exclude node_modules from mount (use container's version)
      - .:/repo:ro   # read-only repo root for the default code-search index
      # Agent Gateway JSON config editor (/agent-gateway-config admin page): the BFF
      # reads/writes the gateway's JSON on the host. RW (not :ro) so saves persist;
      # IG picks up routes/*.json via its ~10s directory watcher, config/admin need a
      # restart.
      - ./ping-gateway/config:/app/gateway-config
      # scope-topology.json (configStore + scopeTopology SSOT) is read via
      # SCOPE_TOPOLOGY_PATH=/repo/scope-topology.json. Mounting the repo root as a
      # DIRECTORY — rather than the single file — is deliberate: a single-file
      # bind mount goes stale when the host file is replaced (git merge /
      # topology regen give it a new inode), vanishing in-container and
      # crash-looping the BFF at require-time. A directory mount re-resolves the
      # file on every read. Must be RW: the /agent-gateway-config admin editor
      # saves scope-topology.json through this mount (writeAtomic temp+rename,
      # backups in /repo/.backups — gitignored) and a :ro mount turns every
      # save into a 500 (EROFS).
      - ./:/repo
      # Encrypted secrets vault (Phase 269). vaultLoader's default path is
      # REPO_ROOT/secrets.vault, which resolves to /secrets.vault inside /app —
      # mount the committed encrypted file there. VAULT_PASSWORD arrives via the
      # env_file (demo_api_server/.env); without it the BFF fails fast (exit 1),
      # so run-docker.sh's vault preflight verifies the password decrypts first.
      - ./secrets.vault:/secrets.vault:ro
      # One-click "Restart gateway" button hits the Docker Engine API over this socket
      # (no docker CLI/dep in the image). Admin-gated; only restarts the two allowlisted
      # containers. This grants host container control — keep the endpoint locked down.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the BFF LMDB store (configStore, sessions, accounts, demo
      # scenarios, client registry, security monitoring) across container
      # recreate. Without this, `docker compose up --force-recreate` rebuilds
      # the writable layer and wipes runtime config (e.g. authorize_mode).
      - ai-demo-bff-data:/app/data/persistent
    # Join the docker.sock's group so the non-root BFF (appuser) can call the
    # Docker Engine API for the /agent-gateway one-click restart. OrbStack/Docker
    # Desktop expose the socket as root:root (mode 660), so group 0 is required.
    # The restart endpoint is admin-gated and only touches two allowlisted
    # containers; this does NOT run the BFF as root.
    group_add:
      - "0"
    networks:
      ai-demo:
        # Cert-valid alias: the mkcert cert SANs cover api.ping.demo (not the
        # demo-api-server service name), so agent containers can verify TLS on
        # the internal tool callback (BFF_INTERNAL_TOOL_URL above).
        aliases:
          - api.ping.demo
    depends_on:
      mcp-server:
        condition: service_started
    healthcheck:
      # -k skips chain verify (mkcert cert, trusted on host but not inside container)
      test: ["CMD", "curl", "-k", "-f", "https://localhost:3001/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── UI (Vite build → nginx HTTPS) ──────────────────────────────────────────
  ui:
    build:
      context: ./demo_api_ui
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-ui
    ports:
      # Container listens on 4000 in both modes — nginx (production stage,
      # nginx.conf `listen 4000 ssl`) and the Vite dev server (vite.config.js).
      # Same container port means the dev override inherits this mapping and
      # needs no `ports` override (no Compose `!override` tag required).
      - "4000:4000"
    volumes:
      - ./demo_api_ui/src:/app/src  # Hot reload: Vite watches src changes
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ai-demo
    depends_on:
      demo-api-server:
        condition: service_healthy
    restart: unless-stopped

  # ── MCP Server (WebSocket — plain HTTP, internal only) ───────────────────────
  mcp-server:
    build:
      context: ./demo_mcp_server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8080"
      MCP_RESOURCE_URL: "http://localhost:8080"
      HTTP_MCP_TRANSPORT_ENABLED: "true"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # RFC 8693 rollout: the gateway now exchanges the inbound token for one scoped to
      # this backend's own resource URI (RFC 8707 `resource` param) before forwarding, so
      # MCP server tokens carry aud=mcpserver.ping.demo. MCP_SERVER_RESOURCE_URI accepts a
      # comma-separated list; mcpgateway.ping.demo is kept as a transitional second entry
      # so tokens from callers still on the old forward-unchanged contract keep validating.
      MCP_SERVER_RESOURCE_URI: "mcpserver.ping.demo,mcpgateway.ping.demo"
      # RAG code-search service — the code_search/get_code/list_codebases tool
      # handlers call this over compose DNS.
      MCP_CODE_SEARCH_URL: "http://demo-mcp-code-search:8095"
    env_file:
      - path: ./demo_mcp_server/.env
        required: false   # copy demo_mcp_server/.env.example if you need overrides
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js", "localhost", "8080", "/.well-known/mcp-server"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── LangChain Agent (Python / uvicorn) ───────────────────────────────────────
  langchain-agent:
    build:
      context: .
      dockerfile: langchain_agent/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-langchain-agent
    command: ./scripts/startup.sh
    ports:
      - "8888:8888"   # AG-UI SSE / FastAPI
      - "8889:8889"   # WebSocket chat
      - "8890:8890"   # health
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      AGUI_HTTP_PORT: "8888"
      WEBSOCKET_PORT: "8889"
      HEALTH_HTTP_PORT: "8890"
      # Servers bind 127.0.0.1 by default; published ports need the container override.
      AGUI_HTTP_HOST: "0.0.0.0"
      CHAT_WS_HOST: "0.0.0.0"
      # CodeGraph Explorer LLM — auto-detects: llama.cpp (host) → Helix → lmstudio
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      # Code Explorer is code work → StarCoder2 class (per-agent routing).
      LLAMACPP_MODEL: "starcoder2-15b-instruct"
      # Code Explorer "Refresh index" reads live source + writes the rebuilt DB
      # under the bind-mounted repo (see volumes below). Pointing both at the live
      # tree means grep/read_file always see current source and a re-index only
      # needs to rerun the indexer — no image rebuild, no repo-src re-stage.
      REPO_SRC_ROOT: "/app/live-repo"
      CODEGRAPH_DB_PATH: "/app/live-repo/.codegraph/codegraph.db"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (httpx
      # honors SSL_CERT_FILE). Combined bundle = system roots + mkcert root CA,
      # so external HTTPS (Anthropic/OpenAI/PingOne) keeps verifying. Generate:
      #   cat /etc/ssl/cert.pem "$(mkcert -CAROOT)/rootCA.pem" > certs/ca-bundle-with-mkcert.pem
      SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./langchain_agent/.env
        required: false   # add LLM provider key (ANTHROPIC_API_KEY / OPENAI_API_KEY)
    volumes:
      # Live repo, read-only — source the agent greps/reads + the indexer scans.
      - ./:/app/live-repo:ro
      # .codegraph overlaid read-write so the in-container re-index can rewrite
      # codegraph.db (a directory mount, so the indexer's unlink+recreate is safe
      # — a single-file bind mount would pin the old inode after rebuild).
      - ./.codegraph:/app/live-repo/.codegraph
      # CA bundle for SSL_CERT_FILE above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── MCP Gateway (TypeScript proxy — routes to mcp-server and mcp-invest) ──────
  mcp-gateway:
    build:
      context: .    # repo root — needs scope-topology.json and sibling openapi files
      dockerfile: demo_mcp_gateway/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-gateway
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      MCP_GW_PORT: "3005"
      MCP_GW_OLB_WS_URL: "ws://mcp-server:8080"
      MCP_GW_INVEST_WS_URL: "ws://mcp-invest:8081"
      MCP_GW_PASSTHROUGH_TO_MCP_SERVER: "false"
      PINGAUTHORIZE_ENDPOINT: "http://authz-server:9001"
      PINGAUTHORIZE_WORKER_ID: "mcp-gateway"
      MCP_GW_P1AZ_ENABLED: "true"
      GW_INTROSPECTION_ENDPOINT: "http://authz-server:9001/as/introspect"
      MORTGAGE_SERVICE_URL: "http://mortgage-service:8082"   # api-key dispatch backend (mortgage + invest routes)
    env_file:
      - path: ./demo_mcp_gateway/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      - mcp-server
      - mcp-invest
      - authz-server
    restart: unless-stopped

  # ── Agent Service (TypeScript — LangGraph / Helix routing) ───────────────────
  agent-service:
    build:
      context: ./demo_agent_service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-agent-service
    ports:
      - "3016:3006"   # 3006 is reserved by OrbStack on macOS; internal port is still 3006
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"    # override loopback default (REGRESSION_PLAN §3) for container networking
      AGENT_SERVICE_PORT: "3006"
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_GATEWAY_URL: "http://mcp-gateway:3005"
      LLAMACPP_BASE_URL: "http://host.docker.internal:8090"
      # Agent reasoning + native tool calls → strongest tier. The proxy treats
      # this as a minimum capability class (per-agent routing, swap mode).
      LLAMACPP_MODEL: "gpt-oss-20b"
    env_file:
      - path: ./demo_agent_service/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-gateway
    restart: unless-stopped

  # ── HITL Service (plain JS — human-in-the-loop consent) ─────────────────────
  hitl-service:
    build:
      context: ./demo_hitl_service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-hitl-service
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: production
      PORT: "3009"
      HITL_ALLOWED_ORIGINS: "http://api-server:3001,http://localhost:4000,https://api.ping.demo:3001"
    env_file:
      - path: ./demo_hitl_service/.env
        required: false
    networks:
      - ai-demo
    restart: unless-stopped

  # ── MCP Invest Server (TypeScript — investment tools) ───────────────────────
  mcp-invest:
    build:
      context: ./demo_mcp_invest
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-invest
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8081"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # RFC 8693 rollout: gateway exchanges to this backend's own resource URI before
      # forwarding (aud=mcp-invest.ping.demo). mcpgateway.ping.demo kept as a transitional
      # second entry for callers still on the old forward-unchanged contract. Compose env
      # wins over demo_mcp_invest/.env.
      MCP_SERVER_RESOURCE_URI: "mcp-invest.ping.demo,mcpgateway.ping.demo"
    env_file:
      - path: ./demo_mcp_invest/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
    restart: unless-stopped

  # ── Mortgage Service (plain JS) ───────────────────────────────────────────────
  mortgage-service:
    build:
      context: ./demo_mortgage_service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mortgage-service
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      MORTGAGE_SERVICE_PORT: "8082"      # server reads MORTGAGE_SERVICE_PORT, not PORT
      MORTGAGE_SERVICE_HOST: "0.0.0.0"   # default 127.0.0.1 is unreachable cross-container
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
    env_file:
      - path: ./demo_mortgage_service/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
    restart: unless-stopped

  # ── PingOne Authorization Server (mock) ──────────────────────────────────────
  # Build-only entry: produces ai-demo-authz-server:latest for the k8s gateway
  # sidecar (k8s/60-mcp-gateway-deployment.yaml). Local dev runs this via run.sh
  # on the host (127.0.0.1:9001), not compose, so no host port is published here.
  authz-server:
    build:
      context: .    # repo root — needs scope-topology.json (single source of truth)
      dockerfile: demo_authz_server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-authz-server
    ports:
      - "9001:9001"
    environment:
      NODE_ENV: production
      AUTHZ_PORT: "9001"
      HOST: "0.0.0.0"
    env_file:
      - path: ./demo_mcp_gateway/.env
        required: false
      - path: ./demo_authz_server/.env
        required: false
    networks:
      - ai-demo
    restart: unless-stopped

  # ── Mastra Agent (TypeScript agent runtime) ──────────────────────────────────
  mastra-agent:
    build:
      context: ./mastra_agent
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mastra-agent
    ports:
      - "8892:8892"
    environment:
      NODE_ENV: production
      PORT: "8892"
      AGENT_HTTP_HOST: "0.0.0.0"   # default 127.0.0.1 is unreachable cross-container
      AGENT_HTTP_PORT: "8892"
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Agent LLM → host llama.cpp proxy (:8090, OpenAI-compatible). Containers
      # reach the host proxy via host.docker.internal (same as LLAMACPP_BASE_URL).
      AGENT_LLM_BASE_URL: "http://host.docker.internal:8090/v1"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (Node honors
      # NODE_EXTRA_CA_CERTS). Without it, every tool call to https://api.ping.demo
      # fails with UNABLE_TO_VERIFY_LEAF_SIGNATURE. Same bundle as the langchain agent.
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./mastra_agent/.env
        required: false
    volumes:
      # CA bundle for NODE_EXTRA_CA_CERTS above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    restart: unless-stopped

  # ── OpenAI Agent (Python / uvicorn) ─────────────────────────────────────────
  openai-agent:
    build:
      context: ./openai_agent
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-openai-agent
    ports:
      - "8891:8891"
    environment:
      ENVIRONMENT: development
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Agent LLM → host llama.cpp proxy (:8090, OpenAI-compatible). Containers
      # reach the host proxy via host.docker.internal (same as LLAMACPP_BASE_URL).
      AGENT_LLM_BASE_URL: "http://host.docker.internal:8090/v1"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (httpx honors
      # SSL_CERT_FILE). Without it, every tool call to https://api.ping.demo fails
      # with CERTIFICATE_VERIFY_FAILED. Same bundle as the langchain agent.
      SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./openai_agent/.env
        required: false
    volumes:
      # CA bundle for SSL_CERT_FILE above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    restart: unless-stopped

  # ── Pydantic AI Agent (Python / uvicorn) ────────────────────────────────────
  pydantic-agent:
    build:
      context: ./pydantic_agent
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-pydantic-agent
    ports:
      - "8893:8893"
    environment:
      ENVIRONMENT: development
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Agent LLM → host llama.cpp proxy (:8090, OpenAI-compatible). Containers
      # reach the host proxy via host.docker.internal (same as LLAMACPP_BASE_URL).
      AGENT_LLM_BASE_URL: "http://host.docker.internal:8090/v1"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (httpx honors
      # SSL_CERT_FILE). Without it, every tool call to https://api.ping.demo fails
      # with CERTIFICATE_VERIFY_FAILED. Same bundle as the langchain agent.
      SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./pydantic_agent/.env
        required: false
    volumes:
      # CA bundle for SSL_CERT_FILE above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    restart: unless-stopped

  # ── MCP Proxy (HTTP-to-MCP sidecar — exposes MCP tools as plain REST) ──────────
  # Stateless agents (OpenAI Agents, Pydantic AI, Mastra) can call MCP tools via
  # simple HTTP (GET /tools, POST /tools/:name) without implementing MCP protocol.
  # Auth: callers pass Bearer token; proxy forwards it to the MCP gateway unchanged.
  mcp-proxy:
    build:
      context: ./demo_mcp_proxy
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mcp-proxy
    ports:
      - "8895:8895"
    environment:
      PORT: "8895"
      MCP_GATEWAY_HTTP_URL: "http://mcp-gateway:3005"
    networks:
      - ai-demo
    depends_on:
      - mcp-gateway
    restart: unless-stopped

  # ── PingGateway (Ping Identity IG) — alternative MCP gateway ─────────────────
  # Selected at runtime by the BFF feature flag ff_mcp_gateway_pinggateway (the BFF
  # reaches it at http://ping-gateway:8080). PingGateway introspects the inbound
  # token, mirrors the Node PingOneAuthorizeClient decision (live-switchable mock
  # authz-server vs real PingOne Authorize via the X-Authz-Simulated header the BFF
  # stamps), and performs an IG-native RFC 8693 exchange to the backend MCP servers.
  # Host port is 3036 (NOT 3006 — OrbStack reserves host 3006 on macOS, same reason
  # agent-service maps 3016:3006); 3036 is only for host-side curl/testing.
  # Run the whole stack with COMPOSE_PROJECT_NAME=ai-demo so service DNS resolves.
  ping-gateway:
    image: us-docker.pkg.dev/forgeops-public/images-base/ig:latest
    container_name: ai-demo-ping-gateway
    # OrbStack preserves the container writable layer across daemon restarts, so
    # tmp/ig.pid survives an unclean stop even without a named volume. Delete it
    # before handing off to the real startup script.
    # keytool -cacerts (the stock approach) fails here: the image runs as a fixed
    # non-root uid (forgerock) with no privilege drop, and $JAVA_HOME/lib/security/
    # cacerts is root:root 0644 (not group-writable) — confirmed live via
    # `docker exec ai-demo-ping-gateway id -u` (11111) and `ls -l cacerts`.
    # Fallback: copy the JDK cacerts (keeps trust for real auth.pingone.com /
    # api.pingone.com calls IG also makes) into the writable /var/gateway instance
    # dir, then import the mkcert root into that copy; JAVA_OPTS below points the
    # JVM at it. Idempotent via `|| true` (mkcert-root re-import on restart no-ops).
    # `$$JAVA_HOME` (not `$JAVA_HOME`): Compose interpolates single-`$` vars from
    # the HOST env at `docker compose config` time (confirmed live — an unset host
    # JAVA_HOME silently rendered as an empty string). `$$` escapes to a literal
    # `$`, deferring expansion to the container's own shell/JAVA_HOME at runtime.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp "$$JAVA_HOME/lib/security/cacerts" /var/gateway/mkcert-truststore.jks 2>/dev/null || true;
        keytool -importcert -noprompt -alias mkcert-root -keystore /var/gateway/mkcert-truststore.jks -storepass changeit
        -file /certs/mkcert-rootCA.pem 2>/dev/null || true;
        rm -f /var/gateway/tmp/ig.pid && exec /opt/gateway/bin/start.sh /var/gateway
    ports:
      - "3036:8080"
    volumes:
      # /var/gateway is IG's instance dir: it must be writable + EPHEMERAL. The Docker
      # container layer (writable by default) is the Compose equivalent of the k8s
      # emptyDir the PingGateway docs require. Do NOT use a named volume here — a
      # persisted /var/gateway keeps a stale tmp/ig.pid after an unclean stop, and IG
      # then refuses to start ("PID file already exists. Cannot start") on every recreate.
      #
      # Mount config + groovy as DIRECTORIES, not individual files. IG's RouterHandler
      # watches the routes dir every ~10s; with per-file bind mounts the watcher
      # mis-detects changes and UNLOADS the routes at runtime (then /mcp 404s). A stable
      # read-only directory mount has consistent mtimes, so routes load once and stay.
      # runc/OCI can't create a new mountpoint node under an already-read-only bind
      # mount, so the nested mcp-tool-schemas.json bind mount below needs a real file
      # already present at that path in ./ping-gateway/config (a committed placeholder)
      # to bind over — that lets this directory mount stay :ro.
      - ./ping-gateway/config:/var/gateway/config:ro
      - ./ping-gateway/scripts/groovy:/var/gateway/scripts/groovy:ro
      - ./mcp-tool-schemas.json:/var/gateway/config/mcp-tool-schemas.json:ro
      - ./certs:/certs:ro   # mkcert CA imported into the JVM truststore at start (IG→BFF TLS)
    environment:
      # In-stack overrides (env block wins over env_file): reach backends + the mock
      # authz server by compose service DNS, not host.docker.internal.
      PG_OLB_BACKEND_URL: "http://mcp-server:8080"
      PG_INVEST_BACKEND_URL: "http://mcp-invest:8081"
      P1AZ_MOCK_BASE: "http://authz-server:9001"
      # P1AZ_WORKER_ID comes from ./ping-gateway/.env (real decision endpoint id).
      # Do NOT pin it here — the env block wins over env_file, and a placeholder
      # pin silently overrides the real id (the mock only uses it as a path param,
      # so the real value works for both backends).
      PG_MORTGAGE_BACKEND_URL: "http://mortgage-service:8082"
      BFF_VAULT_KEY_URL: "https://api.ping.demo:3001/internal/vault/service-key"
      # BFF_INTERNAL_SECRET comes from env_file (ping-gateway/.env, written by
      # refresh-service-envs.js) so it matches the BFF's real value — do NOT set
      # it here (environment: would override env_file with a wrong/default value).
      # Fallback truststore (see entrypoint comment above): -cacerts isn't writable
      # by the fixed non-root image user, so the mkcert root is imported into a
      # copy of cacerts under /var/gateway instead, and the JVM is pointed at it.
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/var/gateway/mkcert-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
    env_file:
      # Secrets + PingOne endpoints + resource ids (gitignored; .env.example is SoT).
      - path: ./ping-gateway/.env
        required: false
    networks:
      - ai-demo
    depends_on:
      - mcp-server
      - mcp-invest
      - authz-server
    restart: unless-stopped

  # ── RAG Code Search Services ──────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: ai-demo-weaviate
    # No host port publish — consumed only container-to-container as
    # http://weaviate:8080 (compose DNS). Publishing host :8080 collides with
    # mcp-server, which owns host :8080.
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_APIKEY_ENABLED: "false"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Bring-your-own vectors: the code-search service supplies embeddings,
      # so Weaviate needs no vectorizer module of its own.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      # Stable raft node identity. Without this, Weaviate derives the raft node ID
      # from the random container hostname; on a container recreate the persisted
      # weaviate-data volume then references a dead node and no leader is ever
      # elected — every schema/index op 500s ("leader not found") while the
      # raft-free /v1/meta healthcheck still passes, so it looks healthy.
      # NOTE: first applying/changing this needs a one-time `weaviate-data` volume
      # wipe + reindex to align the persisted node ID with CLUSTER_HOSTNAME.
      CLUSTER_HOSTNAME: weaviate
      RAFT_BOOTSTRAP_EXPECT: "1"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - ai-demo
    healthcheck:
      # weaviate image ships wget, not curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Embedding model server — llama.cpp in --embedding mode (NOT Ollama).
  # Serves the OpenAI-compatible /v1/embeddings endpoint. The GGUF model
  # (~140MB) downloads once via -hf and is cached in the embed-models volume.
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-demo-embeddings
    ports:
      - "8084:8080"
    command: >
      --host 0.0.0.0 --port 8080
      --embedding --pooling mean
      -c 32768 -b 8192 -ub 8192 --parallel 4
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0
    volumes:
      - embed-models:/root/.cache/llama.cpp
    networks:
      - ai-demo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  demo-mcp-code-search:
    build:
      context: ./demo_mcp_code_search
      dockerfile: Dockerfile
    container_name: ai-demo-mcp-code-search
    ports:
      - "8095:8095"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LOG_LEVEL: info
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      # service_started (not _healthy): this service's own /health stays green
      # while the embedder warms up; index/search return 503 until it's ready.
      embeddings:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8095/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  llamaindex-agent:
    build:
      context: ./llamaindex_agent
      dockerfile: Dockerfile
    container_name: ai-demo-llamaindex-agent
    ports:
      - "8894:8894"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_MODEL: nomic-embed-text-v1.5
      LLAMACPP_BASE_URL: http://llm-proxy:8090
      AGENT_MAX_TOOL_CALLS: "4"
    networks:
      - ai-demo
    depends_on:
      weaviate:
        condition: service_healthy
      embeddings:
        condition: service_started
      llm-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8894/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── LLM Proxy (Node.js smart router) ──────────────────────────────────────
  # Serves the :8090 endpoint that BFF + agent-service already target via
  # LLAMACPP_BASE_URL. Classifies each request and routes to the smallest
  # capable of 4 local llama-server tiers (8091-8094), cascading on overload.
  # Start the model backends first: bash demo_llm_proxy/start-local-models.sh
  llm-proxy:
    build:
      context: ./demo_llm_proxy
      dockerfile: Dockerfile
    container_name: ai-demo-llm-proxy
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: production
      LLM_PROXY_PORT: "8090"
    networks:
      - ai-demo
    # Access host llama-server instances via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Ungoverned Agent (demo prop — DOES NOT auto-start) ───────────────────────
  # A headless browser that rides a logged-in bank session and moves money via
  # the UI — the containerized analog of an agent driving your logged-in Chrome
  # (e.g. OpenCLI). No agent identity / scope / consent / audit: the demo records
  # it as a plain user session. Gated behind the "demo-attack" profile so it is
  # only run on demand:  docker compose run --rm ungoverned-agent
  ungoverned-agent:
    build:
      context: ./demo_ungoverned_agent
      dockerfile: Dockerfile
    container_name: ai-demo-ungoverned-agent
    profiles: ["demo-attack"]
    environment:
      UI_URL: ${UNGOV_UI_URL:-https://ui:4000}
      # Supply ONE of these from a signed-in customer (see the runbook). The bank
      # APIs require a real PingOne customer session — a local login is not enough.
      SESSION_COOKIE: ${UNGOV_SESSION_COOKIE:-}
      ACCESS_TOKEN: ${UNGOV_ACCESS_TOKEN:-}
      ALLOW_LOCAL_LOGIN: ${UNGOV_ALLOW_LOCAL_LOGIN:-false}
      DEMO_USER: ${UNGOV_DEMO_USER:-john.doe}
      DEMO_PASS: ${UNGOV_DEMO_PASS:-${SEED_CUSTOMER_PASSWORD:-password123}}
      AMOUNT: ${UNGOV_AMOUNT:-50}
      DESCRIPTION: ${UNGOV_DESCRIPTION:-Ungoverned agent transfer}
    networks:
      - ai-demo
    restart: "no"

networks:
  ai-demo:
    driver: bridge

volumes:
  # BFF persistent LMDB store — survives `docker compose up --force-recreate`.
  ai-demo-bff-data:
  # RAG Code Search volumes
  weaviate-data:
  embed-models:
