      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8081"
      DEMO_API_BASE_URL: "https://demo-api-server:3001"
      # RFC 8693 rollout: gateway exchanges to this backend's own resource URI before
      # forwarding (aud=mcp-invest.ping.demo). mcpgateway.ping.demo kept as a transitional
      # second entry for callers still on the old forward-unchanged contract. Compose env
      # wins over demo_mcp_invest/.env.
      MCP_SERVER_RESOURCE_URI: "mcp-invest.ping.demo,mcpgateway.ping.demo"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
