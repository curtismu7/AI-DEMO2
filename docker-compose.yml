        required: false
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
    restart: unless-stopped

  # ── PingOne Authorization Server (mock) ──────────────────────────────────────
  # Demo Authorize AS — profile demo-auth. Real stack uses cloud PingOne Authorize;
  # IG mock failover uses this when ff_authorize_simulated is ON. `./run-docker.sh demo-sync`.
  authz-server:
    profiles: ["demo-auth"]
    build:
      context: .    # repo root — needs scope-topology.json (single source of truth)
      dockerfile: demo_authz_server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-authz-server
    ports:
      - "9001:9001"
    environment:
      NODE_ENV: production
      AUTHZ_PORT: "9001"
      HOST: "0.0.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      OTEL_SERVICE_NAME: "authz-server"
      NODE_OPTIONS: "-r /otel/otel-instrument.js"
      # When set, HitlApproved+UUID also requires an approved challenge in HITL store.
      HITL_SERVICE_URL: "http://hitl-service:3009"
      # Accept Node-gateway + PingGateway audiences — same dual-audience pin as
      # demo-api-server above; the stale single-value demo_mcp_gateway/.env
      # entry otherwise wins via env_file and every PingGateway-minted token
      # (aud https://api.ping.demo:3036/mcp) is denied with invalid_aud. Also
      # includes the A2A specialists' dedicated Exchange #2 audience.
      MCP_GW_RESOURCE_URI: "mcpgateway.ping.demo,https://api.ping.demo:3036/mcp,mcpgateway-a2a.ping.demo"
      BFF_TRANSACTION_HOP_URL: "https://demo-api-server:3001/internal/transaction-hop"
      # mkcert CA so the emitter's HTTPS POST to the BFF can verify its leaf cert.
      # Without it every hop fails UNABLE_TO_VERIFY_LEAF_SIGNATURE and is silently
      # swallowed by the fire-and-forget .catch() -- an invisible, empty chain.
      NODE_EXTRA_CA_CERTS: /certs/ca-bundle-with-mkcert.pem
    env_file:
      - path: ./demo_mcp_gateway/.env
        required: false
      - path: ./demo_authz_server/.env
        required: false
      # Worker credentials for the Rule 0a2 PingOne user lookup — without
      # PINGONE_WORKER_CLIENT_ID/SECRET every decision fails closed with
      # user_lookup_failed. Listed last so its values win over the gateway
      # .env; the environment: block above still overrides everything.
      - path: ./demo_api_server/.env
        required: false
    volumes:
      - ./scripts:/otel:ro  # dir mount: survives git pull replacing the file (a single-file bind mount pins the old inode and crash-loops node -r)
      - ./certs:/certs:ro  # dir mount, not a single file -- a single-file bind pins the inode
    networks:
      - ai-demo
    restart: unless-stopped

  # ── Mastra Agent (TypeScript agent runtime) ──────────────────────────────────
  mastra-agent:
    profiles: ["agents"]
    build:
      context: ./mastra_agent
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ai-demo-mastra-agent
    ports:
      - "8892:8892"
    environment:
      NODE_ENV: production
      PORT: "8892"
      AGENT_HTTP_HOST: "0.0.0.0"   # default 127.0.0.1 is unreachable cross-container
      AGENT_HTTP_PORT: "8892"
      BFF_BASE_URL: "https://demo-api-server:3001"
      MCP_SERVER_URL: "ws://mcp-server:8080"
      # Agent LLM → host llama.cpp proxy (:8090, OpenAI-compatible). Containers
      # reach the host proxy via host.docker.internal (same as LLAMACPP_BASE_URL).
      AGENT_LLM_BASE_URL: "http://host.docker.internal:8090/v1"
      # Trust the BFF's mkcert TLS cert on the internal tool callback (Node honors
      # NODE_EXTRA_CA_CERTS). Without it, every tool call to https://api.ping.demo
      # fails with UNABLE_TO_VERIFY_LEAF_SIGNATURE. Same bundle as the langchain agent.
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/ca-bundle-with-mkcert.pem"
    env_file:
      - path: ./mastra_agent/.env
        required: false
    volumes:
      # CA bundle for NODE_EXTRA_CA_CERTS above (gitignored; generated on the host).
      - ./certs/ca-bundle-with-mkcert.pem:/etc/ssl/certs/ca-bundle-with-mkcert.pem:ro
    networks:
      - ai-demo
    depends_on:
      - demo-api-server
      - mcp-server
    restart: unless-stopped

  # ── OpenAI Agent (Python / uvicorn) ─────────────────────────────────────────
  openai-agent:
    profiles: ["agents"]
