# librechat/librechat.yaml
# For schema reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.14
cache: true

# Lets seed-demo-agents.js (run as a regular USER account) share its demo
# agents publicly, so every LibreChat account sees them. Only the keys listed
# here change; use/create keep their defaults.
interface:
  agents:
    share: true
    public: true
  # Same for the demo prompts it adds to the Prompts library (type / in chat).
  prompts:
    share: true
    public: true
  # Keep My Agents and both endpoints in the model selector beside the Demos
  # specs below. Unset, LibreChat turns it off whenever modelSpecs exist
  # (data-schemas loadDefaultInterface; measured 2026-09-13: only the five
  # Demos groups were listed).
  modelSelect: true
  # Scheduled chats (unattended runs). Unset, LibreChat answers 403 "Scheduled
  # chats are disabled" (packages/api getLimits). Capped because it applies to
  # every account; seed-demo-agents.js creates its three schedules disabled.
  schedules:
    use: true
    create: true
    maxPerUser: 3
    minIntervalMinutes: 60

# A "Demos" menu in the model selector: each spec opens one seeded agent.
# The agent_ids come from seed-demo-agents.js on this machine's Mongo volume —
# re-seeding keeps them (agents are updated by name), but a fresh volume
# issues new ids, so copy them from the seed output into this list.
# ponytail: hard-coded ids; generate this block from the seed if volumes get recreated often.
# interface.modelSelect above keeps the other endpoints listed beside them.
modelSpecs:
  list:
    # One grouping level is supported by this LibreChat selector. Put the
    # customer demos first, then cross-cutting security and routing demos.
    - {name: everyday-banking, label: 'Everyday Banking', group: 'Banking', description: 'Read accounts and transactions. Tools: get_my_accounts, get_account_balance, get_my_transactions, search_transactions.', preset: {endpoint: agents, agent_id: agent_kffiDGYrj-A5HjMtGHIIG}}
    - {name: banking-account-details, label: 'Banking Account Details', group: 'Banking', description: 'Inspect account and transaction details. Tools: get_my_accounts, get_account_nickname, get_my_transactions, get_transaction_detail.', preset: {endpoint: agents, agent_id: agent_GEIwUWs0eyjamkqyd-rKA}}
    - {name: money-movement, label: 'Money Movement', group: 'Banking', description: 'Change demo balances. Tools: get_my_accounts, create_transfer, create_deposit, create_withdrawal.', preset: {endpoint: agents, agent_id: agent_2PYzQsHO3ZxryCZXNH2No}}
    - {name: support-and-fees, label: 'Support and Fees', group: 'Banking', description: 'Banking support. Tools: get_my_accounts, get_fee_schedule, request_fee_waiver, get_branch_hours.', preset: {endpoint: agents, agent_id: agent_JuaqisgxbDGjKQ4iRRFvM}}

    - {name: super-sports, label: 'Super Sports Legacy Records', group: 'Super Sports', description: 'API-key-backed order and warranty records. Tools: show_gear_order, show_gear_warranty.', preset: {endpoint: agents, agent_id: agent_m97KM-3gDMBfQsu5hNL9A}}
    - {name: super-sports-gear-rentals, label: 'Super Sports Gear & Rentals', group: 'Super Sports', description: 'Rentals, catalog, wishlist and coaching. Tools: list_rentals, browse_gear, list_wishlist, list_coaching_sessions.', preset: {endpoint: agents, agent_id: agent_fWg8lq30Uk8aoZp4GbYeb}}
    - {name: super-sports-orders-loyalty, label: 'Super Sports Orders & Loyalty', group: 'Super Sports', description: 'Orders and customer value. Tools: list_gear, gear_order_status, loyalty_balance, list_store_credit.', preset: {endpoint: agents, agent_id: agent_BnSJVZvhIG48sfJVhQg3A}}
    - {name: super-sports-stores-code, label: 'Super Sports Stores & Code', group: 'Super Sports', description: 'Store locations and source search. Tools: get_branch_hours, code_search.', preset: {endpoint: agents, agent_id: agent_JgBWL6kD1JxMju4dwRoJr}}

    - {name: careconnect-health-data, label: 'CareConnect Health Data', group: 'CareConnect', description: 'Patient health data. Tools: list_appointments, view_medications, view_lab_results, view_allergies.', preset: {endpoint: agents, agent_id: agent_jTeyK3sdGeG9YhOOOl6sx}}
    - {name: careconnect-coverage-claims, label: 'CareConnect Coverage & Claims', group: 'CareConnect', description: 'Insurance and care relationships. Tools: view_coverage, view_claims, view_care_team, view_referrals.', preset: {endpoint: agents, agent_id: agent_MCEjti8D8OmlDJ1ByGOCY}}
    - {name: careconnect-actions, label: 'CareConnect Actions', group: 'CareConnect', description: 'Change demo healthcare data. Tools: refill_prescription, book_appointment, view_medications, list_appointments.', preset: {endpoint: agents, agent_id: agent_T1uscvG4dEEYaP46Cm0kB}}

    - {name: opensearch-direct, label: 'OpenSearch22 · Direct', group: 'OpenSearch', description: 'Direct full catalog. Tools (9): ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, GenericOpenSearchApiTool, ClusterHealthTool, CountTool, MsearchTool, ExplainTool.', preset: {endpoint: agents, agent_id: agent_NqFc9aF7UdJPE7gIXz39t}}
    - {name: opensearch-via-privilege, label: 'OpenSearch (all tools) · Privilege + Façade', group: 'OpenSearch', description: 'Full catalog through Privilege with trace recording. Tools (9): ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, GenericOpenSearchApiTool, ClusterHealthTool, CountTool, MsearchTool, ExplainTool.', preset: {endpoint: agents, agent_id: agent_9vHeC_U0qcoA6PB2GOTtG}}
    - {name: opensearch-privilege-opensearch22, label: 'OpenSearch22 · Privilege', group: 'OpenSearch', description: 'Policy-limited catalog. Tools (3): ClusterHealthTool, ListIndexTool, CountTool.', preset: {endpoint: agents, agent_id: agent_-i7gJO7tyfjEiTu5r_2iD}}
    - {name: privilege-aggregate, label: 'Privilege Aggregate', group: 'OpenSearch', description: 'OpenSearch and banking behind one Privilege app. Tools: opensearch__ClusterHealthTool, opensearch__ListIndexTool, banking-mcp__list_banking_accounts, banking-mcp__get_banking_account.', preset: {endpoint: agents, agent_id: agent_tmjJj-eIZTwvayIFIcd7J}}

    - {name: super-sports-policy-guardrails, label: 'Super Sports Policy Guardrails', group: 'Security & Policy', description: 'Policy enforcement. Tools: list_rentals, loyalty_balance, extend_rental, sensitive_membership_details.', preset: {endpoint: agents, agent_id: agent_dHaKLN_ZFfdoLchcFIQmO}}
    - {name: banking-policy-guardrails, label: 'Banking Policy Guardrails', group: 'Security & Policy', description: 'Policy enforcement. Tools: get_my_accounts, get_my_transactions, create_transfer.', preset: {endpoint: agents, agent_id: agent_ZExlrlqicQeAEM9QfQ1Ic}}
