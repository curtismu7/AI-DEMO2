# librechat/librechat.yaml
# For schema reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.14
cache: true

# Lets seed-demo-agents.js (run as a regular USER account) share its demo
# agents publicly, so every LibreChat account sees them. Only the keys listed
# here change; use/create keep their defaults.
interface:
  agents:
    share: true
    public: true
  # Same for the demo prompts it adds to the Prompts library (type / in chat).
  prompts:
    share: true
    public: true
  # Keep the selector enabled for the categorized specs below.
  modelSelect: true
  # Scheduled chats (unattended runs). Unset, LibreChat answers 403 "Scheduled
  # chats are disabled" (packages/api getLimits). Capped because it applies to
  # every account; seed-demo-agents.js creates its three schedules disabled.
  schedules:
    use: true
    create: true
    maxPerUser: 3
    minIntervalMinutes: 60

# A nested demo menu in the model selector: each spec opens one seeded agent.
# The agent_ids come from seed-demo-agents.js on this machine's Mongo volume —
# re-seeding keeps them (agents are updated by name), but a fresh volume
# issues new ids, so copy them from the seed output into this list.
# ponytail: hard-coded ids; generate this block from the seed if volumes get recreated often.
# interface.modelSelect above keeps the other endpoints listed beside them.
modelSpecs:
  # Raw endpoint allowlist. Deliberately omit `agents`: the categorized specs
  # below remain selectable, without duplicating every agent under My Agents.
  addedEndpoints:
    - 'Local LLM Proxy'
    - 'PingOne Privilege (OpenAI)'
  list:
    # The demo image recognizes `Parent / Child` as a nested model-selector
    # path. Use a third segment for path/provider so this stays usable as the
    # number of connections and verticals grows.

    - {name: demo-step-sports-legacy, label: 'Legacy Records', group: 'Sports / Demo Steps', description: 'Façade + Agent Gateway + PingOne authorization. Tools: show_gear_order, show_gear_warranty.', preset: {endpoint: agents, agent_id: agent_u1GoEC9BPWIfd-9a55C-I}}
    - {name: demo-step-sports-rentals, label: 'Gear & Rentals', group: 'Sports / Demo Steps', description: 'Façade + Agent Gateway + PingOne authorization. Tools: list_rentals, browse_gear, list_wishlist, list_coaching_sessions.', preset: {endpoint: agents, agent_id: agent_RPIpVEw-nudkq_KelIoZy}}
    - {name: demo-step-sports-orders, label: 'Orders & Loyalty', group: 'Sports / Demo Steps', description: 'Façade + Agent Gateway + PingOne authorization. Tools: list_gear, gear_order_status, loyalty_balance, list_store_credit.', preset: {endpoint: agents, agent_id: agent_EM7i1g-Jv78nddkCQm8iX}}
    - {name: demo-step-sports-stores, label: 'Stores & Code', group: 'Sports / Demo Steps', description: 'Façade + Agent Gateway + PingOne authorization. Tools: get_branch_hours, code_search.', preset: {endpoint: agents, agent_id: agent_W4VKHkLvHryBcpEUKOzM-}}



    - {name: super-sports, label: 'Legacy Records', group: 'Sports / Direct', description: 'API-key-backed order and warranty records. Tools: show_gear_order, show_gear_warranty.', preset: {endpoint: agents, agent_id: agent_m97KM-3gDMBfQsu5hNL9A}}
    - {name: super-sports-gear-rentals, label: 'Gear & Rentals', group: 'Sports / Direct', description: 'Rentals, catalog, wishlist and coaching. Tools: list_rentals, browse_gear, list_wishlist, list_coaching_sessions.', preset: {endpoint: agents, agent_id: agent_fWg8lq30Uk8aoZp4GbYeb}}
    - {name: super-sports-orders-loyalty, label: 'Orders & Loyalty', group: 'Sports / Direct', description: 'Orders and customer value. Tools: list_gear, gear_order_status, loyalty_balance, list_store_credit.', preset: {endpoint: agents, agent_id: agent_BnSJVZvhIG48sfJVhQg3A}}
    - {name: super-sports-stores-code, label: 'Stores & Code', group: 'Sports / Direct', description: 'Store locations and source search. Tools: get_branch_hours, code_search.', preset: {endpoint: agents, agent_id: agent_JgBWL6kD1JxMju4dwRoJr}}


    - {name: opensearch-direct, label: 'Direct', group: 'OpenSearch', description: 'Mac-only host-local OpenSearch MCP path over the port-forward; no Privilege policy in front. Tools (9): ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, GenericOpenSearchApiTool, ClusterHealthTool, CountTool, MsearchTool, ExplainTool.', preset: {endpoint: agents, agent_id: agent_NqFc9aF7UdJPE7gIXz39t}}
    - {name: opensearch-via-privilege, label: 'Privilege + Façade', group: 'OpenSearch', description: 'Full catalog through Privilege with trace recording. Tools (9): ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, GenericOpenSearchApiTool, ClusterHealthTool, CountTool, MsearchTool, ExplainTool.', preset: {endpoint: agents, agent_id: agent_9vHeC_U0qcoA6PB2GOTtG}}
    - {name: opensearch-privilege-opensearch22, label: 'Privilege 403 / Success', group: 'OpenSearch', description: 'OpenSearch22 through Privilege. Use this to show the façade 403 before its Privilege session is signed in, then success after sign-in.', preset: {endpoint: agents, agent_id: agent_-i7gJO7tyfjEiTu5r_2iD}}

    - {name: super-sports-policy-guardrails, label: 'AgentGateway Success / Authz Denied', group: 'Sports', description: 'Use list_rentals for success and extend_rental for the authorization denial. Tools: list_rentals, loyalty_balance, extend_rental, sensitive_membership_details.', preset: {endpoint: agents, agent_id: agent_dHaKLN_ZFfdoLchcFIQmO}}

    - {name: handoff-super-sports-checkout, label: 'Checkout → Payment', group: 'Sports / A2A', description: 'Reads orders, then delegates payment. Tools: list_gear, gear_order_status. Handoff: Money Movement.', preset: {endpoint: agents, agent_id: agent_C9N3qmt_WMkGCgorfjC7z}}

    - {name: super-sports-stores-code-local-model, label: 'Stores & Code · Local model', group: 'Sports / Local Model', description: 'Local-model store/code path on the Mac LLM proxy. Tools: get_branch_hours, code_search.', preset: {endpoint: agents, agent_id: agent_qjrE2h4KCo7zfMWaJZKFU}}

# LibreChat's SSRF guard blocks any MCP server URL that resolves to a private
# address — which every host-gateway alias in docker-compose.yml does. Each
# entry is host:port; the hostname is matched before DNS, so the alias is
# enough (packages/api: isSSRFTarget / resolveHostnameSSRF).
mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:8080'
    # opensearch-direct: the Mac port-forward to the OpenSearch MCP Service.
    - 'host.docker.internal:9900'
    # The BFF mcp-facade doors (api.ping.demo is aliased to the host gateway)
    # and their sign-in server, reached through the oauth-loopback sidecar.
    - 'api.ping.demo:3001'
    - 'localhost:3005'

endpoints:
  custom:
    - name: 'Local LLM Proxy'
      # demo_llm_proxy/ router.js — no auth check on any route, so any
      # non-empty apiKey value works (LibreChat requires the field to be set).
      apiKey: '${AGENT_LLM_API_KEY}'
      # host.docker.internal — see librechat/docker-compose.yml's extra_hosts
      # entry (docs/superpowers/plans/2026-08-24-librechat-privilege-mcp-client.md)
      # and this repo's own docker-compose.yml:1828 for the identical pattern.
      baseURL: '${AGENT_LLM_BASE_URL}'
      models:
        # The proxy classifies every request by prompt content (or by an
        # exact model-name match it recognizes) to pick a tier — it does
        # not require this name to match anything real, so a single
        # placeholder is sufficient. See demo_llm_proxy/router.js's
        # classFromModel()/classifyText().
        default:
          - 'demo-llm-proxy'
          # Tool calls need this one. The proxy's classFromModel() routes any
          # /gpt-oss/ model name to the gpt-oss-20b tier (:8096), the only
          # tier started with --jinja (demo_llm_proxy/start-local-models.sh)
          # — the phi tier silently drops the `tools` field entirely
          # (prompt_tokens stays at 9 with a tool attached), so an Agent
          # that needs get_my_accounts must select this model.
          - 'gpt-oss-20b'
        fetch: false
      titleConvo: true
      titleModel: 'demo-llm-proxy'

    - name: 'PingOne Privilege (OpenAI)'
      # The PingOne Privilege AI Gateway's OpenAI lane (ping-devops-curtismuir).
      # The key is a Privilege virtual key, not an OpenAI key: the gateway
      # injects the provider credential and enforces this key's model
      # allowlist and spend caps. Measured 2026-09-13: gpt-4o-mini and gpt-4o
      # answer 200 and return tool_calls; gpt-4.1-mini and gpt-5-mini answer
      # 403 "not allowed for this key". The key lives in librechat/.env.
      apiKey: '${PRIVILEGE_LLM_VIRTUAL_KEY_OPENAI}'
      baseURL: 'https://mcpgw.ai-demo.ping-devops.com/llm/openai/v1'
      models:
        default:
          - 'gpt-4o-mini'
          - 'gpt-4o'
        # /v1/models lists OpenAI's whole catalog, not this key's allowlist.
        fetch: false
      titleConvo: true
      # Must be on the key's allowlist — demo-llm-proxy would 403.
      titleModel: 'gpt-4o-mini'

mcpServers:
  # Doors that work against the local stack (2026-09-13). The façade doors'
  # sign-in server http://localhost:3005 is reachable through the oauth-loopback
  # sidecar in docker-compose.yml. Doors with OAuth need each LibreChat user to
  # Connect once (PingOne login). privilege-agentless, agent-gateway (SE host)
  # and banking-direct stay out: their SE hosts were torn down with
  # ping-devops-cmuir; librechat.pingaws.yaml still carries them. Use every door
  # from an Agent with a few tools selected — see
  # docs/superpowers/plans/2026-08-24-librechat-privilege-mcp-client.md Task 5.

  # Direct — this repo's mcp-server on the host (docker-compose.yml :8080).
  # The local stack runs it with MCP_AUTH_DISABLED=true, so there is no
  # 401 challenge and LibreChat never starts OAuth: tool calls just work.
  # (With auth enabled this entry could NOT work from inside Docker — the
  # server's RFC 9728 metadata names http://localhost:8080/mcp, and
  # LibreChat refuses OAuth when that origin differs from the URL below.)
  aidemo-mcp:
    type: streamable-http
    title: 'Sports Direct'
    url: 'http://host.docker.internal:8080/mcp'
    # The server still publishes RFC 9728 metadata, so LibreChat's startup
    # probe would flag it "OAuth Required" and then refuse the flow for the
    # origin mismatch above. Declaring an admin apiKey is LibreChat's
    # documented way to skip OAuth detection (detectOAuth: apiKey set and no
    # oauth block => requiresOAuth=false); the value is irrelevant because
    # MCP_AUTH_DISABLED ignores the bearer (verified: `Bearer none` -> 200).
    apiKey:
      source: admin
      authorization_type: bearer
      key: none
    timeout: 60000

  # Super Sports through the Node Agent Gateway (demo_mcp_gateway) via the
  # recording façade: real PingOne Authorize decisions (mock PDP locally).
  # Reads PERMIT; extend_rental is denied missing_act and
  # sensitive_membership_details a2a_delegation_required for a user token.
  super-sports-gateway:
    type: streamable-http
    title: 'Sports'
    url: 'https://api.ping.demo:3001/mcp-facade/agent-gateway/mcp'
    timeout: 60000

  # OpenSearch, three ways, same OpenSearch MCP server behind each:
  # 1. Direct, no Privilege. Needs the Mac port-forward running:
  #      kubectl --context us -n ping-devops-curtismuir \
  #        port-forward svc/opensearch-mcp-server 9900:80
  #    No auth; 9 tools (ClusterHealthTool, ListIndexTool, CountTool, ...).
  opensearch-direct:
    type: streamable-http
    title: 'OS Direct'
    url: 'http://host.docker.internal:9900/mcp'
    timeout: 60000

  # 2. Through the recording façade to the Privilege AI Gateway's opensearch22
  #    app. The façade holds the Privilege leg server-side
  #    (services/privilegeGatewaySession.js) — sign in once at
  #    /privilege-mcp-client after a gateway restart — and records the trace.
  #    A 403 "doesn't have access to MCP app" means the Privilege policy lapsed.
  opensearch-privilege-gateway:
    type: streamable-http
    title: 'OS Priv'
    url: 'https://api.ping.demo:3001/mcp-facade/privilege-gateway/opensearch22/mcp'
    timeout: 60000

  # 3. Straight to the Privilege AI Gateway's opensearch22 app. LibreChat signs
  #    in against the gateway's own OAuth server
  #    (https://mcpgw.ai-demo.ping-devops.com/opensearch22); public host, so no
  #    allowedAddresses entry and no sidecar.
  privilege-opensearch22:
    type: streamable-http
    title: 'OS22 Priv'
    url: 'https://mcpgw.ai-demo.ping-devops.com/opensearch22/mcp'
    timeout: 60000

  # 6. The Privilege `aggregate` app (type MCP Aggregate): opensearch (9 tools)
  #    and banking-mcp (33 tools) behind one URL, tool names prefixed
  #    `<server>__`. Reachable through the AI Gateway only. 42 tools is more
  #    schema than the gpt-oss tier holds — select a few from an Agent.
  privilege-aggregate:
    type: streamable-http
    title: 'Aggregate'
    url: 'https://mcpgw.ai-demo.ping-devops.com/aggregate/mcp'
    timeout: 60000

  # 7. Same aggregate app through the recording façade (trace in the demo).
  #    Sign in once at /privilege-mcp-client for the gateway leg.
  aggregate-privilege-gateway:
    type: streamable-http
    title: 'Aggregate Facade'
    url: 'https://api.ping.demo:3001/mcp-facade/privilege-gateway/aggregate/mcp'
    timeout: 60000
