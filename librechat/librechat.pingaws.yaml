# librechat/librechat.pingaws.yaml
# Same shape as librechat.yaml, pointed at the SE AWS cluster
# (ai-demo.ping-devops.com, ./run-pingaws.sh) instead of the local docker
# stack. Select it via CONFIG_PATH — see librechat/docker-compose.yml.
#
# The two purely local doors (aidemo-mcp, opensearch-direct — a host-local
# mcp-server and a Mac-only kubectl port-forward) have no pingaws
# equivalent and are dropped here, not translated.
#
# For schema reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.14
cache: true

# No mcpSettings.allowedAddresses block: LibreChat's SSRF guard
# (packages/api: isSSRFTarget / resolveHostnameSSRF) only blocks a
# server URL that resolves to a PRIVATE address — every entry in the
# docker variant needed listing because it named a host-gateway alias or
# a local TLS hostname. ai-demo.ping-devops.com is a public AWS-fronted
# domain, so it needs no allowlist entry.

endpoints:
  custom:
    - name: 'Local LLM Proxy'
      # Unchanged from the docker variant on purpose: LibreChat itself
      # still runs locally in Docker regardless of which MCP backend it
      # talks to, and the LLM proxy (demo_llm_proxy/, :8090) has no
      # pingaws-hosted equivalent exposed — see demo_llm_proxy/ ingress
      # check. "docker vs pingaws" is only about which mcpServers doors
      # are wired below, not where inference happens.
      apiKey: 'none'
      baseURL: 'http://host.docker.internal:8090/v1'
      models:
        default:
          - 'demo-llm-proxy'
          - 'gpt-oss-20b'
        fetch: false
      titleConvo: true
      titleModel: 'demo-llm-proxy'

mcpServers:
  # Through the pingaws-hosted mcp-facade — same recording proxy as the
  # docker variant (demo_api_server, PR #2356), reached over the SE
  # ingress instead of api.ping.demo:3001. No port suffix: se-ingress.yaml
  # routes /mcp-facade/* on this host straight to the BFF (verified live
  # 2026-08-25: /mcp-facade/agentless/.well-known/oauth-protected-resource
  # -> 200).

  # 1. OpenSearch through the Privilege AI Gateway. This was the `agent`
  #    door (Priv Agent mode) until 2026-09-05, when it was deleted — its
  #    mesh frontend still resolved through the Priv Agent's DNS proxy
  #    while nothing served the port, so it hung instead of failing. That
  #    also settles the "UNVERIFIED" note this comment used to carry about
  #    whether an in-cluster facade could reach the Mac-local Priv Agent:
  #    the question is moot, nothing routes that way any more. The facade
  #    holds the AI Gateway leg server-side
  #    (services/privilegeGatewaySession.js) — sign in once at
  #    /privilege-mcp-client after a gateway restart.
  opensearch-privilege-gateway:
    type: streamable-http
    url: 'https://ai-demo.ping-devops.com/mcp-facade/privilege-gateway/opensearch22/mcp'
    timeout: 60000

  # 2. Via the Agentless gateway — the `external` Privilege application
  #    (privilege/AGENTLESS-CONFIGURATION.md). Same door as the docker
  #    variant's #4, over the SE ingress instead.
  #
  # Use it from an Agent, not the plain chat picker: the plain picker
  # attaches every tool the hosted catalog exposes (242 observed live,
  # ~30k tokens of schema — more than the 16k-ctx gpt-oss tier holds),
  # while the Agent builder's MCP tool dialog lets you select just the
  # one tool you need.
  privilege-agentless:
    type: streamable-http
    url: 'https://ai-demo.ping-devops.com/mcp-facade/agentless/mcp'
    timeout: 60000

  # 3. Via the Agent Gateway (demo_mcp_gateway) — the OAuth broker from
  #    PR #2353 (RFC 8414 + 7591), fronted by the same facade. Same door
  #    as the docker variant's #5, over the SE ingress instead.
  agent-gateway:
    type: streamable-http
    url: 'https://ai-demo.ping-devops.com/mcp-facade/agent-gateway/mcp'
    timeout: 60000
