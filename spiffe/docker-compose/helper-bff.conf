agent_address = "/run/spire-agent/sockets/agent.sock"
cert_dir = "/run/spiffe"
svid_file_name = "svid.pem"
svid_key_file_name = "svid.key"
svid_bundle_file_name = "bundle.pem"
# SVIDs live in a shared volume; the consumers (BFF appuser, gateway node user)
# are NOT root, so the files must be world-readable. Dev-only: the key never
# leaves the container's shared volume on a private Docker network.
cert_file_mode = 0644
key_file_mode = 0644
jwt_svids = [{ jwt_audience = "bxfinance.demo", jwt_svid_file_name = "svid.jwt" }]
daemon_mode = true
