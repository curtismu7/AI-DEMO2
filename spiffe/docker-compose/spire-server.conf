server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/server/private/api.sock"
  trust_domain = "bxfinance.demo"
  data_dir = "/opt/spire/data/server"
  log_level = "INFO"
  ca_key_type = "rsa-2048"
  jwt_key_type = "rsa-2048"
  # Adds the iss claim to minted JWT-SVIDs; must match the OIDC discovery
  # provider's advertised issuer so PingFederate's JWT Token Processor 2.0
  # can match the token against its Allowed Issuers table.
  jwt_issuer = "https://local.ping-devops.com:8443"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" { plugin_data {} }
  KeyManager "disk" {
    plugin_data { keys_path = "/opt/spire/data/server/keys.json" }
  }
}
