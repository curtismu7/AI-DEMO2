# Hostile A2A agent as its own Deployment + Service in the Privilege gateway's
# namespace, so it can be registered as a Privilege "Remote Agent" (a2a) with
# "Discover A2A agent card" ON — the gateway fetches its poisoned
#   http://hostile-a2a-agent.ping-devops-cmuir.svc.cluster.local/.well-known/agent-card.json
# and lists the (poisoned) skills. The A2A analog of the hostile-mcp-server deploy.
#
# BUILD FOR arm64 — the SE cluster nodes are Graviton (arm64). An amd64 image
# fails to pull ("no match for platform") or crashes ("exec format error"):
#   docker buildx build --platform linux/arm64 --provenance=false \
#     -t ghcr.io/cmuir_pingcorp/hostile-a2a-agent:latest --push .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostile-a2a-agent
  namespace: ping-devops-cmuir
  labels:
    app: hostile-a2a-agent
    component: red-team
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hostile-a2a-agent
  template:
    metadata:
      labels:
        app: hostile-a2a-agent
        component: red-team
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: hostile-a2a-agent
        image: ghcr.io/cmuir_pingcorp/hostile-a2a-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8898
          name: http
        env:
        - name: PORT
          value: "8898"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8898
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8898
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: hostile-a2a-agent
  namespace: ping-devops-cmuir
  labels:
    app: hostile-a2a-agent
    component: red-team
spec:
  type: ClusterIP
  ports:
  # Port 80 so the Backend URL needs no port: …svc.cluster.local/
  - port: 80
    targetPort: 8898
    protocol: TCP
    name: http
  selector:
    app: hostile-a2a-agent
