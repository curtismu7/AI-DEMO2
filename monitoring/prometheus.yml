# Prometheus scrape config — shared by Docker Compose and Kubernetes.
#
# k8s/create-secrets.sh turns this file into the `prometheus-config` ConfigMap
# (same trick as ping-gateway-config), so there is exactly one copy of this
# config in the repo and both deployment targets read it.
#
# PingGateway publishes Prometheus metrics on its admin connector by default —
# nothing to add there. The Node MCP/resource servers below were OTel-traces-only
# (a different pipeline, to Jaeger) until each grew its own small prom-client
# /metrics route (see demo_mcp_gateway/src/metrics.ts and its siblings) — small
# because it wraps each service's single existing message-dispatch chokepoint
# rather than adding new instrumentation surface.
#
# Every target below serves /metrics unauthenticated, same posture as
# PingGateway's own admin connector. All stay cluster-internal; only Grafana is
# reachable from outside.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: ai-demo

# Alert rules live next door. Routed to Alertmanager below — visible in
# Grafana's Alerting page — but Alertmanager has no external receiver
# configured, so nothing pages or posts anywhere yet. See alerts.yml.
rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: pinggateway
    # Version is part of the path — PingGateway 2026.x dropped the older
    # /openig prefix, so this is the current location, not a legacy alias.
    metrics_path: /metrics/prometheus/0.0.4
    static_configs:
      - targets: ['ping-gateway:8085']
        labels:
          service: pinggateway

  - job_name: mcp-gateway
    static_configs:
      - targets: ['mcp-gateway:3005']
        labels:
          service: mcp-gateway

  - job_name: mcp-server
    static_configs:
      - targets: ['mcp-server:8080']
        labels:
          service: mcp-server

  - job_name: mcp-resource-server
    static_configs:
      - targets: ['mcp-resource-server:8081']
        labels:
          service: mcp-resource-server

  - job_name: api-resource-server
    static_configs:
      - targets: ['api-resource-server:8082']
        labels:
          service: api-resource-server
